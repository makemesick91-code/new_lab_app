# PROPOSAL — INACTIVE (owner directive D8, 2026-11-25). This file is NOT in .github/workflows/ and does not run.
# Activating it is a separate owner decision: copy it to .github/workflows/restore-drill-real-sandbox.yml.
#
# The dedicated real-sandbox gate for the R6-B6 isolated restore drill, on DISPOSABLE infrastructure only: each job
# runs on a fresh GitHub-hosted VM that is discarded afterwards. It uses no self-hosted or shared runner, no secret,
# no production host and no production data. It adds nothing to the existing gates and changes none of them.
#   system-mode-sandbox  the drill's sandbox profile in a SYSTEM unit with DynamicUser (identity separation for real),
#                        against stand-ins the gate creates itself;
#   vm-boot              builds the drill VM image from Ubuntu's signed cloud image and drives
#                        scripts/restore-drill-vm.sh end to end under KVM.
name: restore-drill-real-sandbox

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-drill-real-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  system-mode-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 16.15+ binaries (Ubuntu archive); the packaged cluster is removed
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16
          sudo pg_dropcluster --stop 16 main || true
          /usr/lib/postgresql/16/bin/psql --version | grep -Eq '^psql \(PostgreSQL\) 16\.(1[5-9]|[2-9][0-9])' || { echo "psql older than 16.15"; exit 1; }
      - name: Real sandbox, system mode (DynamicUser)
        run: bash deploy/restore-drill-vm/ci/real-sandbox-gate.sh system "$RUNNER_TEMP/gate-system"
      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill-real-sandbox-system
          path: ${{ runner.temp }}/gate-system/results-*.txt

  vm-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: KVM for the runner user, QEMU and libguestfs
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils libguestfs-tools ubuntu-cloudimage-keyring
          sudo chmod 0644 /boot/vmlinuz-* || true
      - name: Ubuntu 24.04 cloud image, verified against Ubuntu's signed SHA256SUMS
        run: |
          base=https://cloud-images.ubuntu.com/releases/noble/release
          curl -fsSLO "$base/SHA256SUMS" && curl -fsSLO "$base/SHA256SUMS.gpg"
          gpgv --keyring /usr/share/keyrings/ubuntu-cloudimage-keyring.gpg SHA256SUMS.gpg SHA256SUMS
          img=ubuntu-24.04-server-cloudimg-amd64.img
          curl -fsSLO "$base/$img"
          sha="$(grep " \*$img\$" SHA256SUMS | cut -d' ' -f1)"
          bash scripts/restore-drill-vm-image.sh "$img" "$sha" "$RUNNER_TEMP/drill.qcow2"
      - name: VM boot gate
        run: bash deploy/restore-drill-vm/ci/vm-boot-gate.sh "$RUNNER_TEMP/drill.qcow2" "$RUNNER_TEMP/gate-vm"
      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill-vm-boot
          path: ${{ runner.temp }}/gate-vm/
