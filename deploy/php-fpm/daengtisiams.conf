; INFRA-SEC-RUNTIME-1 — dedicated DaengtisiaMS PHP-FPM pool.
;
; Installed to /etc/php/8.3/fpm/pool.d/daengtisiams.conf by
; scripts/provision-runtime-identity.sh. Tracked here so the production pool has
; a reviewable, idempotent source instead of being a one-time hand edit in /etc.
;
; WHY: DaengtisiaMS previously ran on the distribution default `www` pool as
; www-data — the SAME uid as the co-tenant application on this shared VPS. A
; file mode cannot stop a same-uid read, so the application secrets and the
; private clinical storage were reachable by another application on the host.
; This pool gives DaengtisiaMS its own unprivileged OS principal.
;
; PARITY: process-manager sizing matches the `www` pool this replaces. This pool
; changes IDENTITY, not application behaviour.
;
; UPLOAD CEILINGS — CORRECTED BY BUGFIX-MASS-UPLOAD-REQUEST-ENTITY-TOO-LARGE-1.
; This header previously stated that declaring no php_admin_value was safe
; because php.ini carried the limits "which the Legacy RME PDF upload path
; depends on". That was never true: /etc/php/8.3/fpm/php.ini holds the stock
; Debian defaults (upload_max_filesize = 2M, post_max_size = 8M), which are far
; below the application's own canonical package ceiling, and the Legacy RME
; upload path was consequently failing in production. Inheriting an untuned
; php.ini is not parity with a requirement — it is a dependency on a file this
; repository does not manage. The ceilings are therefore declared HERE, where
; they are reviewable and survive any future php.ini change.

[daengtisiams]

; ── Dedicated runtime identity (the point of this file) ─────────────────────
; Must match DMS_RUNTIME_USER / DMS_RUNTIME_GROUP in deploy/runtime-identity.conf.
; scripts/verify-runtime-isolation.sh fails the deploy if these drift.
user = daengtisiams
group = daengtisiams

; ── Dedicated socket ────────────────────────────────────────────────────────
; Distinct from every co-tenant socket, so the two applications can never be
; routed into the same worker pool.
;
; nginx runs as www-data and must be able to CONNECT here. Socket-connect
; permission is a different privilege from reading application secrets: www-data
; can hand a request to this pool, but the request is then executed as
; daengtisiams, and www-data can no longer read the environment file or the
; private clinical storage. Accepted residual (documented in the sprint doc):
; because nginx itself runs as www-data, any process with that uid can also
; reach this socket. Closing that would require a per-application reverse-proxy
; identity, which is out of scope here and does not re-open secret read.
listen = /run/php/php8.3-fpm-daengtisiams.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ── Process manager (parity with the replaced `www` pool) ───────────────────
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; ── Hardening ───────────────────────────────────────────────────────────────
; Do not leak the deploy/systemd environment into the worker: Laravel reads its
; configuration from the cached config / environment file, never from inherited
; process environment. (This is also the FPM default; declared explicitly so a
; future edit cannot silently relax it.)
clear_env = yes

; Only ever execute .php — Laravel's single front controller. Excludes .phar,
; which is in the stock default and which this application never serves.
security.limit_extensions = .php

; ── Upload ceilings (BUGFIX-MASS-UPLOAD-REQUEST-ENTITY-TOO-LARGE-1) ─────────
; Declared with php_admin_value so they are authoritative for this pool and
; cannot be weakened by a per-request ini_set or by an untuned php.ini.
;
; The APPLICATION is the authority on package size: config/legacy_mass_upload.php
; → package.max_bytes (500 MiB). These values exist only so a package the
; application WOULD accept is not refused by the runtime first, and so a package
; the application would REJECT still reaches the application's own validator and
; earns a reasoned Indonesian message instead of a bare status code.
;
; upload_max_filesize matches the application ceiling exactly. post_max_size is
; higher because the request is multipart/form-data: the ZIP part plus the part
; boundaries, the CSRF token and the remaining form fields. Keeping
; post_max_size > upload_max_filesize is mandatory — if the whole POST is
; rejected for exceeding post_max_size, PHP discards $_POST entirely, the CSRF
; token vanishes and the operator gets "Page Expired" (419) instead of a size
; message. nginx's client_max_body_size is pinned to the SAME 512 MiB, so nginx
; is always the outer bound and that 419 path is unreachable in practice.
php_admin_value[upload_max_filesize] = 500M
php_admin_value[post_max_size] = 512M

; Time to RECEIVE and parse the request body. nginx buffers the request body in
; full before handing it to this pool (fastcgi_request_buffering is on by
; default), so this budget is spent reading a local buffer, not waiting on a
; slow clinic uplink — a stalled client is still bounded by nginx's own
; client_body_timeout. The stock 60s could not receive a large package.
php_admin_value[max_input_time] = 900

; Raised from the stock 128M for archive preflight. NOT for the package body:
; the intake path is streamed end to end — hash_file() over the upload,
; $disk->put($path, $stream) to the private workspace, and extraction via
; ZipArchive::getStream() read in 256 KiB chunks — so a package the size of the
; ceiling is never held in memory. The headroom is for the ZipArchive central
; directory of up to max_entries (1200) entries plus framework overhead.
; Worst case is bounded by pm.max_children (5), so this pool can consume at most
; ~1.25 GiB of the host's 7.8 GiB.
php_admin_value[memory_limit] = 256M

; max_execution_time is DELIBERATELY NOT SET HERE. It stays at the php.ini value
; (30s) for every request on this pool, so a slow page or a runaway query is
; still cut off. The mass-upload intake path raises it for ITSELF at runtime
; (max_execution_time is PHP_INI_ALL), which is the narrowest scope available:
; upload_max_filesize, post_max_size and max_input_time are PHP_INI_PERDIR and
; cannot be set per route, which is why those three must live at pool level.
