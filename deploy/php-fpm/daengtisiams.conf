; INFRA-SEC-RUNTIME-1 — dedicated DaengtisiaMS PHP-FPM pool.
;
; Installed to /etc/php/8.3/fpm/pool.d/daengtisiams.conf by
; scripts/provision-runtime-identity.sh. Tracked here so the production pool has
; a reviewable, idempotent source instead of being a one-time hand edit in /etc.
;
; WHY: DaengtisiaMS previously ran on the distribution default `www` pool as
; www-data — the SAME uid as the co-tenant application on this shared VPS. A
; file mode cannot stop a same-uid read, so the application secrets and the
; private clinical storage were reachable by another application on the host.
; This pool gives DaengtisiaMS its own unprivileged OS principal.
;
; PARITY: process-manager sizing matches the `www` pool this replaces, and no
; php_admin_value limit is declared, so php.ini (memory_limit, upload_max_filesize,
; post_max_size — which the Legacy RME PDF upload path depends on) is inherited
; exactly as before. This pool changes IDENTITY, not application behaviour.

[daengtisiams]

; ── Dedicated runtime identity (the point of this file) ─────────────────────
; Must match DMS_RUNTIME_USER / DMS_RUNTIME_GROUP in deploy/runtime-identity.conf.
; scripts/verify-runtime-isolation.sh fails the deploy if these drift.
user = daengtisiams
group = daengtisiams

; ── Dedicated socket ────────────────────────────────────────────────────────
; Distinct from every co-tenant socket, so the two applications can never be
; routed into the same worker pool.
;
; nginx runs as www-data and must be able to CONNECT here. Socket-connect
; permission is a different privilege from reading application secrets: www-data
; can hand a request to this pool, but the request is then executed as
; daengtisiams, and www-data can no longer read the environment file or the
; private clinical storage. Accepted residual (documented in the sprint doc):
; because nginx itself runs as www-data, any process with that uid can also
; reach this socket. Closing that would require a per-application reverse-proxy
; identity, which is out of scope here and does not re-open secret read.
listen = /run/php/php8.3-fpm-daengtisiams.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ── Process manager (parity with the replaced `www` pool) ───────────────────
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; ── Hardening ───────────────────────────────────────────────────────────────
; Do not leak the deploy/systemd environment into the worker: Laravel reads its
; configuration from the cached config / environment file, never from inherited
; process environment. (This is also the FPM default; declared explicitly so a
; future edit cannot silently relax it.)
clear_env = yes

; Only ever execute .php — Laravel's single front controller. Excludes .phar,
; which is in the stock default and which this application never serves.
security.limit_extensions = .php
