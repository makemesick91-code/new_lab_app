# R6-B13: the application-managed file trees holding clinical or patient data, relative to storage/app.
# <root name> <path under storage/app> <class>
#   immutable: the application never changes or deletes a committed file there; a change or deletion is an alert.
#   mutable:   the application itself deletes or replaces files there (pre-publish re-render, workspace cleanup,
#              hard delete, temporary scans); changes are reported, not alerted.
# Database dumps (backups/) are covered by the database backup, not here. Keep this list in step with
# config/filesystems.php and the asset map; ClinicalAssetBackupTest checks that every private disk root is listed.
clinical-evidence      clinical-evidence-private        immutable
legacy-rme             legacy-rme-private               mutable
legacy-odontogram      legacy-odontogram-private        mutable
legacy-mass-upload     legacy-mass-upload-private       mutable
refund-evidence        rme-refund-settlement-private    immutable
local-private          private                          mutable
public-legacy-clinical public                           mutable
evidence-migration     clinical-evidence-migration      immutable
