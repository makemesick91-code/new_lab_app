# DaengtisiaMS — production host identity authority.
#
# DMS-POST-MIGRATION-DEV-INFRA-ALIGNMENT-1 (2026-11-04). Production moved from
# Hostinger to Biznet Gio on 2026-11-03. Every document, check and test that
# names "the production host" agrees with THIS file; when the host changes, this
# file changes first and the guard suite fails until everything else follows.
#
# Shell-sourceable KEY=VALUE, the same convention as deploy/runtime-identity.conf.
# It holds PUBLIC facts only: the address is published in DNS and the host-key
# fingerprint is offered to every client that connects. Never add a private key,
# a password, a token or any content of the environment file here.
#
# Consumers:
#   - scripts/production-target-check.sh   (workstation-side positive identity check)
#   - tests/Feature/Cicd/ProductionHostIdentityGuardTest.php
#   - docs/runbooks/production-host-identity.md and CLAUDE.md CG-14
#   - scripts/lib/release-approval.sh               (exact approved release SHA guard, rule 229)
#   - scripts/deploy-vps-runner.sh, scripts/deploy-immutable-exec.sh (release guard trust, rule 231)

# ── Active production ───────────────────────────────────────────────────────
DMS_PRODUCTION_PROVIDER="Biznet Gio"
DMS_PRODUCTION_HOSTNAME=DaengtisiaMS
DMS_PRODUCTION_ADDRESS=139.190.106.38
DMS_PRODUCTION_DOMAIN=daengtisia.online
DMS_PRODUCTION_APP_DIR=/var/www/asia-dental-lab-v2
# The only workstation alias that may reach production. It must resolve to the
# address above, as the admin account below, with strict host-key checking.
DMS_PRODUCTION_SSH_ALIAS=daengtisiams-biznet-prod
# Administrative login. Root has no SSH login on this host; privileged steps run
# through `sudo -n`. The application runtime identity is NOT this account — it is
# DMS_RUNTIME_USER in deploy/runtime-identity.conf.
DMS_PRODUCTION_ADMIN_USER=dmsadmin
# Pinned host key. A different key is a stop-and-escalate event, never a prompt
# to accept and never something to refresh with ssh-keyscan.
DMS_PRODUCTION_HOST_KEY_TYPE=ED25519
DMS_PRODUCTION_HOST_KEY_SHA256=SHA256:i3AsyL0oSwqSAwNfgv215Cl01i87buYtH5ugTe8O2bc

# ── Release identity (rule 229, exact approved release SHA guard) ──────────
# The canonical repository production deploys from, as OWNER/REPO. The guard
# refuses a checkout whose `origin` is anything else, and a release approval
# record that names anything else.
DMS_PRODUCTION_REPOSITORY=makemesick91-code/new_lab_app
# The branch production follows (CG-01). scripts/deploy-vps.sh pins the same
# value; a release approval record must name it.
DMS_PRODUCTION_DEPLOY_BRANCH=feature/sprint-26-phase-26-8-stabilization-closure-go-watch-no-go-report
# Who may approve a production release (CG-22). A record names one of these as
# DMS_APPROVAL_APPROVED_BY, and since rule 231 it must also carry that
# principal's SSH signature (`ssh-keygen -Y sign -n dms-release-approval`).
DMS_PRODUCTION_RELEASE_APPROVERS="owner"

# ── Release guard trust (rule 231, DMS-RELEASE-GUARD-TRUST-HARDENING-1) ─────
# The public host key this host presents; its SHA256 fingerprint must equal
# DMS_PRODUCTION_HOST_KEY_SHA256 above, and every approval record names it.
DMS_PRODUCTION_HOST_KEY_FILE=/etc/ssh/ssh_host_ed25519_key.pub
# The release trust anchor: an OpenSSH allowed-signers file mapping each
# approver principal to their PUBLIC signing key. It lives on the host, outside
# the repository and the checkout, root-owned and not group/world-writable; the
# owner provisions it (docs/runbooks/production-host-identity.md section 6d).
# Nothing in this repository can stand in for it.
DMS_PRODUCTION_RELEASE_TRUST_ANCHOR=/etc/daengtisiams/release-approvers.allowed_signers
# The deploy runner's evidence directory: root's own (0700), outside the
# checkout, never under storage/ (the runtime user owns that after a deploy).
DMS_PRODUCTION_DEPLOY_EVIDENCE_DIR=/var/lib/daengtisiams-deploy/runner

# ── Frozen legacy infrastructure ────────────────────────────────────────────
# The Hostinger VPS is WRITE-FROZEN: a historical migration source only. Nothing
# deploys, migrates, restarts or writes there. A target that matches ANY value
# below is refused, whatever else it claims to be.
DMS_FROZEN_LEGACY_PROVIDER=Hostinger
DMS_FROZEN_LEGACY_HOSTNAMES="srv1730088"
DMS_FROZEN_LEGACY_ADDRESSES="145.79.13.224"
# Workstation aliases that historically named "the VPS". `daengtisiams-vps` was
# re-pointed at the frozen Hostinger address before the DNS flip, so its name
# now actively misleads. It is never a production alias.
DMS_FROZEN_LEGACY_SSH_ALIASES="daengtisiams-vps"
