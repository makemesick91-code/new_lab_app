# INFRA-SEC-RUNTIME-1 — DaengtisiaMS dedicated runtime identity.
#
# THE single authority for "which OS principal runs DaengtisiaMS". Sourced by
# scripts/deploy-vps.sh, scripts/rollback-vps.sh, scripts/provision-runtime-identity.sh
# and scripts/verify-runtime-isolation.sh.
#
# WHY THIS FILE EXISTS
# Before this sprint the deploy script discovered its runtime user by grepping
# every PHP-FPM pool on the host and taking the FIRST match. That was only ever
# "correct" because every pool on this shared VPS ran as www-data. The host is
# shared with a co-tenant application (aish-pos) that also ran under www-data,
# so a file mode could never stop a same-UID read of DaengtisiaMS secrets, and
# the moment a second pool with a different user existed the heuristic became
# ambiguous — it would resolve whichever pool the directory walk happened to
# return first, silently handing DaengtisiaMS the co-tenant's identity.
#
# RULES
#  - Shell-sourceable KEY=value only. No secrets, ever. This file is committed.
#  - Resolution is explicit. There is NO fallback: a missing/unreadable file, a
#    missing OS account, or a forbidden identity aborts the deploy (fail closed).
#  - The runtime user is NEVER root and NEVER a shared/co-tenant account.

# Dedicated, unprivileged, no-login system account that runs the DaengtisiaMS
# PHP-FPM pool, the queue worker and every background unit.
DMS_RUNTIME_USER=daengtisiams
DMS_RUNTIME_GROUP=daengtisiams

# Identities that must never own the DaengtisiaMS runtime. `root` would make the
# runtime all-powerful; `www-data` is the shared co-tenant account this sprint
# exists to move away from. Space separated.
DMS_FORBIDDEN_RUNTIME_USERS="root www-data nobody daemon postgres"

# Dedicated PHP-FPM pool. NOT the distribution default `www` pool, which is
# shared-by-convention and runs as www-data.
DMS_FPM_PHP_VERSION=8.3
DMS_FPM_POOL=daengtisiams
DMS_FPM_SERVICE=php8.3-fpm
DMS_FPM_POOL_DIR=/etc/php/8.3/fpm/pool.d
DMS_FPM_POOL_FILE=/etc/php/8.3/fpm/pool.d/daengtisiams.conf

# Dedicated FastCGI socket. Must differ from every co-tenant socket so the two
# applications can never be routed into the same worker pool.
DMS_FPM_SOCKET=/run/php/php8.3-fpm-daengtisiams.sock

# The distribution default pool on this PHP version. DaengtisiaMS used to be
# served by it; provisioning disables it (rename to .disabled) once nginx points
# at the dedicated socket, so no www-data pool is left able to execute
# DaengtisiaMS code. Leave empty to skip.
DMS_FPM_DEFAULT_POOL_FILE=/etc/php/8.3/fpm/pool.d/www.conf

# nginx: the reverse proxy keeps running as www-data (it only needs to CONNECT
# to the socket, which is a different privilege from reading application
# secrets). Only the fastcgi_pass target is rewritten, in place, so the
# `listen 80 default_server` that keeps DaengtisiaMS reachable on the shared
# host is preserved.
DMS_NGINX_SITE=/etc/nginx/sites-available/asia-dental-lab
DMS_NGINX_CONNECT_USER=www-data
DMS_NGINX_CONNECT_GROUP=www-data

# systemd units that must run as the dedicated identity.
DMS_QUEUE_SERVICE=daengtisiams-queue-worker.service
DMS_QUEUE_UNIT_SOURCE=deploy/systemd/daengtisiams-queue-worker.service
DMS_BACKGROUND_SERVICES="daengtisiams-pilot-snapshot.service"

# Application root on the production host.
DMS_APP_DIR=/var/www/asia-dental-lab-v2

# Owner of the secret-bearing environment file. root (not the runtime user), so
# the runtime can READ its configuration through the group but can never rewrite
# it. INFRA-SEC-ENV-1 owns the mode; this declares the owner the verifier expects.
DMS_SECRET_OWNER=root

# Runtime-writable paths. The dedicated identity owns EXACTLY these; everything
# else in the checkout stays deploy/root owned and read-only to the runtime.
DMS_RUNTIME_WRITABLE_PATHS="storage bootstrap/cache"

# Representative tracked source paths the runtime must NEVER be able to write.
# Verified with test -w as the runtime user; nothing is modified.
#
# This list deliberately includes THIS FILE and the isolation verifier. Both are
# `source`d / executed as root by the deploy and rollback paths, so a runtime
# able to write either would gain root code execution on the next deploy. They
# are root-owned by virtue of the checkout — but the whole point of this sprint
# is to assert invariants rather than assume them.
DMS_SOURCE_IMMUTABLE_PATHS="artisan composer.json bootstrap/app.php scripts/deploy-vps.sh scripts/rollback-vps.sh scripts/provision-runtime-identity.sh scripts/verify-runtime-isolation.sh scripts/harden-secret-permissions.sh deploy/runtime-identity.conf"

# Private clinical evidence + secret-bearing paths the co-tenant runtime must
# not be able to read once isolation is in place.
DMS_PRIVATE_PATHS="storage/app/private storage/app/legacy-rme-private storage/app/backups"
