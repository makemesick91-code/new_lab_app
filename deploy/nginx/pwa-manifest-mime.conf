# PWA-FOUNDATION-1 — web app manifest MIME type.
#
# WHY THIS FILE EXISTS
# nginx 1.24 (the version on the production VPS) ships a mime.types table that
# has no entry for `.webmanifest`, so `public/manifest.webmanifest` would be
# served as `application/octet-stream`. The Web App Manifest specification calls
# for `application/manifest+json`; this block supplies it without touching the
# global mime.types table and without changing any other server behaviour.
#
# HOW TO APPLY (one-time, per server — production nginx config is not deployed
# from this repository, so this file is the version-controlled record of it):
#
#     # inside the DaengtisiaMS `server { ... }` block:
#     include /var/www/asia-dental-lab-v2/deploy/nginx/pwa-manifest-mime.conf;
#
#     sudo nginx -t && sudo systemctl reload nginx
#
# VERIFY:
#     curl -sSI https://daengtisia.online/manifest.webmanifest | grep -i content-type
#     # expected: content-type: application/manifest+json
#
# This block serves a public, static, non-sensitive file. It adds no header that
# affects authentication, sessions, cookies or TLS.

location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
}

# The service worker must never be served from a stale cache, or a released
# cache-policy change could take days to reach an installed device.
location = /sw.js {
    default_type application/javascript;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}
