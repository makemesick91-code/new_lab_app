# BUGFIX-MASS-UPLOAD-REQUEST-ENTITY-TOO-LARGE-1 — request body ceiling.
#
# WHY THIS FILE EXISTS
# nginx has no `client_max_body_size` anywhere in the production configuration,
# so every DaengtisiaMS upload was bounded by the nginx COMPILED DEFAULT of 1
# MiB. The application's own canonical ceiling is far higher, so nginx — not the
# application — was deciding what an operator may upload, and it answered with a
# bare `413 Request Entity Too Large` HTML page instead of the application's
# reasoned Indonesian message.
#
# Three separate clinical upload paths had already hit this in production:
#   2026-10-03  POST /settings/rme/legacy-mass-imports    2 860 825 bytes  413
#   2026-09-02  POST /settings/rme/legacy-imports         1 189 484 bytes  413
#   2026-07-10  POST /lab/workflow-requests               5 333 569 bytes  413
# It is one shared infrastructure gap, not three feature bugs.
#
# THE NUMBER
# The APPLICATION package limit is canonical (config/legacy_mass_upload.php →
# package.max_bytes, 500 MiB). Infrastructure sits deliberately just ABOVE it so
# an oversize package reaches Laravel and is refused by the application's own
# validator with a message an operator can act on, rather than by nginx with a
# status code. 512 MiB leaves a 12 MiB window over the 500 MiB application limit
# for multipart/form-data overhead (part boundaries, the CSRF token, other form
# fields) plus the band in which the clean message is produced:
#
#   <= 500 MiB   accepted; the application processes the package
#   500-512 MiB  reaches Laravel -> "Ukuran paket arsip melebihi batas yang
#                diizinkan." (the intended operator-facing refusal)
#   >  512 MiB   refused by nginx with 413
#
# This is a BOUNDED ceiling. `client_max_body_size 0` (unlimited) is forbidden:
# these are clinical documents and an unbounded archive upload is a
# denial-of-service and a disk-exhaustion surface.
#
# SCOPE
# Included inside the DaengtisiaMS `server { ... }` block only. It is NOT set at
# `http` level, so the catch-all `default_server` block, the HTTP->HTTPS redirect
# blocks and any co-tenant virtual host on this shared VPS keep nginx's 1 MiB
# default. Raising a body ceiling for hosts that only ever answer 301 or deny
# would widen an attack surface for no benefit.
#
# PAIRED PHP-FPM CHANGE — BOTH ARE REQUIRED
# nginx alone is not sufficient. The pool inherited php.ini's stock Debian
# `upload_max_filesize = 2M`, so raising only nginx moves the failure one layer
# down, where PHP silently discards the uploaded file and Laravel reports the
# misleading "Paket arsip ZIP wajib diunggah." The matching ceilings are declared
# in deploy/php-fpm/daengtisiams.conf.
#
# HOW TO APPLY (one-time, per server — production nginx config is not deployed
# from this repository, so this file is the version-controlled record of it):
#
#     # inside the DaengtisiaMS `server { ... }` block:
#     include /var/www/asia-dental-lab-v2/deploy/nginx/upload-body-size.conf;
#
#     sudo nginx -t && sudo systemctl reload nginx
#
# VERIFY:
#     sudo nginx -T | grep client_max_body_size
#     # expected: client_max_body_size 512m;
#
# This block changes no header affecting authentication, sessions, cookies or
# TLS, and grants no access. It only raises how large a request body the
# application is allowed to see.

client_max_body_size 512m;
