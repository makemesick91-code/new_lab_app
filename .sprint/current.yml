# FIX-RECEIPT-PDF-TEXT-CONTIGUITY-1 — Sprint Manifest
#
# WHAT THIS SPRINT IS. The corrective sprint for the single failure that reddened
# the one authorised consolidated Full Suite (run 32700184849):
#
#     tests/Feature/RME/RmeReceiptOnePageTest.php:215
#     expect($text)->toContain($visit->patient->name);
#
# against `pdftotext -layout` output. `-layout` serialises the VISUAL layout, so a
# value that overflows its fixed-width cell wraps and the neighbouring column is
# interleaved into the same lines. The receipt was CORRECT — the full name is
# rendered, nothing clipped, nothing mis-escaped. The assertion was testing a
# layout property while claiming to test a content property, and it failed on
# roughly 6% of faker names.
#
# THE APOSTROPHE READING IS DISPROVEN. The faker name `Miss Marcella O'Conner DVM`
# makes this look like the documented faker-vs-Blade-escaping flake class. It is
# not. Reproduced on the clean base authority e1675586:
#
#     Miss Marcella O'Conner DVM     26  FAIL
#     Alexandria Catherine Santoso   28  FAIL   <- no apostrophe, fails identically
#     Budi Santoso                   12  pass
#     O'Brien                         7  pass   <- apostrophe, passes
#
# It is length. `e()` would have changed nothing. No character threshold is encoded
# anywhere — the wrap point is a proportional-font pixel width, so the fixture is
# pinned by demonstrated behaviour instead.
#
# WHAT IT IS NOT. Not a runtime fix. RUNTIME_BEHAVIOR_CHANGE=false: four test files,
# zero application files. No Blade, CSS, column width, font size, escaping, model,
# route, permission or migration was touched. Fixing a broken test by changing
# correct production output would have hidden the defect rather than removed it.
#
# WHAT MEASUREMENT ADDED TO THE BRIEF. Measuring rather than assuming turned up two
# more layout shapes the naive contract also breaks on: a long treatment description
# is split AROUND its own qty/price row (so "join the next line" cannot rebuild it),
# and the RME visit PDF stacks its labels above full-width values. Running the new
# guard then found a third live instance — the centred clinic-name header — and a
# second affected file, MedicalRecordPrintOdontogramSeparationTest. All corrected.
#
# WHY THE EXISTING GUARDS MISSED IT. FullSuiteBaselineContractTest pinned two shapes,
# both against a rendered HTML BODY. Neither regex matches a comparison against
# PDF-extracted text. The third shape is now pinned, scoped narrowly: only files that
# extract PDF text, and only the free-text property list the assertSee guard already
# uses. `->toContain` is NOT banned wholesale. Arguments are read with a paren counter
# so one safe assertion cannot launder an unsafe one beside it, and comments are
# stripped with the tokenizer so documenting the defect does not report itself.
#
# FULL SUITE. Not authorised for this sprint. The previous authorisation was consumed
# by run 32700184849 and it failed. FULL_SUITE_EXECUTION_COUNT=0. Targeted
# reproduction only. This sprint may carry its own GO tag; it does NOT close the
# stabilization programme.

