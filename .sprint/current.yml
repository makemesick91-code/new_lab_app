# AUDIT-PATIENT-KTP-ARCHIVE-PERSISTENCE-1
#
# Audit of the KTP photo lifecycle (camera / scanner agent / manual file →
# temp → registration → permanent private document → authorized retrieval),
# closed as category C with a corrective release. The happy path was already
# correct and is production-proven; the fix closes a wrong-patient regression in
# the browser (a cleared or replaced photo stayed attached to the form), makes
# the server verify every filesystem step it used to assume (empty temp,
# checksum identity, read-back, document-row compensation), reports an
# unarchived photo to the operator instead of staying silent, and serves the
# archive with no-store / nosniff. No migration, no permission, no route, no
# pilot/env change; D7 consent and the scanner/manual fallbacks are unchanged.

