# REVISION-LEGACY-SINGLE-ACTIVE-DOCUMENT-PER-PATIENT-1
#
# One patient, one document type, one active lifecycle.
#
# THE RULE: per patient, per legacy document type, at most ONE active/non-VOID
# logical lifecycle — and the RME slot and the ODONTOGRAM slot are INDEPENDENT.
#
#   G1 a published archive blocks every NEW upload of the same type
#   G2 an in-flight (non-terminal) import blocks every NEW upload of the same type
#   G3 a canonical VOID releases the slot for a fresh correction import
#   G4 retry/resume of the SAME lifecycle is never a new upload
#   G5 RME never blocks odontogram, and odontogram never blocks RME
#
# Occupancy spans TWO tables per type (staging + archive), so it deliberately is
# NOT a partial UNIQUE index — a unique index cannot read another table. The race
# is closed by serializing the DECISION with a PostgreSQL advisory xact lock
# keyed (document type, patient id). First advisory-lock use in the codebase.
#
# NO MIGRATION. The (patient_id, status) indexes already exist on all four
# tables. No permission, route or schema change.
#
# Three decisions stated rather than silently made:
#   * FAILED OCCUPIES the slot, because FAILED -> QUEUED is legal and a failed
#     import is retryable, not abandoned;
#   * occupancy is deliberately NOT branch-scoped — it answers "what is true
#     about this patient", not "what may this operator see"; a narrower scope
#     could only ever admit a second archive;
#   * a soft-deleted staging row still OCCUPIES (withTrashed), so a delete can
#     never become an unaudited release. CANCEL and VOID are the only releases.
#
# Two things the tests caught, recorded because the first reasoning was wrong:
#   * the slot pre-check initially ran BEFORE exact-PDF duplicate detection and
#     shadowed DUPLICATE_DETECTED for same-patient re-uploads. Moved to after it;
#     cardinality supplements the checksum guard, it never replaces it.
#   * one existing test asserted the opposite of the new invariant (it staged two
#     imports for ONE patient to prove the guard keys on bytes, not filename).
#     The property is now proven across two patients.
#
# One honest negative: the concurrency proof SKIPS off PostgreSQL. On SQLite the
# advisory lock is a documented no-op, so the sequential suite proves the
# decision and a separate PostgreSQL 16 suite proves the lock.
#
# Mass/bulk legacy upload does not exist in this codebase (verified, not assumed)
# and was deliberately not built.

