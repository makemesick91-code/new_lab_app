# DMS-DEPLOY-PRIVSEP-HARDENING-1 (2026-11-15). Owner-ordered security hardening closing OD-1 DEPLOY-PRIVSEP (rule 231
# §8, audit A10; accepted for the r2 deploy only): the deploy and rollback ran PHP (composer scripts, artisan migrate,
# ~50 governance gates; the rollback's cache rebuild and smoke) and chown -R / chmod -R / find -exec chmod as ROOT over
# storage/ and bootstrap/cache, which the runtime user owns, so a runtime compromise became root at the next deploy.
# Rule 233 (docs/sprints/dms-deploy-privsep-hardening-1.md): every artisan command runs as the runtime user, composer
# runs --no-scripts with its post-autoload-dump replayed as the runtime user, the dumps and evidence files are written
# by the runtime user, root only lchowns foreign entries (find -execdir, never a hardlink) and claims top-down any
# source entry another identity owns or can write, modes are set by the runtime user, a privilege-drift gate ends the
# run NOT GO. Deploy tooling (provisioning included), authority, governance scanner, a read-only drift check and tests;
# tailwind.config.js content globs only (generated CSS byte-identical). No schema, migration, permission, role, route,
# JS or package change; no flag, enforcement scope, branch lock, queue worker, scheduler or timer change.
#
# Foundation-First Sprint Lock stays ACTIVE (allowed category: security fix / deployment). Full Suite deferred (CG-18),
# not passed. Production deployment needs the owner's written approval of the exact merged release commit and the
# owner's signature on its record (rule 231, runbook production-host-identity.md section 6b). The GO tag below is
# created only after that deploy and its verification.
#
