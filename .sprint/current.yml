# SECURITY-G7B-APP-KEY-REENCRYPTION-1 — rotating the application key without losing
# encrypted data. Laravel decrypts with the current key and then each previous key, so a
# rotated key keeps old rows readable only while the old key stays configured. Nothing
# could move rows to the new key or tell an operator whether the old key was still needed.
# Fix: config/app_key_rotation.php registers the four encrypted columns (a test fails when
# a model gains an unregistered encrypted cast); AppKeyReencryptionService classifies each
# value as current/previous/undecryptable and rewrites previous values one row per
# transaction under a row lock; `security:app-key-reencrypt` (dry run by default, counts
# only) reports and, with --apply, rewrites. No migration, no route, no permission, no
# flag. The production rotation is a separate supervised operation and is not part of
# this change.
# Carried forward: LEGACY-RME-PROGRAM-CLOSURE-1 stays CLOSED and inherited.
