# ACTIVATION-RME-INVOICE-CORRECTION-PREPAYMENT-1
#
# Activation attempt for the dormant pre-payment invoice correction (rule 190).
# Result: ACTIVATION NO_GO. Owner decisions D1 (approval authority), D7 (receipt
# versioning), D10 (pending correction vs payment) and D21 (price authority) are
# still PENDING, so the flag stays OFF and no operational role is granted a
# correction permission. D21 additionally needs tariffs for every billing branch
# (production: only TLK1 has any; SPN4 — the only billing branch — has none).
#
# What ships is the one activation prerequisite that needs no owner decision:
# every RME payment path binds the form to each settled invoice's
# `correction_version`, compared under the invoice row lock, so an applied
# correction can never be settled from a page opened before it. Refusals roll
# the whole batch back and are audited after the rollback. This holds under
# every answer to D10 (which is about PENDING corrections, still undecided).
#
# No migration, no seeder change, no permission change, no route change, no
# flag change. Rule 191.

