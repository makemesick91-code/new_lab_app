# BUGFIX-DOCTOR-PWA-WEBAUTHN-VERIFY-DEVICE-NO-FEEDBACK-2
#
# Child of REVISION-DOCTOR-PWA-WEBAUTHN-ONLY-ACCESS-1, opened by a defect the
# Stage 3 rehearsal found on real hardware.
#
# On the SPN4 pilot tablet the Verify Device control produced NO visible
# reaction — five attempts across three client configurations. Every fact about
# the failure had to be recovered afterwards from nginx and Postgres, because
# the page reported nothing at all.
#
# Root cause, evidenced: `navigator.credentials.get()` was awaited with no
# abort, so a ceremony that never settles left the catch unreached, no message
# rendered and the button disabled. A second defect sat beside it: every
# failure that DID reject collapsed into one sentence, so nobody could tell a
# missing credential from an untrusted origin from an expired session.
#
# This sprint RETIRES NOTHING, moves no flag, widens no scope and starts no
# Stage 4. It makes a failing ceremony say what failed.

id: BUGFIX-DOCTOR-PWA-WEBAUTHN-VERIFY-DEVICE-NO-FEEDBACK-2
type: RUNTIME_FIX
module: DoctorDevice
title: "Verify Device must never fail silently: bounded ceremony + typed failure feedback"
base_branch: feature/sprint-26-phase-26-8-stabilization-closure-go-watch-no-go-report

# Impact flags — declared against the CURRENT diff.
#
# frontend_change is TRUE: the fix lives in resources/js and one Blade view.
#
# security_impact is TRUE, and deliberately so even though this WIDENS nothing.
# The diff sits inside the doctor authentication path, so it is reviewed as a
# security change regardless of its direction. Nothing here weakens the
# WebAuthn requirement, the device binding, user verification,
# DoctorDeviceAuthorization, the single-session gate or pilot enforcement: a
# ceremony that fails still fails, it simply now says why.
runtime_change: true
schema_change: false
frontend_change: true
security_impact: true
branch_isolation_impact: false
ledger_impact: false

# Deploy is required: the defect is in code the CLINICIAN's browser runs, so it
# is not fixed anywhere until the built bundle is served from production. The
# proof of the fix is likewise a real-device observation, not a test run.
#
# NOTE for whoever deploys: public/build is gitignored and rebuilt on the VPS,
# so the corrected bundle only exists after `npm run build` runs there. A stale
# service worker or cached asset would keep serving the silent version.
deploy_required: true
browser_required: false

test_profiles: []

# This child tag means ONLY that the silent-failure defect is closed on a
# verified deployed runtime. It authorizes no stage move, and it is emphatically
# not the parent programme's GO.
go_tag: bugfix-doctor-pwa-webauthn-verify-device-no-feedback-2-go
go_tag_created: false

