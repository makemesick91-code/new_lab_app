# DMS-RME-REVISION-PROGRAM-3 (2026-11-05). Continuation of DMS-RME-REVISION-PROGRAM-1/2 under rule 221 §7. The owner
# approved, in the mission brief of 2026-11-05, exactly the seven route-key follow-ups Program 2 recorded in rule 222
# §1.10 (CG-22: recorded, not inferred):
#   R-09  `{diagnosis}` (7 routes, two models, both bigint `id()`), R-12 `{handwriting}` (2) and R-13
#         `{handwritingPage}` (2) took any segment: on PostgreSQL a non-key segment answered HTTP 500 with an ERROR
#         line, also for a user holding no permission (binding runs before the permission middleware).
#   R-10  `{receiptSnapshot}` (1, `int` argument) used `whereNumber`: overflow answered 500 and a leading-zero alias
#         reprinted a real receipt.
#   R-09/R-10/R-12/R-13 are domain names: now constrained globally by App\Support\Routing\DatabaseRouteKey.
#   R-11  oversight `{patient}` (1), R-14 `{record}` (19) and R-15 `{page}` (6) are generic names, constrained per
#         route. `{page}` is a page number compared against an int4 column, so it uses the new
#         DatabaseRouteKey::PAGE_NUMBER_PATTERN; an 11-to-18-digit page answered 500 (22003) under `whereNumber`.
# The Foundation-First Sprint Lock stays ACTIVE; this is an allowed category (security fix). No schema, permission,
# policy or frontend change. Full Suite deferred (CG-18), not passed.
# Carried forward: LEGACY-RME-PROGRAM-CLOSURE-1 stays CLOSED and inherited.
