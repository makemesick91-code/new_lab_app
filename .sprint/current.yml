# SECURITY-F6-TINKER-REQUIRE-DEV-1 — laravel/tinker (and with it psy/psysh and
# nikic/php-parser) was in `require`, so `composer install --no-dev` on the VPS
# shipped an interactive REPL that CG-14 forbids using: psysh writes ERROR lines
# into the application log and a REPL is an unaudited write path to clinical data.
# Fix: move laravel/tinker to require-dev; the lock moves exactly three packages to
# packages-dev with no version change. A test fails if either package returns to the
# production set. ForbiddenConsoleCommandGuard stays as the second layer.
# Carried forward: LEGACY-RME-PROGRAM-CLOSURE-1 stays CLOSED and inherited.
