# FIX-CLINIC-OVERSIGHT-DATE-RANGE-TEST-DETERMINISM-1 — test-only CI regression fix, owner approved 2026-10-31.
# ClinicOversightDashboardDateRangeTest "intersects the branch filter with the range and fails closed on a forged
# branch" created its invoice visit without a visit_date, so covVisit() used the clinical TODAY, while it asserted
# against the fixed range 2026-10-12..2026-10-30 WITA. It passed only while the WITA date lay inside that range and
# has failed every NSF-R011 critical gate since 2026-10-31 00:00 WITA (= 2026-10-30 16:00 UTC). The visit date is now
# pinned to 2026-10-15, the clinic day of its payment. No assertion changed (95 tests / 1260 assertions identical).
# Second fix, owner approved 2026-10-31 for InventoryAnalyticsServiceTest only: "groups monthly outbound value trend
# by month" used plain subMonth()/subMonths(), which on the 31st (and on 29-31 March) overflow into the CURRENT month,
# so last month's outbound was counted as this month's (800 instead of 500). The fixture now uses the NoOverflow
# variants; expected values unchanged (25 tests / 109 assertions identical).
# No app/, config/, database/, routes/, resources/, scripts/ or CI workflow change. No deploy; no GO tag (CG-16).
# Carried forward: LEGACY-RME-PROGRAM-CLOSURE-1 stays CLOSED and inherited.
