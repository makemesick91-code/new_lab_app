# CI-MONITORING-CRITICAL-TOKEN-COVERAGE-1 — Sprint Manifest
#
# The NSF-R011 critical gate selects tests with a fixed `--filter` allowlist.
# The only contract over that allowlist asked whether a TOKEN was present
# (config/ci_runner.php `critical_gate_required_filters`, CICD-CTRL-3D). That
# question cannot detect the failure that matters: a suite whose name no token
# matches is simply absent from the gate, and absence looks exactly like green.
#
# ROOT CAUSE, measured rather than assumed. Every one of the eight suites in
# tests/Unit/Services/Monitoring was selected because its filename began with
# `PilotPerformanceSnapshot`. MonitoringLogSourceResilienceTest — the suite that
# pins that the monitor reads where the application actually writes, and fails
# closed on a missing or unreadable source — does not carry that prefix, so it
# matched no token in either critical variant. Measured with the real runner at
# the base SHA: the critical filter selected 2252 tests across 130 files and
# EXACTLY ZERO of them came from that file. Its coverage was a filename
# coincidence, and renaming any sibling would have removed that sibling's
# coverage just as silently.
#
# WHY NOT "ADD A TOKEN". A bare `Monitoring` token closes this instance and
# creates two new problems: measured, it also sweeps in 15 unrelated files —
# matched through the word appearing in test DESCRIPTIONS, not because they
# carry a monitoring contract — and it still leaves coverage resting on what
# files happen to be called. The fix therefore adds the half the authority was
# missing rather than widening the half it had.
#
# THE FIX. config/ci_runner.php gains `critical_gate_mandatory_suites`: the test
# FILES that must actually run. The existing scanner derives the name PHPUnit
# filters against and requires some token in EVERY critical variant to match it.
# A declared suite that no token selects, that no longer exists, or that only
# one variant covers FAILS the gate. A rename can now move coverage; it can no
# longer delete it. Scope stays bounded — the narrow token adds exactly the one
# missing file, and the directory's completeness is itself asserted so a future
# monitoring suite cannot be added undeclared.

