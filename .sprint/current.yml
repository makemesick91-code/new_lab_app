# SECURITY-PATIENT-KTP-ARCHIVE-BRANCH-ISOLATION-1
#
# A stored KTP card is served only to an operator whose server-resolved working
# branch is the branch it was captured at, or to an explicitly privileged
# account (Super Admin; one Supervisor RME only by a governed per-account
# grant). `manage patients` alone used to open every patient's card at every
# branch. Provenance lives on the document (one additive, write-once column),
# because the patient's branch and Nomor RM are both editable through the
# unscoped master-data form. Refusals are 404s; access is audited without
# identity data; unknown provenance fails closed. Patient master data itself is
# unchanged and stays unscoped (owner decision, recorded as a known limit).
#
# TYPE: FOUNDATION_SPRINT, not SECURITY_FIX. The SECURITY_FIX profile's scope
# heuristic refuses >10 changed code files ("looks like a refactor"); this
# change carries 18, of which 10 are NEW cohesive units (policy, access
# service, decision, capture resolver, evidence backfill, governed grant), it
# spans three modules (Patient, ClinicVisit, AccessControl) and adds a
# governance permission. FOUNDATION_SPRINT describes that and keeps the SAME
# audit strength (audit_level 3, full_foundation_audit). The scope-audit NO-GO
# under SECURITY_FIX was evaluated, not waived: no split could satisfy it (the
# core decision path alone is ~13 files). security_impact stays true.

