# FEATURE-RME-MEDICAL-RECORDS-UNIFIED-NATIVE-LEGACY-1
#
# /rme/medical-records becomes a UNIFIED, PATIENT-CENTRIC clinical READ index:
# one row per patient holding a native medical record OR a PUBLISHED legacy
# RME OR a PUBLISHED legacy odontogram the actor may read. Before this sprint
# the page listed one row per NATIVE medical record only; production holds 0
# native records after the estate reset, so it showed nobody, while 19 legacy
# RME archives and 1 legacy odontogram were reachable only through a visit.
#
# READ MODEL ONLY. Native and legacy storage stay separate. Nothing creates a
# visit, a medical record, or copies a legacy PDF into a native table.
#
# NON-WIDENING BY CONSTRUCTION: each source carries its OWN canonical envelope,
# composed from the existing authorities rather than re-derived:
#   native  : BranchService::rmeEnabledIds() — unchanged from the old list;
#   legacy  : LegacyRmeRecordPolicy::READ_PERMISSIONS + LegacyRmeWorkspaceScope;
#   odonto  : LegacyOdontogramRecordPolicy::READ_PERMISSIONS + LegacyOdontogramWorkspaceScope;
#   all     : DoctorPatientScopeService::applyPatientScopeForUser (patient-keyed,
#             the same predicate all three canonical readers apply).
# Inclusion is therefore never wider than what the canonical viewer of that
# source would let the same actor open. Request branch_id is never read.
#
# ELIGIBILITY: PUBLISHED only. VOID never qualifies; a VOID record replaced by a
# fresh PUBLISHED import qualifies through the replacement. Staging tables are
# never read. Soft-deleted patients never appear.
#
# PAGINATION AFTER THE UNION: count over the eligibility predicate alone, then
# a page of ids ordered by one sort key (latest record in scope across readable
# sources, id tie-break), then indicators for those ids only. Constant query
# count. Measured on production (19 eligible): every query < 1 ms. Synthetic
# 50k patients / 120k native / 20k legacy on PG16: page 0.61 s, count 0.28 s.
# No index added — every leg already has a patient_id-leading index.
#
# NEW SURFACE: GET rme/medical-records/patients/{patientId} — patient-keyed,
# read-only workspace that works with ZERO native records; legacy archives open
# in their own canonical private viewers. 404 for a patient outside the index.
#
# frontend_change: false — Blade views from existing x-ui components only.

id: FEATURE-RME-MEDICAL-RECORDS-UNIFIED-NATIVE-LEGACY-1
type: MODULE_SPRINT
