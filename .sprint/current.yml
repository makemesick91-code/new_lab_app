# FEATURE-LEGACY-PATIENT-DOCUMENT-COMPLETENESS-1
#
# "Kelengkapan Arsip Pasien Legacy" — a read-only monitor over the legacy
# archive: which legacy-IMPORTED patients do not yet hold both a published
# legacy RME and a published legacy odontogram. The backlog was otherwise
# invisible; an operator had to open each patient to find out.
#
# PROVENANCE, MEASURED NOT GUESSED: mst_patients.import_batch_id (nullable,
# indexed FK to stg_legacy_patient_import_batches, Sprint 62.3). It is the ONLY
# canonical marker, it is never derived from created_at / the RM format / a
# missing NIK / the branch / the absence of native RME, and it is applied in the
# repository's single base query so no filter, parameter or crafted request can
# switch it off. A natively registered patient is out of scope BY CONSTRUCTION.
#
#   Patient::isLegacyWithoutBranch() EXISTS AND MEANS SOMETHING ELSE
#   (branch_id IS NULL, Sprint 23.10). Using it here would have listed native
#   branchless patients and missed every imported one that has a branch.
#
# COMPLETENESS IS DERIVED FROM THE REAL STATE MACHINES, in the same
# record-before-staging order LegacySingleActiveDocumentService::occupancyFor()
# uses, and the agreement is asserted against that REAL service rather than
# against a restatement of its rules:
#
#   published record        -> PUBLISHED   (the only complete state)
#   else slot-occupying row -> IN_PROGRESS (incl. FAILED, which is retryable)
#   else void record        -> VOID        (slot released; correction needed)
#   else                    -> MISSING
#
# IN_PROGRESS != MISSING, and that is the point. A live lifecycle still owns the
# patient's slot, so a second upload would be refused; reporting it as "Belum
# Ada — upload" is the duplicate-upload encouragement the owner forbade. The
# staging aggregates therefore apply NO deleted_at filter, matching
# firstSlotOccupyingForPatient()'s withTrashed(): a soft delete never releases a
# slot, only an audited CANCEL or VOID does.
#
# THE §13 ROLE MISMATCH, RESOLVED AND REPORTED. The owner asked for Super Admin
# / Supervisor RME / Admin Klinik. Measured on production: there are ZERO Admin
# Klinik accounts — all four branch clinic admins (29 Admin Sunu, 30 Landak,
# 31 Antang, 32 Telkomas) carry `Front Office`, alongside four generic
# front-desk accounts (7, 8, 16, 17). And `Front Office` is DEFINED as the exact
# union of the two legacy roles it merged, with FrontOfficeRoleTest deriving
# that union from their arrays precisely so "a permission added to Admin Klinik
# later must not silently skip the merged role".
#
# So granting Admin Klinik alone would have broken a tested invariant AND
# reached nobody. Both roles are granted. The measured consequence is stated
# rather than glossed: the four generic front-desk accounts gain the page too.
# They already hold `manage patients`, `view_rme_patient_reports` and both
# legacy intake view permissions, so the report discloses no patient field they
# cannot already reach, and it stays pinned to their own branch. The reversal, if
# the owner prefers it, is to drop the Front Office line and provision real
# Admin Klinik accounts.
#
# BRANCH SCOPE IS BORROWED, NOT INVENTED: LegacyImportHubService::
# GOVERNANCE_PERMISSIONS, referenced rather than copied — already defined as the
# union of the two archives' own governance sets for the sibling page in this
# same module and nav group, and held in this system only by Supervisor RME
# (plus Super Admin via the single global Gate::before). Everyone else resolves
# to their own BranchContext branch, and an unresolvable scope yields an EMPTY
# list that the repository turns into "no rows" rather than "no filter".
#
#   LegacyOdontogramWorkspaceScope WAS REJECTED: its governance set includes
#   create_legacy_odontogram_imports, which Admin Klinik and Front Office both
#   hold, so reusing it would have promoted every branch intake operator to
#   estate-wide visibility — the exact opposite of the requirement.
#
#   RmeWorkingBranchScope WAS REJECTED: it is the clinic-OPERATIONS authority and
#   fails closed to empty for a context-bound role with no active online context.
#   The legacy archive's own established authority is the BranchContext-based
#   workspace scope, which is also what resolves the Front Office branch pin.
#
# READ-ONLY, STRUCTURALLY: the repository interface exposes no create, update,
# delete, upsert or transition method; the module registers exactly ONE route and
# it is a GET; a test asserts the page writes no row and creates no clinic visit,
# medical record, odontogram, invoice, payment, lab order or SATUSEHAT candidate.
#
# NO MIGRATION, NO INDEX. §17 says not to add an index until a plan proves one is
# needed, and the plan proves none is: EXPLAIN ANALYZE on the real production
# estate (1519 legacy patients) runs in 0.552 ms / 14 shared buffer hits, with an
# Index Scan on mst_patients_medical_record_number_unique feeding the ORDER BY so
# LIMIT 25 reads 27 rows — no Seq Scan on mst_patients, no sort of 1519 rows.
#
# QUERY SHAPE: four GROUPED aggregates LEFT JOINed, bounded by the number of
# DOCUMENTS rather than patients. Correlated EXISTS was rejected because the
# filter runs over the whole scope before pagination, so its cost would grow with
# the patient count — the dimension projected to grow fastest. The SQL is
# portable on purpose (max(case when …) rather than bool_or / FILTER), and the
# whole suite is verified on PostgreSQL 16.15, production's exact version.
#
# frontend_change: false — one new Blade view built from existing x-ui components
# and one sidebar entry. No JS, no CSS, no asset rebuild.

