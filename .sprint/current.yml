# FINAL-STABILIZATION-RESIDUAL-AUDIT-1 — Sprint Manifest
#
# WHAT THIS SPRINT IS. The last gate before the one authoritative consolidated
# Full Suite. It does not hunt for new work. It takes every residual, WATCH,
# TODO, deferred item and known risk the corrective series accumulated,
# reconciles each one against the CURRENT production authority, and returns one
# of five classifications per item — with the evidence that justifies it.
#
# WHAT IT IS NOT. It is not an implementation sprint. If the audit had proven an
# unresolved runtime, security, clinical or data-integrity defect, the correct
# outcome was NO-GO plus a named corrective sprint — never a fix smuggled in
# under an audit heading.
#
# WHAT THE AUDIT ACTUALLY CHANGED. Test/fixture/governance only,
# RUNTIME_BEHAVIOR_CHANGE=false. The single change under app/ is one docblock
# line — a comment, no executable statement:
#
#   0. FOUR TESTS WERE ALREADY FAILING ON THE GO-TAGGED AUTHORITY. The previous
#      sprint added STORAGE-R006 but updated only one of the five Architecture
#      tests that pin the storage rule list exactly; Lb1, Stateless1, Replica1
#      and CacheRedis still asserted R001-R005. Verified pre-existing: R006 is
#      in the service at the base commit and the stale pin is in the tests at
#      the base commit, and this sprint touches neither file. Nothing caught it
#      because the Critical gate does not select those suites and the Full Suite
#      has been deferred since 2026-08-19 — a test can fail for days when the
#      only gate that runs it is switched off. Repinned, plus the service's own
#      docblock which still said "R001..R005" while publishing six. Five suites
#      now run 30 passed / 0 failed.
#
#   1. database/factories/RmePrescriptionFactory.php — the fixture wrote
#      prescription and doctor-signature canvases to the 'public' disk while
#      production writes them through ClinicalEvidenceStorage. Never an
#      exposure: nothing in production invokes a factory. But it reproduced,
#      inside the suite, the exact storage layout the public-disk incident
#      removed.
#
#   2. tests/Feature/RME/RmePrescriptionTest.php — because of (1) the canvases
#      read back as null, and the test named "can print prescription with fields
#      and canvas images" asserted assertSee(null). assertSee casts null to ''
#      and every response contains '', so the assertion was vacuous: the test
#      could not fail when there was no canvas. That is a false green, and
#      "no false green" outranks almost everything else in this project.
#
#   3. tests/Feature/Storage/ClinicalEvidencePrivacyTest.php — the anti-
#      regression writer scan covered app_path() only, which is how (1) survived
#      the incident sprint. It now covers database/ as well. tests/ is
#      deliberately still excluded: that file writes to the public disk on
#      purpose, to prove the migration moves objects off it.
#
# Both new guards were mutation-tested: with the factory reverted, the scan
# fails and the canvas assertion fails. The first mutation run passed falsely
# because a previous run had left the fixture PNG on the real clinical disk —
# the filesystem was cleaned and the mutation re-run before the result was
# believed.
#
# WHAT THE AUDIT DELIBERATELY DID NOT TOUCH. Odontogram::hasRecordedTeeth() was
# audited read-only and left exactly as it is: on production 31 of 32 rows pass
# the predicate and all 31 carry a clinically meaningful tooth status, so the
# theorised over-report has zero instances and changing it would move zero rows.
# The 20 dangling storage references were classified, not cleaned: they are
# historical Lab-V1 delivery/QC attachments whose read path aborts 404 after
# authorisation. Deleting rows to make a number look better is not remediation.

