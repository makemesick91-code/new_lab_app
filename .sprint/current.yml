# CICD-GOVERNANCE-EVALUATION-MEMO-1 — one governance evaluation computes each enterprise
# gate once. The ENT-5..ENT-16 gates re-verify their predecessors and each received fresh
# predecessor instances, so the chain doubled at every level: one
# architecture:foundation-governance-summary built ENT-5 2,080 times and took ~116 s, and
# every test rendering the summary paid it again (CI critical gate 9,288 s).
# Fix: App\Support\Foundation\GovernanceEvaluation memoizes each gate's collect() for the
# lifetime of the OUTERMOST evaluation only; nothing survives it. Kill switch
# foundation_governance.evaluation_memo (source-controlled, not read from the environment).
# No gate rule, decision, threshold or required check changes. No migration, no route,
# no permission.
# Carried forward: LEGACY-RME-PROGRAM-CLOSURE-1 stays CLOSED and inherited.
