# REVISION-RME-MANUAL-PRICING-AUTHORITY-1
#
# Owner D21 REVISED (2026-10-20): there is NO mandatory official treatment
# tariff. The authorized cashier types the price of every ORIGINAL invoice line;
# prices may differ per branch and per patient. The issued invoice is the
# immutable financial snapshot and changes only through the maker-checker
# correction workflow (D1 / D7 / D10 unchanged), which is now TARIFF-INDEPENDENT.
#
# Runtime changes:
#   - RmeInvoicePricingService prices MANUAL for every branch: the cashier price
#     is kept after server-side integer-cents validation; no tariff is read,
#     compared, recorded or prefilled; a named treatment must be active
#     (INVOICE_TREATMENT_INVALID); a blank / malformed unit price is refused,
#     never silently zero;
#   - new price provenance MANUAL_CASHIER_ENTRY / MANUAL_FREE_TEXT /
#     CORRECTION_MANUAL_ENTRY (historical TARIFF_* / TRANSITIONAL_* untouched);
#   - strict tariff mode LEGACY_SUPERSEDED: `strict_branch_codes` is a
#     source-controlled empty list, no environment key can enable it;
#   - correction submit / approve / apply hold no tariff dependency;
#     TARIFF_AUTHORITY_CHANGED is no longer a staleness reason;
#   - cashier form: no tariff autofill, manual-pricing notice, integer-cents
#     display total;
#   - tariff readiness reports PRICING_AUTHORITY=MANUAL_CASHIER_ENTRY.
#
# No migration, no seeder, no permission or role change. FEATURE_RME_INVOICE_
# CORRECTION stays OFF; its operational permissions stay granted to no role;
# post-payment correction, refund and Rp0 adjustment stay NOT_ACTIVE. Rule 194.
#
# Type FOUNDATION_SPRINT: financial authority across RmeInvoice + Tariff +
# Treatment + cashier UI; audit level 3. security_impact true.

