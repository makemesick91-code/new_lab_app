# FEATURE-DAILY-BRANCH-CONTEXT-LOCK-1 — Sprint Manifest
#
# WHAT THIS SPRINT IS. Kasir and Admin Klinik pick their working branch once per
# clinical day. After that first free selection the branch is LOCKED, and moving
# it requires a Super Admin approval bound to that one user, that one source,
# that one destination and that one clinical day.
#
# WHY IT IS NOT A UI SPRINT. Before this sprint a cashier could change branch as
# often as they liked simply by re-opening the online-context selector — and the
# financial scope of the cashier workspace followed. A disabled dropdown would
# have stopped an honest operator and nobody else, so the authority is a durable
# row in `trx_daily_branch_contexts` that outranks the session-scoped online
# context. The lock therefore survives logout, a second browser, a raw POST and
# a tampered context row.
#
# AN APPROVAL IS AN EVENT, NOT A CREDENTIAL. The branch switch is applied inside
# the approval transaction, so there is no "approved" token to replay. Single-use
# is a property of the design rather than a counter someone must remember to
# decrement.
#
# WHAT IS DELIBERATELY NOT CHANGED. Doctor and Perawat keep their current free
# branch selection — only the two roles named in the brief are locked. No branch
# eligibility rule is relaxed: an approval can never grant access to a branch the
# user could not otherwise work in, and the destination is re-validated under the
# lock at decision time. No new permission is introduced; approval authority is
# the canonical Super Admin role. No payment, invoice, consent, room, ledger or
# clinical rule is touched.

