# FIX-DOCTOR-WEBAUTHN-READINESS-LIVE-PROOF-1
#
# Child of REVISION-DOCTOR-PWA-WEBAUTHN-ONLY-ACCESS-1, opened by a truth gap the
# verify-device bugfix left behind.
#
# `webauthn:readiness` reported VERDICT=ARMED every day from 2026-09-09 to
# 2026-09-19 while the browser leg produced no successful assertion at all. It
# was never wrong about what it measured: a feature flag and a COUNT(*) over the
# credential table, neither of which can change when a ceremony stops working.
# The Android Keystore path kept working throughout, which is why nobody
# noticed — the two proofs share no code path.
#
# This sprint adds the dimension that was missing. Readiness now incorporates
# current server-side evidence of a successfully verified WebAuthn assertion,
# correlated to a currently-eligible device and credential, inside an
# owner-decided freshness window.
#
# It RETIRES NOTHING, moves no flag, widens no scope and starts no Stage 4.
# Production is EXPECTED to report NOT_READY after this ships, and that is the
# correct outcome rather than a regression.

id: FIX-DOCTOR-WEBAUTHN-READINESS-LIVE-PROOF-1
type: RUNTIME_FIX
module: DoctorDevice
title: "WebAuthn readiness must prove a live assertion, not merely a flag and a row count"
base_branch: feature/sprint-26-phase-26-8-stabilization-closure-go-watch-no-go-report

# Impact flags — declared against the CURRENT diff, verified against the BASE
# ref rather than against the working tree.
#
# security_impact is TRUE and deliberately so even though this WIDENS nothing.
# The diff changes how a security posture is REPORTED, and a readiness engine
# that lies is a security problem whichever direction it lies in. Nothing here
# touches the WebAuthn requirement, the device binding, user verification,
# DoctorDeviceAuthorization, the single-session gate or pilot enforcement.
#
# frontend_change is FALSE: no JS, CSS or Vite input is touched.
# schema_change is FALSE: the audit trail already holds the evidence, so no
# table, column, migration or event stream was added.
runtime_change: true
schema_change: false
frontend_change: false
security_impact: true
branch_isolation_impact: false
ledger_impact: false

# Deploy is required: the defect is in a command an operator runs ON
# production, and the fix is only real once the deployed runtime computes the
# new dimension. The proof of the fix is a production measurement, not a test
# run — and that measurement is expected to be red.
deploy_required: true
browser_required: false

test_profiles: []

# This child tag means ONLY that the readiness ENGINE tells the truth. It is
# emphatically not a statement that the estate is ready, and it authorizes no
# stage move.
go_tag: fix-doctor-webauthn-readiness-live-proof-1-go
go_tag_created: false

