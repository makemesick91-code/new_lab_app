# FEATURE-LEGACY-BATCH-REVIEW-PUBLISH-1 — PR2 of 2 (BATCH PUBLISH)
#
# The owner split this feature across two PRs by RISK rather than by document
# type: review is non-final, publish is the dangerous, final half. PR1 shipped
# batch review and GO'd at 01b28aeb. PR2 (this manifest) ships batch publish for
# both Legacy RME and Legacy Odontogram.
#
# THE SELECTION CONTRACT, CONSUMED FROM PR1 VERBATIM
# -------------------------------------------------
#   canonical status = REVIEWED
#   AND no active blocking triage annotation
#   AND every current publish-time guard passes
#
# No BLOCKED or NEEDS_ATTENTION document is selectable or publishable, and
# nothing in the BatchPublish module clears a triage annotation — clearing stays
# a review-authority act in PR1's flow. Selection is a hint; the server
# re-validates every document immediately before publishing it, so a document
# that went stale between selection and publish is refused with a reason code
# rather than published on a stale decision.
#
# NO OUTER TRANSACTION — ONE DOCUMENT, ONE TRANSACTION
# ----------------------------------------------------
# The canonical publish opens its own transaction, takes its own row lock,
# re-validates every rule, writes the archive record and its pages, and writes
# its audit row AFTER commit. Wrapping N of those in one outer transaction would
# roll back publications that had already succeeded, make the post-commit audit
# rows describe records a rollback destroyed, and hold locks across hundreds of
# documents. So a pass LOOPS the canonical per-document call and partial success
# is the design: 100 selected / 97 eligible / 3 stale => 97 published and 3
# refused with reasons, never 0 and never silently skipped. Only PENDING items
# are attempted, so an interrupted pass resumes without duplicating.
#
# EXACTLY-ONCE IS THE CANONICAL LAYER'S PROPERTY, NOT THIS ORCHESTRATOR'S
# ----------------------------------------------------------------------
# It comes from UNIQUE(source_import_id) + lockForUpdate + the
# findBySourceImportId() early return. It is NOT the run lock's: that lock
# serializes only the status transition and is released on commit, and
# PUBLISHING -> PUBLISHING is permitted so a resumed pass can re-enter — which
# makes the run status structurally incapable of serializing two passes. A test
# asserts that attribution directly, because claiming session-level locking
# would misdescribe where the safety actually lives.
#
# TWO ADAPTERS, NEVER A TYPE BRANCH
# ---------------------------------
# RME routes through LegacyRmeImportLifecycleService::perform(..., PUBLISH, ...)
# and so inherits separation of duties plus the source-patient binding re-check.
# Odontogram has neither anywhere in its module — pre-existing canonical
# behaviour, identical on its own single-item page. Making odontogram weaker, or
# silently stricter than the page it mirrors, needs an explicit owner decision.
# Both directions are pinned by tests and by mutation.
#
# NO PERMISSION WIDENING. Reuses publish_legacy_rme_imports and
# publish_legacy_odontogram_imports verbatim. No batch-publish super-permission
# exists, and no seeder runs post-deploy, because PR2 adds no ability.
#
# BOUNDED EXECUTION, NO QUEUE INTRODUCED. MAX_SELECTION=100 (matched to
# MAX_PER_PAGE — all one page can render), MAX_OUTSTANDING=500 cumulative per
# run, MAX_PUBLISH_PASS=50. The per-item write deliberately stays in its own
# short single-row transaction rather than being batched into one, which would
# trade many brief transactions for one long-held one.
#
# schema_change: true — two ADDITIVE staging tables, no column dropped, no
# existing table altered, no backfill. `migrate` only; never migrate:fresh or
# db:wipe. Nothing in them is clinical: the archives they orchestrate live in
# trx_rme_legacy_records / trx_odontogram_legacy_records.
#
# security_impact: true — a new surface that triggers irreversible clinical
# publication, even though every clinical gate is inherited from the canonical
# per-document path rather than re-expressed here.

