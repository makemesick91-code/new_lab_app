# FEATURE-DEV-CONSOLE-OBSERVABILITY-1
#
# /dev-console becomes the DaengtisiaMS Observability Console: Overview (system
# health, KPIs, 24h trends), Live Users (presence + recent activity), Errors
# (4xx/5xx + sanitized exception detail), Slow Requests (honest timeout
# visibility), Slow Queries (normalized SQL, per-fingerprint aggregation) and
# Cache / Redis (app hit rate vs Redis SERVER hit rate). The ENT-7 diagnostic
# panels move to /dev-console/diagnostics.
#
# Telemetry: one global middleware arms an in-memory collector; every write
# happens in terminate() after the response is sent. Additive migration (two
# sys_obs_* tables), bounded retention (lottery prune + observability:prune),
# centralized redaction, OBS-1 request-id correlation. Same gate as ENT-7
# (view_developer_console, Super Admin only), GET only, audited. No new
# permission, no clinical/ledger/payment change, no new dependency.

