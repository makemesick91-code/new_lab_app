# FEATURE-FINANCE-KLINIK-DATA-ANALYST-ROLES-1
#
# Two INDEPENDENT read-only cross-branch oversight roles — "Finance Klinik"
# and "Data Analyst" — with identical initial permissions (rule 186):
#
#   - Dashboard Finance & Data Analyst: Jumlah Pasien, Jumlah Transaksi,
#     Jumlah Omzet, PIUTANG AKTIF PER SAAT INI, Pasien Cancel, per RME branch,
#     clinic day = WITA via ClinicalClock, 60 s polling paused when hidden.
#   - Native RME + PUBLISHED legacy RME / odontogram: read, print, PDF, export.
#   - Monitoring Dental (active rooms, patients per room, JENIS PERAWATAN
#     DITAGIHKAN per room) and Monitoring Antrian (all branches, per branch).
#
# A dedicated GET-only module (app/Modules/ClinicOversight) with its own
# explicit branch authority: active + RME-enabled, MAIN excluded, a request
# branch_id only narrows, an out-of-scope id is a 404. No existing route,
# policy, branch scope or legacy governance set is widened. The lab "Finance"
# role is unchanged. Nobody is assigned the new roles.
#
# Four new permissions, two new roles, no migration, no schema change.
# Deploy: PermissionSeeder -> RoleSeeder -> permission:cache-reset.
# F-01 / F-06 are pre-existing findings for a separate sprint — not fixed,
# not used.

