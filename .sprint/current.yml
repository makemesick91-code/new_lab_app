# DMS-RME-REVISION-PROGRAM-4 (2026-11-05). Continuation of DMS-RME-REVISION-PROGRAM-1/2/3 under rule 221 §7. The owner
# approved, in the mission brief of 2026-11-05, exactly the eight route-parameter groups Program 3 recorded as residual
# in rule 222 §1.12 (CG-22: recorded, not inferred) as AUDIT TARGETS, to be corrected only where a defect is verified:
#   R-16 `{import}` (14, `int` argument, whereNumber), R-17 settings `{patient}` (7), R-18 `{document}` (2),
#   R-19 `{candidate}` (7, two models), R-20 `{mapping}` (5), R-21 `{issue}` (11, `int` argument),
#   R-22 `{identifier}` (2), R-23 `{doctor}` (8).
# Audit result: all eight bind a bigint `id()` key with no custom route key; all eight were defective on PostgreSQL 16
# (227 HTTP 500s across the matrix; a leading-zero alias opened every record type, deactivated a SATUSEHAT identifier,
# a patient and a doctor, and deleted a KTP document). Every name is generic, so each is constrained per route with
# DatabaseRouteKey::PATTERN; the global list stays at ten names.
# The Foundation-First Sprint Lock stays ACTIVE; this is an allowed category (security fix). No schema, permission,
# policy, controller, service or frontend change. Full Suite deferred (CG-18), not passed.
# Carried forward: LEGACY-RME-PROGRAM-CLOSURE-1 stays CLOSED and inherited.
