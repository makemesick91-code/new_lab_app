# GOVERNANCE-PATIENT-KTP-NEW-PATIENT-ONLY-1
#
# Owner product decisions recorded as durable governance (rule 184): Master
# Data Pasien is global; KTP photo capture belongs to NEW patient registration
# only; existing, repeat-visit, legacy-imported and cross-branch patients are
# never asked for a KTP photo, scan or OCR; the stored KTP image stays
# branch-isolated (rule 183) through a cross-branch visit and a merge.
#
# Audit-first. The server side was already compliant; an independent review
# found ONE client-side violation (classification C): the OCR attestation box
# was a native `required`, and browsers validate display:none controls, so
# applying OCR in the "Pasien Baru" panel and then switching to "Pasien
# Terdaftar" silently refused the existing-patient visit. Fixed minimally: the
# attestation moved into the ktp-camera-ocr.js submit guard (which skips a
# hidden section) and the Blade `required` attribute was dropped; the server's
# `accepted` rule for a NEW patient is unchanged and authoritative.
#
# Runtime change = one JS module + one Blade partial (asset rebuild). No
# migration, route, permission, policy or PHP runtime change. Deploy required.
#
# TYPE: MODULE_SPRINT (Patient). security_impact stays true (default-strong):
# the suite guards an identity-card isolation rule.

