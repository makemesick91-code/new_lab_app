# MONITORING-LOG-TIMESTAMP-ROLLOVER-1 — Sprint Manifest
#
# Closes the Carbon date-rollover residual that MONITORING-LOGS-WATCH-ROOT-CAUSE-1
# deferred on the stated grounds that rollover "only ever moves a timestamp later,
# so it cannot manufacture a false green". That reasoning was wrong, and being wrong
# is why the residual survived two sprints: Carbon rolls month `00` BACKWARD into the
# previous year (`2026-00-15` -> `2025-12-15`), carrying an error event out of the
# lookback window into `historical`, where it stops driving the verdict — a false
# green. Rolling forward is not harmless either: it publishes a fresh error and a
# `latest_fresh_error_at` for an instant that never occurred — a false WATCH resting
# on fabricated evidence. `extractTimestamp` now requires the parsed instant to
# reproduce the exact calendar digits the line contained, and routes anything else
# into the existing unageable path, which already fails closed.

id: MONITORING-LOG-TIMESTAMP-ROLLOVER-1
type: RUNTIME_FIX
module: Monitoring
title: "Monitoring event freshness derives from the timestamp the log actually wrote; a date the parser had to invent is unageable, never a confident verdict"
