# FEATURE-LEGACY-IMPORT-HUB-1 — Sprint Manifest
#
# WHAT THIS SPRINT IS. The three legacy importers that already exist — Legacy
# Patient (Sprint 62.3), Legacy RME (LEGACY-RME-PDF-1A..ROLL-4) and Legacy
# Odontogram (FIX-04b) — are given one canonical navigation home, one canonical
# daily admission ceiling, and one place that reports whether each is actually
# usable. Nothing about how a document is validated, resolved to a branch,
# reviewed, published, voided or read changes.
#
# WHAT IS GENUINELY NEW. Exactly two things:
#
#   1. `ops_legacy_import_daily_quotas` and the service over it — ONE ceiling of
#      100 accepted records per branch per clinical day PER IMPORT TYPE, applied
#      to all three importers through the same code path.
#   2. `settings.legacy-imports.index` — the hub landing page and its sidebar
#      group, which report server-computed status/limit/used/remaining.
#
# WHAT IS DELIBERATELY NOT REPLACED. Legacy RME keeps its ROLL-4 wave/branch
# quota. That counter answers a DIFFERENT question (how much may this WAVE take
# today, across every branch in it) and the hub ceiling cannot express it. Both
# apply; the tighter one wins; neither can widen the other. Replacing the wave
# quota with the hub quota would delete a governance control, which is the one
# thing a consolidation sprint must never do.
#
# schema_change=true is literal: one additive table, no column dropped, no
# backfill, no destructive statement.
#
# security_impact=true is literal: routes/permission middleware and the sidebar
# authorization surface are touched. No permission is created, widened, or
# granted to a role that did not already hold it — the hub is reachable only by
# an actor who already holds one of the three capabilities' own permissions.
#
# Impact flags — MUST match reality.
id: FEATURE-LEGACY-IMPORT-HUB-1
type: MODULE_SPRINT
module: LegacyImport
title: 'One Legacy Import Hub: canonical navigation, a 100/branch/clinical-day/type ceiling, and honest capability status'
base_branch: feature/sprint-26-phase-26-8-stabilization-closure-go-watch-no-go-report
runtime_change: true           # new module, service, controller, route, view
schema_change: true            # one additive quota table
frontend_change: false         # Blade only; no JS/CSS/Vite/package asset changed
security_impact: true          # route middleware + sidebar authorization surface
branch_isolation_impact: true  # the ceiling is per branch; scope is server-resolved
ledger_impact: false
deploy_required: true          # the capability must reach production to be ACTIVE
browser_required: false        # HTTP-level assertions cover the surface
test_profiles:
  - focused
  - permission_regression

go_tag: feature-legacy-import-hub-1-go

# Carried forward from the closure manifest this sprint inherits. Not
# boilerplate: dropping either makes the LegacyRme closure contract fail.
inherits_closure: LEGACY-RME-PROGRAM-CLOSURE-1
