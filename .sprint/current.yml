title: "Half-A fleet cutover executed on production: FEATURE_DOCTOR_SINGLE_ACTIVE_SESSION armed true for all 15 Doctor subjects at once, which also makes DoctorEffectiveBranchResolver effective. Four human gates passed first (window, primary operator, rollback operator, explicit fleet-cutover approval), the six-condition clinical gate was re-measured fresh at 22:15:59 WITA rather than reusing the morning reading, and a new baseline was captured after the lease release and immediately before mutation. One key, one line, verified by line-count and diff. Four live proofs all passed: a post-cutover lease bound to the exact session, a cross-branch branch-lock proof (tablet physically at ATG3, effective branch resolved TLK1), a second concurrent login DENIED with active_session_elsewhere, and the first session NOT evicted. Canonical logout left zero orphans; home-lock and device-estate hashes are byte-identical to baseline. Half B untouched throughout."
