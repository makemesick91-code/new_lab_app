# BUGFIX-LEGACY-ODONTOGRAM-QUEUE-CONSUMER-1 — Sprint Manifest
#
# Prompt classification: BUGFIX · PRODUCTION_QUEUE_PIPELINE · LEGACY_ODONTOGRAM ·
# SYSTEMD_WORKER · PRODUCER_CONSUMER_CONTRACT · GOVERNANCE_GAP ·
# CLINICAL_EVIDENCE_PIPELINE. `type` below is RUNTIME_FIX because that is the
# registered profile in config/sprint_profiles.php; the other labels describe the
# work but are not defined types, and inventing one fails the manifest check
# rather than describing anything.
#
# THE DEFECT. A legacy odontogram PDF was uploaded to the production pilot. The
# job was dispatched to `legacy-odontogram-documents`. The production worker
# consumed default, reports, notifications, maintenance and legacy-rme-documents
# — not that one. So the job was never reserved: attempts=0, reserved_at NULL,
# failed_jobs empty, no exception, no log line, and the import sat at QUEUED
# looking exactly like work still in progress.
#
#     PRODUCER_QUEUE != WORKER_CONSUMED_QUEUE
#
# THE PART THAT MATTERS MORE THAN THE FIX. This was the SECOND occurrence.
# LEGACY-RME-PDF-ROLL-2 hit the identical shape on `legacy-rme-documents` and
# answered with a queue_contract check inside LegacyRmeRolloutReadinessService —
# correct, tested, and scoped to one module. Legacy Odontogram shipped its own
# dedicated queue and inherited none of it. Adding one queue name to one worker
# would have set up the third occurrence, so the durable deliverable is
# ENT5-Q009: a module-agnostic producer ↔ consumer contract that fails CI when
# ANY produced queue has no consumer.
#
# WHY NOT A GREP. Every dedicated queue here is env-overridable
# (LEGACY_ODONTOGRAM_QUEUE, LEGACY_RME_QUEUE, SATUSEHAT_QUEUE). A literal scan
# would assert the default while production ran another name. The registry names
# the config key and the check resolves it the way the runtime does. The registry
# is then checked for COMPLETENESS against the source tree, so a future module
# cannot add a dedicated queue and stay invisible.
#
# WHAT THE GUARD FOUND THAT NOBODY ASKED ABOUT. Run before the fix, it reported
# four violations, not one: the odontogram queue was undeclared AND unconsumed;
# `satusehat` was produced but never declared at all; and
# enterprise_foundation_runtime_hardening.queue_worker.approved_queues had
# drifted into decoration — four names against a unit that had consumed five
# since ROLL-2, with nothing comparing them. A third copy of the same fact.
#
# ENT5-Q010. Production carried StartLimitIntervalSec under [Service]. systemd
# only honours it in [Unit], logged "Unknown key name ... ignoring", and applied
# its own default: `systemctl show` reported 10s against a file asking for 0.
# The file and the running service disagreed and nothing compared them either.
#
# WHY INSTALLED-UNIT DRIFT IS A WARNING AND NOT A FAILURE. The deploy is
# forbidden from installing or starting a worker (ENT-5). Activation is a later
# operator step. `foundation:queue-retry-failed-job-check` exits non-zero on FAIL
# even without --strict and scripts/deploy-vps.sh runs it ungated, so failing on
# drift would abort the very deploy that has to precede activation. Verified, not
# assumed.
#
# security_impact is true: this restores processing of a clinical-evidence
# pipeline and changes what the production worker executes. NO MIGRATION — a
# schema change here would mean the diagnosis was wrong.

