# BUGFIX-MASS-UPLOAD-REQUEST-ENTITY-TOO-LARGE-1
#
# Mass Upload returned a bare `413 Request Entity Too Large`.
#
# ROOT CAUSE — measured, not inferred. Production nginx error log, today:
#
#   2026/10/03 10:22:28 [error] client intended to send too large body:
#   2860825 bytes, server: daengtisia.online,
#   request: "POST /settings/rme/legacy-mass-imports HTTP/1.1"   -> 413, 192 bytes
#
# `client_max_body_size` appeared NOWHERE in the production nginx configuration
# (`nginx -T | grep -c client_max_body_size` = 0), so every upload was bounded by
# the nginx COMPILED DEFAULT of 1 MiB. The request never reached PHP or Laravel,
# which is why no application log and no application test could show it.
#
# The application's own ceiling is 500 MiB. Two runtime layers sat below it:
#
#   nginx client_max_body_size   1 MiB  (compiled default)   <- rejected first
#   PHP-FPM upload_max_filesize  2M     (stock php.ini)      <- would reject next
#   PHP-FPM post_max_size        8M     (stock php.ini)
#   application package.max_bytes 500 MiB                    <- the authority
#
# Fixing only nginx would have moved the failure one layer down, where PHP
# silently discards the file and Laravel reports the misleading "Paket arsip ZIP
# wajib diunggah." Both layers had to move.
#
# NOT A MASS-UPLOAD BUG. The same 1 MiB default had already refused two other
# clinical upload paths in production — the SINGLE-item legacy import
# (1 189 484 bytes, 2026-09-02) and the lab workflow request (5 333 569 bytes,
# 2026-07-10). One shared infrastructure gap, three visible symptoms.
#
# THE APPLICATION REMAINS THE AUTHORITY. Infrastructure is raised to sit just
# ABOVE package.max_bytes, never to replace it, so an oversize package reaches
# Laravel and earns the application's own reasoned refusal:
#
#   <= 500 MiB   accepted
#   500-512 MiB  reaches Laravel -> "Ukuran paket arsip melebihi batas yang
#                diizinkan."
#   >  512 MiB   nginx 413 (bounded, honest)
#
# nginx is pinned to the SAME 512 MiB as post_max_size so nginx is always the
# outer bound; otherwise PHP would strip $_POST, lose the CSRF token, and the
# operator would be told "Page Expired" (419) instead of anything about size.
#
# NOTHING IS UNLIMITED. `client_max_body_size 0` is forbidden and asserted
# against. Every archive-safety ceiling is untouched and asserted untouched:
# document_max_bytes 20 MiB, manifest_max_bytes 5 MiB, max_entries 1200,
# total_uncompressed_max_bytes 2 GiB, max_compression_ratio 120.0. Those are
# INDEPENDENT controls; raising a transport ceiling must not raise any of them.
#
# max_execution_time is deliberately NOT relaxed pool-wide — every other request
# keeps the 30s ceiling. The intake route raises it for ITSELF at runtime
# (PHP_INI_ALL). upload_max_filesize / post_max_size / max_input_time are
# PHP_INI_PERDIR and cannot be scoped per route, which is why those three must
# live at pool level.
#
# CONFIG AS CODE. deploy/php-fpm/daengtisiams.conf was already repo-managed and
# matched production byte-for-byte (sha256 identical), so the ceilings go there
# rather than into a hand-edited php.ini. Its header previously claimed php.ini
# carried "the limits which the Legacy RME PDF upload path depends on" — that was
# never true, and the claim is corrected rather than left to mislead the next
# reader. nginx is not deployed from this repository, so
# deploy/nginx/upload-body-size.conf is the version-controlled record and carries
# its own one-time apply + verify instructions, matching the existing
# deploy/nginx/pwa-manifest-mime.conf pattern.
#
# NO migration. NO permission, role, route or schema change. No clinical
# behaviour, no publish path, no branch isolation, no ledger.

