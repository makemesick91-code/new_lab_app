# WHAT CHANGED IN THE WORLD.
#
# Nothing outside this repository. No key was generated, no vault was opened, no
# PKCS12 was read, no password was typed, no APK was built, no tablet was
# touched. This sprint takes one DECISION about a key that already exists.
#
# alias  daengtisia-clinic-release
# key    RSA 4096, PKCS12 PrivateKeyEntry, self-signed
# sha256 79db269b7cd38e920b80efbcf2f59142721f1e57924d3048d07a862f34fea2d9
#
# That fingerprint is a PUBLIC identifier — it ships inside every signed APK, so
# committing it discloses nothing. The private key, the keystore and every
# password remain out of git, off the production VPS and out of CI, and no
# control added here can be evaluated only with them.
#
# WHAT THIS SPRINT DOES.
#
# 1. ARMS THE PIN. signing.production_certificate_sha256 moves from null to the
#    fingerprint above — the same certificate as ..._recorded, which the custody
#    state machine already refuses to let disagree. RECORDED (a fact about a key
#    that exists) and PINNED (a decision to enforce) stay two fields; both are
#    now true, which is exactly when a split like that stops being scrutinised,
#    so it is asserted structurally rather than by opposite values.
#
# 2. ONE SEMANTIC, ASKED IN ONE PLACE. "Is this a fingerprint, and is it the
#    same one?" previously had four answers: the scanner's case-insensitive
#    regex, the verifier's own inline copy of it, the lifecycle's
#    is_string && !== '', and a case-SENSITIVE regex for the recorded value.
#    They are now one class, App\Support\Android\AndroidCertificateFingerprint,
#    and reporting and enforcement both ask it — so PRODUCTION_CERTIFICATE_PINNED
#    cannot report armed for a value the verifier is rejecting.
#
#    isPresent() SURVIVES ON PURPOSE and is not a weaker isValid(). The
#    lifecycle needs junk to count as a CLAIM so 'TBD' written with no key still
#    trips "pinned while no key is claimed provisioned". Merging them is a
#    fail-open regression that reads as a cleanup; a mutation test kills it.
#
# 3. FIXES A LATENT VALIDATION DEFECT FOUND BY THE NEW TESTS. Both replaced
#    regexes lacked the D modifier, so PHP's $ also matched before a trailing
#    newline and "<64 hex>\n" validated. The anchor would report ARMED and the
#    comparison would then fail, telling an operator the APK was signed by a
#    DIFFERENT KEY. A newline in config would have been reported as a
#    substituted signing key.
#
# 4. STOPS A CONTAINMENT CHECK FREEZING A VALUE IT DOES NOT OWN.
#    preflight_unlocks_nothing demanded the pin be null forever. The predecessor
#    already corrected that line's MESSAGE when the key was provisioned; the
#    CONDITION still read the pin, so this sprint hit the same wall one field
#    later. It is REPLACED, not deleted (Rule 147): the pin must be absent or
#    exactly the recorded production certificate — strictly narrower than "null"
#    was broad. A rogue well-formed anchor and junk both still go red, and two
#    tests exist solely to prove that gap was not orphaned.
#
# STILL FALSE, AND ASSERTED FALSE.
#
# Production APK built, signed or distributed; tablet touched; ADB used; device
# enrolled; pilot enforcement activated; global enforcement activated.
#
# DEVICE_ENFORCEMENT_ACTIVE=false, DOCTOR_BROWSER_LOGIN_DENIED=false,
# enforcement.current_stage=off, owner_signoff.pilot_activated=false.
# drg Karmila at Cabang Sunu is unaffected.
#
# Reading PRODUCTION_CERTIFICATE_PINNED=true as permission to build, install or
# enforce is the specific misreading rule 148 exists to prevent.
#
# NEXT TASK: PRODUCTION-ANDROID-RELEASE-APK-EVIDENCE-1. It is deliberately
# separate and must not be folded into anything else.
