# FIX-RME-PAYMENT-SUBMISSION-IDEMPOTENCY-1
#
# Program DAENGTISIAMS-RME-BILLING-CORRECTION — supporting hardening after
# Sprint 2, not a new main sprint and not a Full Prepayment Pilot GO (rule 205):
#
#   F1. No payment path knew whether a request had been seen before: a double
#       click, a browser retry or a resubmitted form recorded a SECOND partial
#       payment; a replayed full payment was refused as an error. Every payment
#       form now carries a server-issued, invoice-bound HMAC payment intent; a
#       committed submission is recorded in trx_rme_payment_submissions (same
#       transaction, UNIQUE(intent_key), immutable). An exact repetition is
#       answered with the ORIGINAL result and writes nothing; any other use of a
#       committed intent is refused (PAYMENT_INTENT_REUSED).
#
#   F3. The Kontrol and visit paths read the payable summary and capped the
#       amount BEFORE the row locks, then skipped a changed invoice and min()-capped
#       the rest — silent truncation / redistribution. The page now declares its
#       plan and per-invoice balances; the summary is read inside the transaction;
#       every plan invoice is locked in the existing order; plan, balances and the
#       amount cap are decided against the LOCKED rows; full allocation is asserted
#       in cents. A changed view refuses the WHOLE payment.
#
# One additive migration (one table, unique index, PostgreSQL CHECKs; down()
# refuses while rows exist); no backfill, no permission, no route, no seeder.
# Blade only (no JS/CSS/asset change, no npm build).
#
# Preserved: rule 191 version binding, D10, OPS-OQ-1 / 1a / 1b, OD-1 / OD-1a,
# RmeBillingActorGuard, RmeWorkingBranchScope, D1 / D1a / D1c / D1e, D7, D21, D28;
# D21c, D21g, D22 stay PENDING.
#
# Type FOUNDATION_SPRINT (audit level 3): financial write path + schema + request
# boundary across RmeInvoice, providers, views and the CI gate registry.

