# DMS-DEPLOY-PRIVSEP-PHASE-2 (2026-11-15). Owner-ordered security hardening closing OD-6 (the deploy account held
# unrestricted passwordless sudo, and its key sat unencrypted on a workstation) and the rule 233 §9 residuals R1
# (composer/npm ran as root), R2 (tracked development scripts under storage/) and R4 (restores streamed an
# unverified runtime-owned dump to the PostgreSQL superuser). Rule 235 (docs/sprints/dms-deploy-privsep-phase-2.md):
# a dedicated deploy operator whose key is forced onto a root-owned entrypoint and whose only sudo right is that
# entrypoint with allowlisted, regex-bounded requests; the administrator's sudo needs the owner's password
# (break-glass); composer/npm as an unprivileged build identity in a sandboxed transient systemd service, trees handed
# over and claimed back; restores only of a root-only copy whose SHA-256 matches trusted evidence; five dead
# factory-based scripts removed from storage/. Deploy tooling, provisioning, authority, scanner, read-only checks and
# tests. No schema, migration, permission, role, route, JS/CSS or package change; no flag, enforcement scope, branch
# lock, queue worker, scheduler or timer change.
