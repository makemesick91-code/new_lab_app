# BUGFIX-LEGACY-BATCH-REVIEW-DECISION-NOT-SUBMITTED-1
#
# Production Batch Review answered every press of "Tandai Ditinjau" with
# "keputusan tinjauan wajib diisi." The operator had made a decision; the server
# said none arrived. The server was correct — the browser sent decision=''.
#
# ROOT CAUSE: Alpine writes an x-model / :value binding to the DOM inside a
# reactive effect, flushed on the MICROTASK QUEUE (scheduler -> queueJob ->
# queueMicrotask(flushJobs)). The inline component assigned this.decision and
# then called form.submit() in the SAME TICK, so the hidden input still held ''
# when the browser serialized the form.
#
#   EXPECTED_FIELD: decision (flat, top level, beside import_id)
#   ACTUAL_FIELD:   decision — correct name, present
#   ACTUAL_VALUE:   '' at the serialization instant
#   VALIDATION_WEAKENED: NO
#
# Only the REVIEWED path broke, which matches the report exactly: BLOCKED and
# NEEDS_ATTENTION reveal the reason panel instead of submitting, so the microtask
# queue flushes long before confirmTriage() submits in a later tick.
#
# THE FIX: the component moves to resources/js/legacy-batch-review.js (a plain
# factory registered through Alpine.data(), following patient-combobox.js and
# doctor-device-webauthn.js) and the single submission path writes the field
# SYNCHRONOUSLY in the same block as form.submit(). This is not a setTimeout or
# $nextTick workaround — there is no race left to lose. The :value binding stays
# for coherent rendering; x-ref="decisionField" is what the submit path writes.
#
# WHAT IT MUST NOT DO, AND DOES NOT: no default REVIEWED for an untouched
# document; no bulk vocabulary (no ALL / markAll / reviewAll / selectAll
# anywhere client-side); per-item identity preserved — one attestation is one
# request naming one server-rendered import_id. Review authorization,
# separation of duties, patient binding, branch scope, the single-active-document
# guard, date rules, triage behaviour and every publish rule are untouched.
#
# THE BRIEF'S MULTI-ITEM FRAMING, CORRECTED: the real contract is flat and
# singular, and the FormRequest says so in its own docblock. Converting it to
# decisions[<item>][decision] would have WEAKENED PR1's structural guarantee
# that there can be no Review All.
#
# CI GAP FOUND AND CLOSED: measured with the workflow's own filter, the critical
# gate selected 24 of the 119 batch tests. Not zero — which is worse, because
# partial selection reads like coverage. The matches were accidental (the
# unrelated `Odontogram` token, plus Pest descriptions containing the word);
# LegacyBatchPublishGuardTest and LegacyBatchReviewDatabaseInvariantTest ran
# nowhere. `LegacyRme` does not match `LegacyBatchReviewRmeTest` — --filter
# matches the test identity and the substring is `LegacyBatchReviewRme`. Fixed by
# adding LegacyBatchReview|LegacyBatchPublish to BOTH filter variants (asserted
# byte-identical) and declaring all nine files in ci_runner's
# critical_gate_mandatory_suites. Selection: 4800 -> 4895 (+95).
#
# frontend_change: true — one Blade view and the JS bundle. npm run build is
# required; there is no migration, route, permission, policy or schema change.
#
# browser_required: false, and the residual is stated rather than hidden. The
# local dev database is unseeded (0 branches / 0 users / 0 patients), is behind
# on migrations (168 applied), and the legacy capability resolves
# migrationEnabled()=false locally, so a Dusk path would mean migrating and fully
# seeding the dev estate plus a served process with flag overrides. The ordering
# property is instead proven against the REAL factory with a form double that
# captures the field at the serialization instant, and the rendered markup is
# asserted separately per archive. Nothing in CI runs this page in a browser
# engine, so an Alpine initialization failure here specifically would not be
# caught; a sprint with a seeded estate should add the Dusk test.

