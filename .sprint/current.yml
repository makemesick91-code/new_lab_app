# MONITORING-UNDATED-SEVERITY-ESCALATION-1 — Sprint Manifest
#
# Closes the residual that MONITORING-LOG-TIMESTAMP-ROLLOVER-1 left behind:
# undated_error_like_count could not escalate past WATCH. The residual was audited
# and reproduced before it was fixed — the objective was never "make a large number
# trigger FIX because it looks scary".
#
# Rule 113 R2 and rule 115 R9 pinned that an unageable ERROR may never read as OK.
# Both describe a FLOOR. No rule, doc, test or comment anywhere asserted a ceiling,
# and no rung above the first was ever extended to the undated bucket — so magnitude
# was ignored entirely. undated=1 and undated=1000 both returned WATCH, and the
# identical burst of 150 ERROR events reported FIX with parseable timestamps and
# WATCH without them: two severity levels of operational confidence bought by
# corruption in a date field. Mixed evidence understated too — fresh=15 with
# undated=100 is up to 115 in-window error events reported as WATCH.
#
# The correction rests on a measured fact, not an assumption: undated_error_like_count
# and fresh_error_like_count come out of the same event-grouping pass and carry the
# same unit — one error-like log event, 1:1 at every magnitude, with no double count
# into any other bucket. Since the monitor cannot rule out that an unageable event
# falls inside the window, the fail-closed reading is that it does, so the two counts
# are summed onto the canonical in-window ladder. That ladder's first rung had already
# been applied here (undated > 0 is numerically identical to fresh >= 1); only the
# higher rungs were missing.
#
# Summing can only ever raise, so rule 113 R4 ("noise escalates, it never masks")
# holds by construction and monotonicity is exhaustive over a 9x9 grid. Every change
# in the decision matrix is an escalation; nothing is downgraded. Severity was NOT
# reached by loosening the parser, relaxing coverage, shortening the window, or
# editing a log. Escalation adds no cheaper path to a severe verdict than already
# existed: forging a well-formed ERROR header is easier than forging a corrupt-dated
# one and already reached FIX.

