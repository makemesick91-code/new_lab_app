# FIX-RME-PRINT-REMOVE-PATIENT-VISIT-DUPLICATE-1 — Sprint Manifest
#
# WHAT THIS SPRINT IS. "Cetak RME" stops printing the `Data Pasien & Kunjungan`
# card. The card restated as typed metadata what the clinician had already
# written by hand on the RM sheet the same document reproduces immediately
# below it, so page one duplicated page two.
#
# PRESENTATION ONLY. One Blade partial loses one section. No controller, no
# service, no query, no route, no policy, no permission, no migration. The
# patient, the visit and every removed field are untouched in the database and
# still shown on the visit detail screen — this is a change to the print
# COMPOSITION, never to the record.
#
# ONE PARTIAL, BOTH OUTPUTS. `rme.visits.print` and `rme.visits.pdf` are
# separate wrappers that both include `rme.visits.partials.print-body`, so the
# single edit removes the card from both canonical outputs and they cannot
# drift apart later.
#
# DOCUMENT IDENTIFICATION IS KEPT. Removing a duplicate card must not make a
# printed clinical sheet unattributable. Each wrapper's <title> still carries
# the patient name and visit number and its footer the visit number; the clinic
# logo stays. Those are a document header, not the card.
#
# frontend_change=false is literal, not convenient: only .blade.php changed,
# and the validator's frontend set is JS/TS/Vue/CSS/SCSS/Vite/Tailwind/package.
# No asset is rebuilt, so no `npm run build` is required.
#
# Impact flags — MUST match reality.
