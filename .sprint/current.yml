id: DOCTOR-ACCESS-GLOBAL-DEVICE-ENFORCEMENT-READINESS-1
type: FOUNDATION_SPRINT
module: DoctorAccess
title: "Half-B readiness: give the five declared global doctor-enforcement prerequisites a producer, so a signature can be contradicted by a measurement. Closes the false green in Phase4aPilotPreparationScanner::globalPrerequisiteCheck(), which compared two config lists and read no measurement, so attested-true beside measured-false returned PASS. Adds a real rollback producer that executes an in-process rehearsal — deny an out-of-cohort doctor under the activated posture, restore the CAPTURED posture, prove the same doctor is admitted again — replacing a prerequisite that had zero occurrences under app/. Half B is NOT activated: global_permitted stays a source-controlled false, governance_phase stays phase_4a, no attestation is signed."
base_branch: feature/sprint-26-phase-26-8-stabilization-closure-go-watch-no-go-report

# FOUNDATION_SPRINT, and the classification is the honest one.
#
# This ships real runtime code — two services, a console command, a new scanner
# check and a config file — but it ships no feature. Every line exists to make an
# existing governance gate capable of being WRONG, which is the property it has
# lacked since Phase 3.5.

runtime_change: true            # two services, one command, one scanner check,
                                # one config file. All read-only at runtime.

schema_change: false            # NO migration, no table, no column, no index.

frontend_change: false          # no JS, CSS, Vite entry or Blade view.

security_impact: true           # it changes what a SECURITY gate will accept.
                                # No permission, policy, role, middleware or
                                # credential is touched, and nothing here can arm
                                # enforcement — but a gate that previously passed
                                # on a false signature now fails, and calling that
                                # anything less than security-impacting would be
                                # the same understatement this sprint exists to
                                # correct.

branch_isolation_impact: false  # BranchContext, the effective-branch resolver and
                                # every branch-scoped query are untouched. The
                                # rollback rehearsal reads the enforcement scope
                                # and never a branch scope.

ledger_impact: false            # no inventory ledger, billing, payment, invoice
                                # or receivable path is reachable from here.

deploy_required: true           # the readiness gate has to exist ON the
                                # deployment it measures. A producer that lives
                                # only on a branch is the paper prerequisite this
                                # sprint is replacing.

browser_required: false         # every verification is CLI and read-only HTTP
                                # health probes. No clinician, no tablet, no
                                # ceremony — deliberately: this sprint provisions
                                # nothing and enrols nobody.

# A GO here means the INSTRUMENTS are honest and Half B may be *planned*.
