# BUGFIX-LEGACY-ODONTOGRAM-PATIENT-LOOKUP-1 — Sprint Manifest
#
# Prompt classification: BUGFIX · PRODUCTION_FUNCTIONAL_DEFECT ·
# LEGACY_ODONTOGRAM · PATIENT_LOOKUP · PRIVACY_SENSITIVE ·
# AUTHORIZATION_SENSITIVE · CLINICAL_EVIDENCE. `type` below is RUNTIME_FIX
# because that is the registered profile in config/sprint_profiles.php for a
# defect in shipped runtime behaviour; BUGFIX is not a defined type and
# inventing one would fail the manifest check rather than describe the work.
#
# THE DEFECT. On Import Data Legacy -> Unggah Arsip Odontogram Lama the operator
# entered the patient identifier and nothing appeared. The page asked for
# `mst_patients.id`, an internal surrogate key displayed on no DaengtisiaMS
# screen or report, read through `Request::integer()` — which is `intval()`, and
# `intval()` does not fail, it guesses. The Nomor RM the operator actually holds
# became 0; `1abc` and `patient_id[]=…` both became 1 and silently displayed
# whichever patient was row #1. The view then rendered ONE `@else` for every
# outcome, so FOUND, NOT_FOUND and ERROR were indistinguishable from "you have
# not typed anything yet". HTTP 200, nothing logged — confirmed on the pilot,
# whose 8,718-line laravel.log holds zero legacy-odontogram entries.
#
# THE DISTINCTION THIS SPRINT ESTABLISHES:
#
#     PATIENT FOUND  !=  UPLOAD AUTHORIZED
#
# The lookup answers "who is this?" only. On submit `patient_id` is re-resolved
# through the same repository, re-validated by StoreLegacyOdontogramImportRequest,
# and the owning branch is re-derived from the patient's own Nomor RM and
# re-checked against the operator's scope. A rendered patient panel is never a
# credential.
#
# WHAT IT DELIBERATELY DOES NOT DO. No searchable name combobox, no type-ahead,
# no JavaScript of any kind. Same single field, same GET submit, same full-page
# render. A richer picker is recorded as a separate UX finding. Accepting the
# canonical Nomor RM is not that redesign — it is the identifier every other
# patient-selection surface in the product already uses, and without it this
# workflow cannot be completed at all.
#
# security_impact is true because the fix removes a silent wrong-patient
# resolution on a clinical-evidence screen and replaces a Patient model in the
# view with a least-disclosure identity DTO. branch_isolation_impact is false:
# patient identity was already global here and stays so; the ARCHIVE's branch
# derivation from the Nomor RM is untouched.

id: BUGFIX-LEGACY-ODONTOGRAM-PATIENT-LOOKUP-1
type: RUNTIME_FIX
module: LegacyOdontogram
title: 'The legacy odontogram upload page resolves the identifier the operator actually holds, and says which of FOUND / NOT_FOUND / ERROR happened'
base_branch: feature/sprint-26-phase-26-8-stabilization-closure-go-watch-no-go-report
runtime_change: true            # request handling, lookup service, repository, controller
schema_change: false            # no migration, no column, no table, no index
frontend_change: true           # the create Blade view's states; no JS, no asset build
security_impact: true           # malformed input no longer resolves an arbitrary patient
branch_isolation_impact: false  # archive branch derivation from Nomor RM is unchanged
