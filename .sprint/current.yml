# AUTHORITATIVE-CONSOLIDATED-FULL-SUITE-2 — Sprint Manifest
#
# WHAT THIS SPRINT IS. The final stabilization programme closure. It carries the
# closure contract into the repository BEFORE the authoritative Full Suite runs,
# so that the tested tree, the merged tree, the deployed tree and the tree the
# final GO tag points at are all THE SAME TREE. Nothing about the suite result
# may be written into the repository afterwards.
#
# ORDERING IS THE WHOLE POINT. A closure sprint that runs the suite first and
# then commits its evidence has not tested the tree it ships. The evidence of
# the run therefore lives in the annotated GO tag and the CI run, never in a
# post-PASS commit.
#
# NO PRETEND PASS. Until the run actually passes, `full_suite_status` below is
# PENDING and the closure document says PENDING. The GO tag is the only place
# a PASS is ever asserted, and it is created only from real CI evidence.
#
# THE TEMPORARY FULL-SUITE POLICY STAYS ACTIVE THROUGH THIS SPRINT. Retiring it
# in this candidate would make the post-merge push to base an AUTHORISED
# automatic Full Suite, which would start a second, unauthorised run the moment
# this candidate merges. Retirement is a separate, separately-authorised act.
#
# Impact flags — MUST match reality.
id: AUTHORITATIVE-CONSOLIDATED-FULL-SUITE-2
type: DOCS_ONLY
module: GOVERNANCE
title: 'Authoritative consolidated Full Suite #2 and final stabilization programme closure'
base_branch: feature/sprint-26-phase-26-8-stabilization-closure-go-watch-no-go-report
runtime_change: false          # zero app/, routes/, resources/, config/, database/
schema_change: false           # no migration
frontend_change: false         # no JS/CSS/Vite asset change
security_impact: false         # no authorization surface touched
branch_isolation_impact: false # branch scoping untouched
ledger_impact: false
deploy_required: true          # the closure authority is required to reach production
browser_required: false        # no UI surface
test_profiles:
  - cicd

go_tag: authoritative-consolidated-full-suite-2-final-program-closure-go

# One explicit user authorisation; one attempt. Set to PENDING deliberately —
# it is NOT updated after the run, because updating it would mutate the tested
# tree. The GO tag carries the outcome.
full_suite_status: PENDING_AUTHORIZED_EXECUTION   # FULL_SUITE_2_MAX_ATTEMPTS=1

inherits_closure: LEGACY-RME-PROGRAM-CLOSURE-1
inherits_hold: FIX-CLINIC-OPS-BRANCH-CONTEXT-WA-1/FIX-02
residual_ledger: docs/sprints/authoritative-consolidated-full-suite-2-final-closure.md
