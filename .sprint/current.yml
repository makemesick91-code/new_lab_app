# HARDENING-RME-ACTIVE-USER-PATIENT-SELECTION-1
#
# Three objectives, one release (rule 200):
#
#   A. Active accounts. A deactivated account stops everywhere: login form
#      (Auth::attemptWhen, inactive message only after the password is proven),
#      live web session (EnsureAccountIsActive in the `web` group, before any
#      controller: presence dropped, doctor lease released, one PII-free audit
#      row, logout + invalidate), remember-me cookie, Android app login and
#      ticket redemption. ONE definition of a usable account
#      (App\Support\AccessControl\ActiveAccountResolver), shared by the clinic
#      visit and RME billing actor guards. Closes rule 198 §30a and rule 199
#      §24 / §27c.
#
#   B. Patient selection. ClinicVisitService::create() re-asserts patient,
#      prior-visit and doctor selection through ClinicVisitRegistrationGuard —
#      the ONE rule source StoreClinicVisitRequest now also consults. The prior
#      visit is read FOR SHARE inside the registering transaction. Registration
#      never writes a room; the visit edit is an allow-list. Closes rule 199 §27.
#
#   C. Owner decision OD-1 (2026-10-22, "pasien bisa kontrol lintas cabang
#      bahkan dengan dokter berbeda"): cross-branch AND cross-doctor Kontrol
#      allowed and pinned. OD-1a (owner answer, 2026-10-22, "Hanya piutang B"):
#      carry-over receivables are discovered and collected only at the paying
#      visit's own branch. Supersedes rule 197 §24.
#
# No migration. No permission, role, route, RoleSeeder or feature-flag change.
# Invoice/payment explicit actor, manual pricing D21, D10, invoice-version
# binding, SPN4 correction pilot (maker 29 / checker 1) and doctor trusted
# device / WebAuthn / branch lock / single session untouched.
#
# Type FOUNDATION_SPRINT (audit level 3, full foundation audit, rollback and
# evidence required — same depth as SECURITY_FIX). First declared SECURITY_FIX;
# `sprint:scope-audit` returned NO-GO because SECURITY_FIX forbids a change of
# more than 10 code files ("looks like a refactor, not a scoped fix"). The
# verdict is correct: this is not a scoped fix. It installs an application-wide
# authentication foundation (one account-usability definition + a middleware on
# every web request) and touches four modules (ClinicVisit, RmeInvoice,
# DoctorDevice, DoctorAccess) plus app/Support and app/Http. FOUNDATION_SPRINT
# is the profile that describes that ("cross-module / shared-foundation work");
# no gate is lowered, and the security regression suites run regardless.
# security_impact true.

