# WHAT CHANGED IN THE WORLD.
#
# The production Android signing identity was GENERATED, exactly once, on
# custodian 1, inside the LUKS2 vault that REVISION-PRODUCTION-SIGNING-
# CUSTODIAN1-ENCRYPTED-VAULT-1 built for it. Two encrypted backups were written
# to their destinations, and BOTH were restored FROM THE DESTINATION COPY — not
# from the staging source — and proven to yield a usable private key.
#
# alias  daengtisia-clinic-release
# key    RSA 4096, PKCS12 PrivateKeyEntry, self-signed
# sha256 79db269b7cd38e920b80efbcf2f59142721f1e57924d3048d07a862f34fea2d9
#
# A certificate fingerprint is a PUBLIC identifier; it ships inside every signed
# APK. The private key, the keystore and every password are not in this
# repository, not on the production VPS and not in CI. The vault and backup
# passphrases were typed at a real TTY and are not known to any agent.
#
# The key is PERMANENT. key_loss_recoverable is false and app_signing_key_
# rotation is constrained_treat_as_permanent. There is no second attempt, and a
# second signer is never the fix for a failing gate.
#
# WHAT THIS SPRINT DOES.
#
# It records that state, and closes the gate defects that recording it exposed.
#
# 1. signing_custody_ready_for_provisioning demanded status == 'ready_for_
#    provisioning' EXACTLY, so it went red the moment the lifecycle it guards
#    moved forward. It now asserts the preconditions — every destination still
#    prepared, custody at or past readiness — and still fails below readiness.
#
# 2. custody_state_machine_consistent required a provisioned key to have a
#    certificate PINNED. That made "the key exists" unstateable without also
#    arming android:verify-release, which would have pushed an operator to pin a
#    certificate before the pinning task reviewed anything. The claim is split:
#
#      production_certificate_sha256_recorded = FACT     (set)
#      production_certificate_sha256          = DECISION (still null)
#
#    Four rules bind the pair in both directions, the recorded value must be a
#    real fingerprint, and a test proves the verifier does not fall back to it.
#
# 3. NEW custody_status_matches_recorded_facts. Every state past readiness could
#    previously be declared with nothing behind it — status => 'operational'
#    with all six flags false contradicted no rule, and the summary line a human
#    reads would have announced it. Requirements are cumulative; the rule is
#    one-directional (a status may lag the facts, never lead them).
#
# STILL FALSE, AND ASSERTED FALSE.
#
# Certificate pinned (production_certificate_sha256 stays null, so
# android:verify-release authenticates nothing and fails closed), production APK
# built or signed, artifact distributed, device enrolled, pilot enforcement
# activation, global enforcement activation.
#
# DEVICE_ENFORCEMENT_ACTIVE=false, DOCTOR_BROWSER_LOGIN_DENIED=false,
# enforcement.current_stage=off. No tablet was touched, no ADB, no Device Owner.
# drg Karmila at Cabang Sunu is unaffected.
#
# NEXT TASK: PRODUCTION-ANDROID-SIGNING-CERTIFICATE-PIN-1. It is deliberately
# separate and must not be folded into anything else.
