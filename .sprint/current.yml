id: DOCTOR-ACCESS-TRUSTED-DEVICE-ESTATE-PROVISIONING-1
type: SECURITY_FIX
module: DoctorAccess
title: "Provision the minimum physical trusted-device estate for controlled activation testing: one tablet at TLK1, the only staffed branch holding none. The ceremony was corrected before any hardware was touched — an adversarial review found that WebAuthn enrolment does NOT make a device eligible (only the Android keystore challenge-response writes cryptographically_verified), that a stock tablet's Google-synced passkey is REFUSED at registration because it is BE=1, and that bare app-login auto-registration derives the branch from the DOCTOR rather than the tablet and would have created a duplicate row at the wrong branch. Provisioned through the canonical flow: keystore proof, admin approval bound explicitly to TLK1, ONE device-scoped device-bound credential. The eligible estate grew 3 to 4, which moved the authorization target 45 to 60, and the 15 new pairs were created through the digest-bound command. Level 1 measured PASS and independently reconciled against the fleet engine; the owner then signed that prerequisite and nothing else. Level 2 is PARTIAL, Level 3 is FAIL, both unsigned. No flag armed, no cohort widened, no session lease touched, no activation."
base_branch: feature/sprint-26-phase-26-8-stabilization-closure-go-watch-no-go-report

# SECURITY_FIX, chosen up rather than down.
#
# The code change is small — one config value flipped from false to true, plus
# the tests that pin it. But that value is a SIGNATURE on a security
# prerequisite of global doctor enforcement, and the sprint that sets it also
# mutated the production trusted-device estate: a new trusted device and 15 new
# doctor-device authorizations. A wrong signature here is a false green on the
# gate a later activation decision reads.

runtime_change: false           # no application code changed. One config value
                                # (activation_test_prerequisites_attested) moved
                                # false -> true after the measurement turned
                                # true, and three tests were repointed to pin
                                # the state they test rather than inherit the
                                # shipped default.

schema_change: false            # NO migration. The production writes were made
                                # through canonical application paths — device
                                # enrolment/approval, one WebAuthn credential,
                                # and doctor:device-bulk-authorize. No raw SQL.

frontend_change: false          # no JS, CSS, Vite entry or Blade view.

security_impact: true           # a governed attestation on an estate
                                # prerequisite of global doctor enforcement was
                                # SIGNED, and 15 doctor-device authorizations
                                # were created on production. Enforcement itself
                                # is untouched: single_active_session still
                                # false, branch lock still inert, cohort
                                # unchanged, global_permitted still a
                                # source-controlled false, authorizes_activation
                                # still a literal false.

branch_isolation_impact: false  # the new device's branch is OPERATIONAL
                                # topology, not an access boundary. It was bound
                                # explicitly to TLK1 by an admin at approval
                                # precisely so it could not be derived from
                                # whichever doctor signed in first.

ledger_impact: false            # no inventory ledger, billing, payment, invoice
                                # or receivable path is reachable from here.

deploy_required: true           # the signed attestation only takes effect on
                                # the deployment that carries it, and production
                                # runs cached configuration.

browser_required: true          # the credential enrolment is a WebAuthn
                                # registration performed in a browser ON THE
                                # TABLET — the authenticator is whatever device
                                # the browser runs on, so it cannot be done from
                                # a laptop.

# NOT CREATED until every hard gate passes. A GO here means the ESTATE was
# provisioned and Level 1 is measured PASS and signed. It does NOT mean Level 2
# or Level 3 pass, and it authorises no activation.
