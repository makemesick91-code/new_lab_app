# CICD-CRITICAL-GATE-FILE-GET-CONTENTS-WARN-1 — Sprint Manifest
#
# The NSF-R011 Critical Test Gate concluded `success` while reporting
# `Tests: 2222 warnings, 9 passed` — 128 of its 129 test files marked WARN. The
# objective was never "make CI output visually clean". It was to make the gate's
# warnings attributable, actionable, deterministic and truthful.
#
# ROOT CAUSE, evidenced rather than assumed. Every warning was ONE PHP warning:
#   file_get_contents(<workspace>/…): Failed to open stream: No such file or directory
#   raised at vendor/vlucas/phpdotenv/src/Store/File/Reader.php:73
#   reached via Illuminate\Foundation\Bootstrap\LoadEnvironmentVariables::bootstrap()
# The target is the application's environment file at the repository root. It is
# OPTIONAL by framework design (`safeLoad`) and is deliberately never committed
# (INFRA-SEC-ENV-1), so CI configures the application through each job's `env:`
# block — but the framework still resolves the path and reads it on EVERY
# application boot. That is exactly 128 of 129: every test that boots the
# application warned, and the single file that never boots it (a pure unit test
# with no `uses(TestCase::class)`) passed. The one PASS file was
# PilotPerformanceSnapshotClassifierTest, and its 9 tests are the `9 passed`.
#
# The earlier "absent frontend build manifest" explanation is NOT the cause and
# stays retracted: tests/TestCase.php calls withoutVite(), the gate never builds
# the frontend, and no manifest path appears in any warning.
#
# The gate exited 0 because PHPUnit records a PHP warning as a test WARNING, not
# a failure, and nothing in the workflow ever judged the warning count.
#
# THE FIX IS AT THE CAUSAL BOUNDARY. CI now writes an EMPTY environment file in
# every job that boots the application. That is not a way to hide the warning —
# it is the accurate representation of the state CI is already in: the read
# succeeds and yields zero variables. Verified behaviour-neutral by comparing the
# resolved-configuration hash with and without the file (identical), and by a
# faithful CI simulation: `511 warnings, 9 passed` -> `520 passed`, same 4040
# assertions. Nothing is suppressed — no `@`, no stderr filter, no warning-text
# allowlist, no PHPUnit suppression toggle.
#
# The second half is the signal itself. A 2222-warning baseline made a genuinely
# NEW warning indistinguishable, so the gate now declares an expected warning
# count (zero) and fails on anything unexplained — with the test exit status
# keeping strict precedence, so the contract can never turn a red gate green.

