# Active sprint manifest — REVISION-DOCTOR-TRUSTED-DEVICE-ESTATE-CAPACITY-POLICY-1
# Validated by: php artisan sprint:manifest-check

id: REVISION-DOCTOR-TRUSTED-DEVICE-ESTATE-CAPACITY-POLICY-1
type: SECURITY_FIX
module: DoctorAccess
title: "Separate three trusted-device estate requirements that had been collapsed into one gate. `spare_device_available_per_branch` was measured correctly by the parent sprint and reported FAIL, and that verdict stands — but it was answering three different owner questions at once, so `can we begin activation testing at all?` was being answered with `does every branch survive losing a tablet?`. This revision names LEVEL 1 (>= 1 trusted device that can be logged into, per staffed branch — the only level that gates controlled activation TESTING), LEVEL 2 (>= 1 device per active Doctor room — the normal-production target, reported and never a blocker) and LEVEL 3 (stations + 1, unchanged in key, formula and answer). All three are measured from one estate snapshot, are free to disagree, and a lower level satisfies nothing above it. A signature that contradicts a measurement now fails a gate; an absent signature still fails nothing. Nothing was attested, no hardware provisioned, no flag armed, no cohort widened, no lease touched, and the measured Level 1 remains FAIL at one branch."
base_branch: feature/sprint-26-phase-26-8-stabilization-closure-go-watch-no-go-report

# SECURITY_FIX rather than MODULE_SPRINT, chosen up rather than down, and for
# the same reason the parent sprint chose it.
#
# In shape this is a read-only policy/scanner revision: one new support class,
# additions to one service, two repository reads, one scanner check, two config
# keys and one test file. It changes no permission, policy, middleware, route or
# enforcement decision.
#
# But the artifact is the GATE a later activation decision reads, and this
# revision LOWERS what one reading of it requires. A separation that gets it
# wrong converts a measured falsehood into a PASS, which is the single failure
# this family of engines exists to prevent. That earns audit level 3 and the
# full required gate.

runtime_change: true            # DoctorEstateCapacityLevel (new, read-only),
                                # DoctorEstateResilienceService / Verdict /
                                # Repository / Interface, the
                                # doctor:estate-resilience command, one new
                                # Phase4aPilotPreparationScanner check, and two
                                # config keys that ship attested FALSE. No
                                # controller, route, policy, middleware, model
                                # or migration.

schema_change: false            # NO migration. The two new reads are SELECTs
                                # against mst_clinic_rooms and
                                # trx_doctor_branch_covers, both long-existing;
                                # a named test asserts row counts across
                                # devices, authorizations, credentials, locks,
                                # covers and rooms are unchanged by two
                                # consecutive builds.

frontend_change: false          # no JS, no CSS, no Vite entry, no Blade view.
                                # The command registers no route.

security_impact: true           # the level that gates controlled activation
                                # testing is newly separated and deliberately
                                # LOWER than the gate it was folded into. The
                                # enforcement itself is untouched:
                                # global_permitted is still a source-controlled
                                # false, doctor.single_active_session is still
                                # off, branch lock stays inert, the cohort is
                                # unchanged, and the report carries
                                # authorizes_activation as a literal false
                                # pinned by test. `global_prerequisites` — the
                                # Phase-5 precondition — is NOT weakened.

branch_isolation_impact: false  # per-branch device counts remain OPERATIONAL
                                # RESILIENCE and explicitly not an access
                                # boundary. Cross-branch trusted-device use
                                # stays valid; a named test asserts a tablet at
                                # another branch does not cover a staffed branch
                                # locally, and none of that is an authorization
                                # decision.

ledger_impact: false            # no inventory ledger, billing, payment, invoice
                                # or receivable path is reachable from here.

deploy_required: true           # the separated levels only exist on the
                                # deployment that carries them, and the measured
                                # production status of each must be re-derived
                                # from the deployed engine rather than from a
                                # local transcription.

browser_required: false         # the operator surface is
                                # `php artisan doctor:estate-resilience` on the
                                # VPS.

