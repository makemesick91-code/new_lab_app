# REVISION-REGISTRATION-KTP-CAMERA-OCR-1
#
# Device-camera capture of an Indonesian KTP during patient registration plus
# browser-side, self-hosted OCR (tesseract.js 7, no CDN, no external OCR
# service) that SUGGESTS registration values. The server parses and validates
# the OCR text (KtpOcrParser, pure PHP, no DB/IO/logging); nothing is saved
# from OCR without operator review and an explicit "checked against the
# physical KTP" confirmation, and every value is validated exactly like manual
# entry. Behind `patient.ktp_camera_ocr` (FEATURE_PATIENT_KTP_CAMERA_OCR),
# default OFF and kept OFF in production until a supervised real-KTP / clinic
# tablet pilot. Also: decompression-bomb guard + retake discard on the KTP temp
# upload, a per-user/per-route `ktp-scan` rate limit, and a systemd timer that
# finally runs `patient-documents:prune-temp` on production (the Laravel
# scheduler never fires there). No migration, no permission, no role change.

