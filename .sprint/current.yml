# REVISION-DOCTOR-PWA-WEBAUTHN-ONLY-ACCESS-1
#
# Collapses three doctor authentication paths into one: the PWA with a WebAuthn
# trusted-device assertion becomes the sole supported doctor channel.
#
# Staged per the authoritative stage order. Stage 1 (this manifest's current
# scope) creates the canonical trusted-device identity proof and migrates the
# authorization gate onto it. It RETIRES NOTHING — Android authentication,
# enforcement scope and every feature flag are untouched, because retiring the
# Android path before this predicate exists would make new PWA-only tablets
# permanently unprovisionable.

id: REVISION-DOCTOR-PWA-WEBAUTHN-ONLY-ACCESS-1
type: SECURITY_FIX
module: DoctorDevice
title: "PWA-only doctor access: canonical trusted-device identity proof (Stage 1)"
base_branch: feature/sprint-26-phase-26-8-stabilization-closure-go-watch-no-go-report

# Impact flags — declared against the CURRENT diff (Stage 2b, break-glass).
#
# security_impact is TRUE twice over. Stage 1 changed the predicate gating
# DoctorDeviceAuthorization creation, and Stage 2b adds a path by which a
# doctor may hold a session with NO trusted device at all. The second is a
# genuine new way in, which is why it carries its own permission, a hard time
# bound, a written reason, revocation and an audit row at every transition.
runtime_change: true
schema_change: true
frontend_change: false
security_impact: true
branch_isolation_impact: false
ledger_impact: false

# STAGE 2b IS THE FIRST DEPLOY-COUPLED CHANGE IN THIS SPRINT.
#
# Stages 1 and 2a were inert: they changed which predicate decides eligibility,
# and nothing about that is observable until enforcement widens at Stage 4.
# Break-glass is different. DoctorAppLoginGate now reads
# `trx_doctor_break_glass_grants` at BOTH decision points, on every request of
# every doctor currently inside the enforcement scope. The code and its
# migration therefore have to land together — deploying the code without the
# table would break the three pilot doctors who are enforced today.
#
# `scripts/deploy-vps.sh` runs `migrate --force` before rebuilding caches, so a
# normal deploy satisfies this. It is declared here so nobody merges it
# expecting the same inertness the earlier stages had.
deploy_required: true
browser_required: false

test_profiles: []

# Withheld until the final gate passes on a verified deployed runtime. Stage 1
# alone can never earn it.
go_tag: revision-doctor-pwa-webauthn-only-access-1-go
go_tag_created: false

