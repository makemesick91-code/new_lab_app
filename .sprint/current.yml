# REVISION-LEGACY-PATIENT-STAGED-VERIFICATION-CANCEL-1
#
# Staged verification and cancellation for the Legacy Patient importer.
#
# THE RULE: uploading a legacy patient CSV is STAGING, not importing — and any
# ERROR row refuses the WHOLE batch, never just the good rows.
#
# Sprint 62.3 had already built staging -> preview -> commit and wrote
# `mst_patients` in exactly one place. The defect was the commit semantics: error
# rows were EXCLUDED rather than blocking, so 500 rows with 3 errors imported 497
# patients and nothing afterwards could say which 497. That was pinned by a
# passing test called `commit skips error rows`.
#
#   G1 one ERROR row now refuses the entire batch
#   G2 confirmation revalidates the whole batch against current database state
#   G3 the batch is sha256-bound to the source file the operator reviewed
#   G4 confirmation is explicit; cancellation records who, when and why
#
# Scope is Legacy Patient ONLY. Legacy RME and Legacy Odontogram governance is
# closed and is not reopened for symmetry.
#
# Two decisions stated rather than silently made:
#   * operator-branch narrowing is OUT OF SCOPE — the canonical authority is the
#     CSV `Cabang` column, and patient CRUD beside it is equally unscoped
#   * no permission changed; Admin Sunu already held `manage patients`
#
# One honest negative: mutant M11 (the in-transaction header lock) SURVIVED the
# automated suite. The UNIQUE indexes already prevent a duplicate patient; the
# lock only corrects the loser's refusal reason, which is proven by a documented
# two-process PostgreSQL procedure and not by a Pest test.

