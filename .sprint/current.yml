id: DOCTOR-ACCESS-PR-C-BULK-DEVICE-AUTHORIZATION
type: FOUNDATION_SPRINT
module: DoctorAccess
title: "Every eligible doctor explicitly authorized on every eligible trusted clinic tablet, as one reviewed action instead of a grid of clicks: a reconciliation that classifies each matrix cell from a single bounded read, a dry run that is the default and writes nothing at all, an approval token bound to the exact row delta rather than to a moment, and a write path that reuses the canonical approval service under a row lock that makes its device-admission branch provably unreachable. The third of three children of DOCTOR-ACCESS-SINGLE-SESSION-BRANCH-LOCK-1; the parent GO is NOT created here."
base_branch: feature/sprint-26-phase-26-8-stabilization-closure-go-watch-no-go-report

# FOUNDATION_SPRINT, the same type both siblings carried, and for a reason that
# is about audit depth rather than size. This writes a security boundary at fleet
# scale: audit level 3 and the full foundation audit apply. SECURITY_FIX would
# set allow_refactor: false and forbid the module-wide breadth this legitimately
# has; MODULE_SPRINT would buy audit level 2, which is a downgrade. `security_impact`
# does not require the SECURITY_FIX type — the validator only warns in the
# reverse direction.

runtime_change: true            # one service, four support value objects, one
                                # console command and two config bounds. No
                                # controller, no route, no policy, no migration:
                                # the write path is the existing authorization
                                # lifecycle service, called rather than copied.
schema_change: false            # NO migration. mst_doctor_device_authorizations
                                # already carries every column this needs, and its
                                # unconditional UNIQUE(doctor_id, doctor_device_id)
                                # is what makes "exactly one active authorization
                                # per pair" a database fact rather than an
                                # application promise.
frontend_change: false          # no JS, no CSS, no Vite entry, no Blade view.
                                # Console surface only.
security_impact: true           # it grants a doctor the right to authenticate
                                # from a tablet, at fleet scale, in one command.
                                # Declaring false here would be the quiet
                                # contradiction the manifest exists to catch.
branch_isolation_impact: true   # DELIBERATELY true, and deliberately in the
                                # direction that widens rather than narrows: a
                                # doctor's home branch is NOT an input to device
                                # eligibility, so this authorizes doctors onto
                                # tablets in branches they are not locked to.
                                # That independence is the product rule and
                                # production already depends on it, but a sprint
                                # that authorizes cross-branch device access
                                # while declaring no branch-isolation impact
                                # would be hiding the thing most worth reviewing.
ledger_impact: false            # no inventory ledger / billing / payment behaviour

deploy_required: true           # the command only exists on the deployment that
                                # carries it
browser_required: false         # there is no screen. The operator surface is a
                                # dry run they read and a digest they hand back,
                                # and the approval gate is deliberately NOT a
                                # terminal prompt: a prompt auto-answers with its
                                # default when nobody is at the terminal.

go_tag: doctor-access-pr-c-bulk-device-authorization-go

test_profiles:
  - focused
  - cross_module_regression
  - security

