# FEATURE-RME-BRANCH-TARIFF-PROVISIONING-1
#
# Provisioning governance for branch tariffs (owner D21 / D21h). No owner-approved
# tariff list exists anywhere (repository, VPS, connected documents, local files),
# so NO tariff is imported, invented, copied between branches or derived from an
# invoice. Production TLK1's 11 tariffs were found to be the Sprint 19
# TariffSeeder development defaults (byte-identical, one second, no audit row),
# which readiness counted exactly like approved prices.
#
# This release adds APPROVAL PROVENANCE so coverage and approval can never be
# confused again:
#   - mst_tariffs gains nullable approval_reference / approval_recorded_by /
#     approval_recorded_at (additive, not mass-assignable, nothing backfilled);
#   - rme:tariff-import --apply REQUIRES --approval-reference, bound into the
#     reviewed digest; CREATE rows carry it; an identical-price tariff without
#     provenance is ATTESTED under a row lock (price untouched); a different
#     price is still a CONFLICT (create-only preserved);
#   - a master-data change of price / date / treatment withdraws the approval;
#   - readiness reports provenance and `strict_eligible`; a strict branch with
#     unapproved tariffs is FAIL; the template prints provenance.
#
# Strict pricing stays OFF everywhere, price exceptions OFF, FEATURE_RME_INVOICE_
# CORRECTION OFF, no permission or role change. One additive migration. Rule 193.
#
# Type FOUNDATION_SPRINT: financial master-data governance across Tariff +
# RmeInvoice readiness, one migration; audit level 3. security_impact true.

