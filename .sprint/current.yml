# FEATURE-LEGACY-BATCH-REVIEW-PUBLISH-1 — PR1 of 2 (BATCH REVIEW)
#
# Reviewing and publishing legacy archives one document at a time is
# operationally too slow. This feature makes both batch-oriented — but they are
# NOT equivalent, and the owner split them across two PRs by RISK rather than by
# document type: review is non-final, publish is the dangerous, final half.
#
# PR1 (this manifest) ships BATCH REVIEW for both Legacy RME and Legacy
# Odontogram and changes nothing whatsoever about publishing. PR2 starts only
# after PR1 is merged, deployed, production-verified and GO-tagged.
#
# THE PRODUCT RULE PR1 PROTECTS
# -----------------------------
# There is no "Review All". The workspace speeds up REACHING and INSPECTING each
# document; it never substitutes for inspection. That is enforced structurally,
# not by UI convention: the decision vocabulary has no "all" value, the request
# that records an attestation names exactly one import, the submit request
# carries no item list at all, and submit() can only act on decision rows that
# already exist. An item nobody attested is untouched.
#
# Browser-open is deliberately NOT treated as proof of clinical review. View
# telemetry is recorded as supporting evidence and read by no gate — a
# precondition the system can satisfy on the operator's behalf would prove
# nothing.
#
# WHAT THE AUDIT FOUND, AND WHY THERE ARE TWO ADAPTERS
# ----------------------------------------------------
# Both lifecycles were read before any code was written. They share an identical
# nine-state machine (DRAFT..CANCELLED, same TRANSITIONS, same SLOT_OCCUPYING)
# but that agreement is intentional-but-independent — the odontogram module
# documents that its map is "derived from THIS module's own transition map, not
# copied from the RME one".
#
# Their ENFORCEMENT differs sharply:
#
#   RME        routes every write through LegacyRmeImportLifecycleService
#              ::perform(), shared verbatim with the ops CLI, running six
#              numbered gates INCLUDING separation of duties on review.
#   Odontogram has no lifecycle service and NO separation guard at all (a grep
#              for `separation` across the module returns zero hits), so an
#              uploader reviewing their own chart is permitted behaviour today.
#
# So batch review ships TWO adapter implementations, never one method with a
# type branch. Enforcing RME's rule on odontogram would make the batch surface
# silently stricter than the canonical page it mirrors; dropping it from RME
# would silently remove a clinical control. Both directions are pinned by tests.
#
# BLOCK IS A STICKY, NON-DESTRUCTIVE SECOND AXIS
# ----------------------------------------------
#   canonical import status = READY_FOR_REVIEW   (never written by triage)
#   review_triage_status    = BLOCKED            (new, additive, operational)
#
# and explicitly NOT `canonical import status = CANCELLED`. No new clinical
# lifecycle state is invented, because the existing schema does not require one.
# Blocking calls no canonical service, writes no canonical column, and never
# releases the patient's single-active-document slot — that slot is held by the
# canonical staging row's own status, and LegacySingleActiveDocumentService does
# not consult the triage table at all. Cancellation remains a separate, explicit,
# terminal act through the existing single-item flow.
#
# Clearing a block is itself a review-authority act, routed through the adapter
# so it reuses the canonical policy truth per type: on RME an uploader barred
# from reviewing their own document is equally barred from clearing a block on
# it; on odontogram, where no separation guard exists, a review-permission
# holder may.
#
# PARTIAL SUCCESS IS THE DESIGN, NOT AN ERROR PATH
# ------------------------------------------------
# One import is one transaction and the canonical layer is built that way — the
# review service opens its own transaction, takes its own row lock, and writes
# its audit row AFTER commit. Wrapping N of those in one outer transaction would
# roll back reviews that had already succeeded and would make the post-commit
# audit rows lie. So submit() LOOPS the canonical per-import call: 74 attested,
# 2 refused by the domain => 72 reviewed and 2 refused, never 0.
#
# NO PERMISSION WIDENING. Reuses `review_legacy_rme_imports` and
# `review_legacy_odontogram_imports` verbatim. No batch-specific ability exists,
# because a role grant whose only job is to reveal a menu is how privilege
# creeps. Nothing here grants create, publish or VOID.
#
# schema_change: true — three ADDITIVE staging tables, no column dropped, no
# existing table altered, no backfill. `migrate` only; never migrate:fresh or
# db:wipe. Nothing in them is clinical: deleting every row would lose the
# operator work-queue and change not one patient's archive.
#
# security_impact: true — a new authorization surface (session ownership, triage
# clearing, cross-archive IDOR) even though every clinical gate is inherited
# rather than re-expressed.

