# DOCS_ONLY, and the classification is honest rather than modest.
#
# The production CHANGE was a configuration-only activation: one environment
# value plus a config-cache rebuild on the host. No commit changed the runtime —
# production still runs 21b8a57a / tree 44fc27ee, the Phase-0 GO tag, exact match.
#
# What this repository diff contains is the RECORD of that ceremony plus the
# durable rules it earned: a sprint evidence document, four rule files, a runbook
# status banner and this manifest. Every changed file is Markdown or .mdc.
#
# Classifying it higher would be theatre; classifying the ACTIVATION as docs
# would be a lie. They are different objects and the distinction is stated in the
# evidence document rather than hidden in a type field.

