id: DOCTOR-ACCESS-GLOBAL-ACTIVATION-BLOCKER-CLOSURE-1
type: SECURITY_FIX
module: DoctorAccess
title: "Close the six activation blockers B1-B6 without performing any activation. B2 was the real one and was undercounted: seven source sites, not three, assert that fleet-wide doctor enforcement is neither permitted, declared nor live, so an honest Phase 5 would have made the gate FAIL on the outcome the programme exists to reach. The phase is now declared in source control and those checks report a distinct NOT_APPLICABLE outside phase_4a — never PASS, counted separately, still visible — while the halves that never stop mattering keep evaluating, and the prohibition is replaced by a Phase-5 precondition rather than by nothing: global_prerequisites, read by no code since Phase 3.5, now gates on recorded attestations that ship all false. B5 was re-diagnosed as ALREADY CLOSED and pinned instead of rebuilt. B1 performs each rollback rather than describing it. B3, B4 and B6 are documentation and terminology. No flag armed, no cohort widened, no lease touched."
base_branch: feature/sprint-26-phase-26-8-stabilization-closure-go-watch-no-go-report

# SECURITY_FIX rather than RUNTIME_FIX, chosen up rather than down.
#
# Nothing here adds, removes or relaxes a permission, policy or middleware, and
# the enforcement decision itself is byte-identical. But what changed is the
# semantics of the gates that VERIFY doctor enforcement, and a verification
# semantics change that gets it wrong either hides a fleet-wide lockout or
# teaches operators to ignore the thing that would have caught one. That earns
# audit level 3, the security regression profile and the full required gate.
#
# Not FOUNDATION_SPRINT: no new foundation, no schema, no module boundary moved.
# Not DOCS_ONLY despite four of six blockers resolving to prose — two scanners
# and two config files carry real runtime change.

runtime_change: true            # Phase4aPilotPreparationScanner gains a phase
                                # vocabulary, a NOT_APPLICABLE status and a
                                # prerequisite gate; AndroidReleaseGovernanceScanner
                                # gains the same phase read and scopes three
                                # composite conditions. No controller, route,
                                # policy, middleware, command or model.

schema_change: false            # NO migration. Every table this sprint reasons
                                # about is read by tests only, and the rollback
                                # suite asserts row counts across devices,
                                # authorizations, credentials, leases, locks,
                                # covers and audit logs are unchanged by an arm
                                # and disarm cycle.

frontend_change: false          # no JS, no CSS, no Vite entry, no Blade view.
                                # These scanners register no route at all.

security_impact: true           # the gates that verify doctor browser/device
                                # enforcement changed shape. The enforcement
                                # itself did not: global_permitted is still a
                                # source-controlled false, the cohort is still
                                # [9,15,18], and doctor.single_active_session is
                                # still off. Pinned by a 23-case phase matrix
                                # asserting that phase_4a behaviour is unchanged
                                # and that a skipped check never reads as PASS.

branch_isolation_impact: false  # no branch scope is read, written or widened.
                                # The branch-lock runbook is corrected; the
                                # resolver is not touched.

ledger_impact: false            # no inventory ledger, billing, payment, invoice
                                # or receivable path is reachable from here.

deploy_required: true           # the scanners only report the new semantics on
                                # the deployment that carries them, and the
                                # post-deploy assertion this sprint owes is that
                                # production STILL reports the pre-activation
                                # posture after the change lands.

browser_required: false         # the operator surface is
                                # `php artisan android:phase4a-pilot-readiness`
                                # and `android:release-readiness` on the VPS.

