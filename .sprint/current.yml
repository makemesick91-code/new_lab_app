# WHAT WAS WRONG.
#
# PRODUCTION-ANDROID-SIGNING-CUSTODY-READINESS-1 recorded, for custodian 1,
# `disk_encryption => true`. The release gate read that boolean and printed
# PASS. When PRODUCTION-ANDROID-SIGNING-KEY-PROVISIONING-1 went to generate the
# key it measured the workstation instead of reading the record, and the claim
# did not survive: `/` and `/home` mount straight from raw ext4 partitions
# (`/dev/sda1`, `/dev/sda3`), there is no `/dev/mapper` device, no LUKS
# signature, no eCryptfs and no fscrypt. `cryptsetup` was not even installed.
#
# One ambiguous boolean had been standing in for a control nobody had checked,
# on the one machine authorised to hold an unrecoverable signing key.
#
# WHAT THIS REVISION DOES.
#
# It splits the claim rather than flipping it:
#
#   host_full_disk_encryption = false   — the true fact about the host
#   primary_secret_storage    = LUKS2   — the control that protects the key
#
# A dedicated 256 MiB LUKS2 container now exists on custodian 1, created
# non-destructively beside the existing filesystem. No reinstall, no wipe, no
# repartition, no existing partition formatted — `mkfs.ext4` ran only on the
# new `/dev/mapper` device. The passphrase was entered interactively by the
# operator and is not known to any agent, not in argv, not in an environment
# variable, not in a file and not in this repository.
#
# It was verified as a lifecycle, not as a boolean: opened, mounted, written
# to, unmounted, closed, proven to hide its contents while closed, reopened,
# proven to return them, then closed again. Independent verification read the
# LUKS2 magic straight from the container header (`4c554b53babe0002`) rather
# than trusting the provisioning script's own output.
#
# The retired field is not merely renamed. `disk_encryption` is now an
# UNRECOGNISED custodian field and fails `custody_records_no_secret_material`,
# so the old ambiguous record cannot come back and satisfy the endpoint gate a
# second time.
#
# STORAGE READINESS IS NOT A KEY, AND THAT IS STILL THE WHOLE POINT.
#
# Still false after this revision, and asserted as false by the scanner:
# production signing key provisioned, backup copy 1 created, backup copy 2
# created, sealed-cold backup created, offsite backup created, recovery
# verified, certificate pinned (`production_certificate_sha256` stays null),
# production APK built, production enrolment, pilot enforcement activation,
# global enforcement activation.
#
# DEVICE_ENFORCEMENT_ACTIVE=false, DOCTOR_BROWSER_LOGIN_DENIED=false,
# enforcement.current_stage=off. No doctor — pilot or otherwise — is enforced.
# drg Karmila at Cabang Sunu is unaffected.
#
# RESIDUAL EXPOSURE, RECORDED RATHER THAN SMOOTHED OVER.
#
# This vault protects the keystore AT REST. It does not turn an unencrypted
# workstation into an encrypted one. Swap is `/swap.img`, 4 GB, file-backed on
# the unencrypted root filesystem, so key-derived material held in memory while
# the vault is open could page out in the clear. The operator disabled swap for
# the provisioning run and restored it afterwards; the runbook now requires the
# same for any future signing operation. Custodian 2's host encryption remains
# an operator DECLARATION about a remote Windows machine that this scanner has
# never measured — which, after what the same boolean concealed on custodian 1,
# is worth stating rather than assuming.
#
# KEY PROVISIONING REMAINS BLOCKED. The storage gap is closed; the physical
# custody gap is not. Backup 1 needs an operator at the Admin Klinik
# workstation and Backup 2 needs the Custodian 3 USB physically attached, and
# neither was available. See docs/sprints/production-android-signing-key-
# provisioning-1-blocked.md.
