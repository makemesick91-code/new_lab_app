# FIX-RME-INVOICE-CORRECTION-ZERO-ORIGINAL-GUARD-1
#
# One release (rule 201):
#
#   A. Zero-original guard. An RME invoice whose AUTHORITATIVE ORIGINAL total
#      is Rp0 can never be corrected: submit, approve (= apply, D1a) and the
#      recovery apply refuse CORRECTION_ORIGINAL_TOTAL_ZERO under the invoice
#      row lock, before any mutation (UNVERIFIABLE when v0 cannot be proven).
#      Reject and cancel stay open (D10 release). The original is persisted data:
#      the live row at correction_version 0, the frozen ORIGINAL (v0) document
#      version above it — never a request field. TEMPORARY FAIL-CLOSED boundary
#      on the owner's task instruction (register D28); D21g and D22 stay PENDING.
#      Closes the pilot-2 LOW-2 finding (rule 196 §23 was procedural only).
#
#   B. Rule 200 at the correction service. assertActor() decides every mutation
#      — cancel included, which the identity allowlist does not gate — on the
#      PERSISTED active account (ActiveAccountResolver) and asks the permission
#      and branch scope of THAT account, never of a stale in-memory object.
#
#   C. Two PostgreSQL races, both sides real services (child process):
#      correction rejection vs payment (D10), and account deactivation vs a
#      correction mutation (linearization point = the account re-read after the
#      invoice lock).
#
# No migration. No permission, role, route, RoleSeeder, feature-flag or config
# value change. Rp0 invoice ISSUANCE untouched; historical invoices (#36 Rp0
# UNPAID, #41 PARTIAL) untouched. Manual pricing D21, D1/D1a/D1c/D1e, D7, D10,
# invoice-version binding, explicit actors, OD-1/OD-1a preserved.
#
# Type SECURITY_FIX: one module (RmeInvoice), scoped financial security fix;
# security_impact true. Full pilot status unchanged (NO_GO, rule 196).

