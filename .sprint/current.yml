# RESTORE-DRILL-EVIDENCE-READ-STATE-1 — Sprint Manifest
#
# Restore-drill evidence gates ROLL-5 Stage 1. The service read it with
# `(string) @file_get_contents($path)`, which turns a failed read (`false`) into
# an empty string. An empty string is indistinguishable from a file that
# genuinely held nothing, so by the time the JSON decoder saw it the only
# surviving fact was "this did not parse" — and every upstream fault was reported
# to the operator as malformed JSON, including faults where not one byte was read.
#
# MEASURED AT THE BASE COMMIT, not assumed. Twelve fixtures against unmodified
# code as uid 1000 (so `chmod 000` genuinely denies the read) produced four real
# conflations: a zero-byte file reported as "no evidence file"; an unreadable
# file reported as "JSON cannot be parsed"; a failed read likewise; and
# well-formed JSON of the wrong shape (`12345`, `null`) also reported as
# unparseable. There is NO false GO here and none was introduced — every one of
# those states was already non-GO. This is a state-integrity defect.
#
# ALREADY KNOWN, AND ACCEPTED. CriticalGateWarningContractTest carried a note
# saying this service "casts a failed read to a string, so an unreadable evidence
# file reports 'invalid JSON' rather than 'unreadable'", judged acceptable
# because it still failed closed. The fail-closed half was correct and was
# re-measured. The half that does not hold up is that a less specific reason is
# therefore harmless: it sends an operator to fix a document's format when the
# fault is a permission or an I/O failure. That reasoning is superseded in place.
#
# THE FIX. A new RestoreDrillEvidenceReader decides the read outcome once, before
# any content is interpreted, and never coerces `false` to a string. The decode
# stage is split by json_last_error() so "the decoder rejected these bytes" and
# "these bytes are not an evidence object" stop sharing a reason.
#
# WHAT WAS DELIBERATELY NOT CHANGED. Candidate selection keeps its exact
# `is_file && filesize > 0` predicate. Letting a read fault fall through to the
# next candidate would have been strictly MORE PERMISSIVE — a secondary path
# answering for a canonical file nobody could read. The measured differential
# across all 13 states is READINESS_DELTAS = 0: every verdict is preserved, only
# the reasons became true.

