# FEATURE-RME-REFUND-SETTLEMENT-1 — rule 216, Sprint 5/7. Records that the money of an APPROVED refund
# request actually left the clinic (owner decisions RF-9 C, RF-10 B, RF-11 of 2026-10-31). Bank transfer and
# cash only, method-specific evidence, server time, full amount only. Settler != approver per account
# (service + PostgreSQL CHECK); settle_rme_refund held by NO role (not even Super Admin's '*') and the settler
# designation list ships EMPTY, so nobody can settle. Net received = payments - SETTLED refunds, adopted by
# every balance reader in one change (RFS-1); incoming payments are never written. Two additive migrations.
# Flag rme.billing_refund_settlement default OFF and requires rme.billing_refund_request.
# Type FOUNDATION_SPRINT: the change spans RmeInvoice, ClinicOversight, Reporting, RmeDashboard,
# AccessControl and two foundation services, so the stricter cross-module profile applies (audit level 3).
# Carried forward: LEGACY-RME-PROGRAM-CLOSURE-1 stays CLOSED and inherited.
