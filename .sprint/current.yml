# Six integrated fixes. FIX-01 replaces a request-body consent attestation with a
# real signed clinical document that is the server-side RME payment gate, which is
# a cross-module security foundation (Consent, RmeInvoice, ClinicVisit). The other
# five reshape the Medical Record workspace, relocate the RME print entry point,
# remove the odontogram from the RME print composition and put the receipt on one
# page. FOUNDATION_SPRINT is the accurate classification for cross-module
# foundation work and is the STRICTER choice: audit level 3 and
# full_foundation_audit, versus MODULE_SPRINT's 2.
title: "Signed PERSETUJUAN TINDAKAN MEDIS as the RME payment gate, Medical Record workspace hierarchy, relocated RME print, odontogram removed from the RME print, and a one-page receipt"
base_branch: feature/sprint-26-phase-26-8-stabilization-closure-go-watch-no-go-report

runtime_change: true            # payment gate, consent signing, print composition
schema_change: true             # one additive table for signed consent records
frontend_change: true           # Blade only (no JS/CSS/Vite change)
security_impact: true           # the payment gate stops trusting the request body
branch_isolation_impact: true   # consent is branch-scoped to the owning visit
ledger_impact: false            # no inventory ledger; payment amounts untouched

deploy_required: true
go_tag: fix-rme-consent-workflow-print-ux-2-go
browser_required: false         # every surface is proven by HTTP feature tests

