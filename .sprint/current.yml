# REVISION-NEW-VISIT-GLOBAL-PATIENT-LOOKUP-1 — Sprint Manifest
#
# Prompt classification: FEATURE_REVISION · NEW_VISIT ·
# GLOBAL_PATIENT_IDENTITY_LOOKUP · CROSS_BRANCH_REGISTRATION ·
# PRIVACY_SENSITIVE · AUTHORIZATION_SENSITIVE. `type` below is MODULE_SPRINT
# because that is the registered profile in config/sprint_profiles.php that
# matches a deliberate business-rule change inside one module;
# FEATURE_REVISION is not a defined type and inventing one would fail the
# manifest check rather than describe the work.
#
# WHAT CHANGES, AND WHY IT IS A REVISION AND NOT A BUG FIX. The predecessor
# sprint (REVISION-NEW-VISIT-PATIENT-SEARCH-COMBOBOX-1) scoped the "Kunjungan
# Baru" patient lookup to the operator's working branch. That was the correct
# reading of the rules as they stood, and it closed a real IDOR. The product
# rule has now deliberately changed: a patient who first registered at Telkomas
# and walks into Landak today must be findable by the Landak operator, by name
# or by Nomor RM, without anybody switching work branch.
#
# THE ONE DISTINCTION THIS SPRINT EXISTS TO ESTABLISH:
#
#     PATIENT IDENTITY  !=  VISIT BRANCH AUTHORITY
#
# Identity lookup for registration becomes global. Visit branch authority does
# NOT. The new ClinicVisit branch still comes from the operator's authorized
# daily working context — never from the patient's RM origin branch, never from
# a request `branch_id`. A cross-branch selection reuses the existing patient
# master row: no RM rewrite, no duplicate, no branch move, no context change.
#
# AND THE DISTINCTION IT REFUSES TO BLUR. Global patient IDENTITY discovery is
# not global CLINICAL HISTORY access. Nothing in this sprint widens visit
# history, RME, odontogram or payment authorization. Those endpoints keep the
# policies they had this morning.
#
# WHERE THE CHANGE ACTUALLY LANDS. Exactly one method:
# PatientSelectorSearchService::authorizedBranchIds(). That service is already
# registration-specific — the New Visit combobox endpoint, the submit-time
# `patient_id` re-authorization and the prefill all resolve through it, so
# search selectability and submit selectability cannot drift apart. The
# canonical RmeWorkingBranchScope is NOT globally relaxed; every other surface
# that consumes it (visit list, patient queue, RME reports, cashier, receivables)
# keeps its working-branch scope untouched.
#
# WHAT STAYS CLOSED. The endpoint still requires authentication and the
# ClinicVisit `create` ability, still takes no branch_id and no limit, still
# refuses to answer below two characters, still returns at most 15 rows, and
# still returns exactly four identity fields — id, name, medical_record_number,
# branch_label. Never phone, WhatsApp, KTP/NIK, address, date of birth, email.
#
# AND WHAT STAYS FAIL-CLOSED. A context-bound operator (Admin Klinik, Perawat,
# Kasir) with NO valid working context still reads nothing. Global means "any
# branch's patient", not "no authority required": an operator who is not
# working anywhere cannot register anywhere, so they may not read the registry
# either. That existing protection is preserved verbatim, which also keeps the
# enumeration surface from widening to unattached accounts.
#
# THE DOCTOR CLINICAL SCOPE IS DELIBERATELY UNTOUCHED. A Doctor holds
# manage_clinic_visits and is therefore a registration actor, but
# DoctorPatientScopeService still narrows them to their own RM scope. That is a
# CLINICAL scope, not a branch scope, and widening it would be exactly the
# identity-vs-clinical confusion this sprint is written to prevent.
#
# WHAT IS DELIBERATELY NOT CHANGED. No migration, no schema, no column, no
# index. No route, no route rename, no new permission, no policy change, no
# role change. No queue, cache, session or filesystem driver. The frontend
# changes by one line of helper copy; the combobox already rendered
# branch_label and needed no redesign.
#
# THE PREDECESSOR RUNTIME FIX IS PRESERVED. LIKE_ESCAPE stays '!' (never a
# backslash — see BUGFIX-NEW-VISIT-PATIENT-SEARCH-RUNTIME-1 for why PDO on PHP
# 8.3 + pdo_pgsql breaks on one), the placeholder-parity guard suite stays, and
# both patient-search suites stay declared in critical_gate_mandatory_suites
# and selected by a token in both critical gate variants.
#
# RECORDED, NOT FIXED HERE (out of scope by the sprint's own rule):
#   - ClinicVisitController::patientVisitOptions lacks a branch check. This
#     sprint explicitly does NOT use global identity lookup as a justification
#     to open it; the finding is carried forward unchanged.
#   - The dental Lab Order form still exposes phone through the retired
#     x-patient-search-select component. That component does not use this
#     service and is not affected either way.
#   - CrossBranchPatientLookupService and LegacyRmePatientResolutionAuditService
#     escape LIKE with a backslash but emit NO ESCAPE clause.

id: REVISION-NEW-VISIT-GLOBAL-PATIENT-LOOKUP-1
type: MODULE_SPRINT
module: ClinicVisit
title: 'New Visit patient lookup is global patient identity; the visit still happens at the operator''s own branch'
base_branch: feature/sprint-26-phase-26-8-stabilization-closure-go-watch-no-go-report

# Impact flags — MUST match reality.
runtime_change: true            # the branch scope the registration lookup resolves
schema_change: false            # no migration, no column, no table, no index
frontend_change: true           # one helper-copy line in the combobox component
security_impact: true           # deliberately widens a privacy-bounded lookup's scope
branch_isolation_impact: true   # identity lookup goes global; visit branch authority does not
ledger_impact: false
deploy_required: true           # the rule only takes effect for operators once deployed
browser_required: true          # cross-branch result must be proven through the real endpoint
test_profiles:
  - focused
  - permission_regression
