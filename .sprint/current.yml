# FIX-RME-INVOICE-BRANCH-SCOPE-EXPLICIT-ACTOR-1
#
# Security bugfix of the RME invoice service: branch authorization is decided
# from the EXPLICIT actor the caller passes, never from the ambient session.
# Closes rule 197 §30 for RmeInvoiceService.
#
# Root cause (reproduced on the base): RmeInvoiceService::cashierScopeBranchIds()
# returned RmeWorkingBranchScope::branchIdsFor(Auth::user()); with no session
# branchIdsFor(null) answers every active RME branch, so the cashier pending list
# and the handoff queue failed OPEN. Latent over HTTP (one authenticated caller
# each), real for any non-HTTP caller. Same audit: create() had no service-level
# usability/permission check; findInBranch() read BranchContext and had 0 callers.
#
# Runtime changes:
#   - RmeBillingActorGuard: the one billing-actor authority (persisted, active,
#     not deleted, manage_rme_billing on the persisted row), shared by
#     RmeInvoiceService and RmePaymentService.
#   - paginatePendingVisits / cashierHandoffQueue / findInvoiceForVisit take a
#     non-nullable explicit User actor; an unusable actor gets an EMPTY scope.
#   - create() refuses an unusable / non-billing cashier inside the transaction
#     after the visit lock (AuthorizationException, nothing written).
#   - RmePaymentService asks permission and working branch of the persisted
#     account (security review F2).
#   - RmeInvoiceController::create() returns View|RedirectResponse (pre-existing
#     TypeError/500 when an invoice exists, security review F1).
#
# No migration. No permission, role, route or feature-flag change. No owner
# decision. Rule 198. Correction service, SPN4 pilot, maker 29 / checker 1, D10,
# invoice-version binding and manual pricing D21 untouched.
#
# Type SECURITY_FIX: authorization fix in RmeInvoice (invoice + payment), audit
# level 3. security_impact true.

