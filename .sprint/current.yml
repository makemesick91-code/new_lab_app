# FEATURE-RME-INVOICE-CORRECTION-RECEIPT-FOUNDATION-1
#
# Foundation for RME invoice correction and receipt versioning, shipped PARTIAL
# and dormant. Every owner decision D1–D27 was still PENDING, so nothing that
# needs one is invented:
#   - PRE-PAYMENT correction only (UNPAID invoice, no payment, no lab candidate):
#     submit → approve (maker != checker, enforced in the service under the
#     invoice row lock, Super Admin included) → apply (atomic, totals recomputed
#     server-side in cents, original frozen as v0, revision as vN). A payment
#     that lands first makes the correction STALE.
#   - all mutation behind the default-OFF, critical flag `rme.invoice_correction`
#     (routes 404 while off), and the three operational permissions are granted
#     to NO role — turning the flag on still enables nobody until the owner
#     grants a role (D1).
#   - read-only BILLING CORRECTION oversight for Finance Klinik / Data Analyst via
#     the fifth oversight permission `view_billing_correction_oversight`.
#   - NOT implemented: post-payment correction, refund, reversal, patient credit,
#     Rp0 adjustment, retroactive revenue adjustment.
# Five additive migrations (four new tables + one defaulted column). No data
# migration, no change to lab billing tables or to any existing payment row.

