# REVISION-OVERSIGHT-DASHBOARD-DATE-RANGE-1
#
# The Finance & Data Analyst dashboard (/oversight/dashboard) moves from one
# clinic date to an INCLUSIVE WITA date range (start_date..end_date), rule 187:
#
#   - ClinicalDateRange value object: [start 00:00 WITA, end+1 00:00 WITA) in
#     UTC; DATE columns as [start, end+1). Never 23:59:59, never whereDate().
#   - One compatibility rule: none -> today; both -> range; one -> rejected;
#     legacy `date` -> that day; reversed -> rejected, never swapped; max 366
#     inclusive days; dates within 2000-01-01..2099-12-31.
#   - Patients / transactions / revenue / cancellations over the range
#     (formulas of rule 186 unchanged). PIUTANG AKTIF PER SAAT INI stays the
#     current balance — its repository method takes no range at all.
#   - Refresh feed, CSV and print carry the same range; audit uses the
#     allowlisted date_from/date_to keys. METRIC_VERSION 1 -> 2.
#
# No migration, no schema change, no permission, role or route change.
# Rule 186 roles, branch scope and read-only posture are untouched.

