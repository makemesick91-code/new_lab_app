# FEATURE-RME-POSTPAYMENT-INVOICE-CORRECTION-1
#
# Program DAENGTISIAMS-RME-BILLING-CORRECTION — Sprint 3/7 (rule 207). Built on
# the owner decisions PP-1…PP-10 ratified on 2026-10-25
# (RATIFICATION-RME-POSTPAYMENT-OWNER-DECISIONS-PP1-PP10-1). IMPLEMENTATION with
# the switch OFF; activation is its own owner decision (PP-10) and stays blocked
# while the pre-payment pilot is NO_GO (VERIFICATION-…-REAL-CASE-42-1).
#
#   C1. Receipt snapshot foundation (PP-5): one immutable receipt snapshot per
#       payment, issued inside the payment transaction; legacy receipts are
#       reconstructed (labelled) before the first post-payment correction
#       mutates; a superseded receipt is reprinted from its snapshot, "DIREVISI".
#   C2. POST_PAYMENT domain behind `rme.invoice_postpayment_correction` (default
#       OFF): type from the ledger under the invoice lock, mandatory owner
#       approval reference (code + DB CHECK), its own eligibility and staleness.
#   C3. Outcomes: status re-derived by the one ledger helper payments use;
#       downward below paid ⇒ OPEN overpayment obligation (no refund, no
#       negative receivable); upward ⇒ outstanding; equal ⇒ balanced.
#   C4. PP-8 (lab refused / never generated), PP-9 (read-only obligation list).
#
# Three additive migrations (columns on corrections, obligations + events,
# receipt snapshots; PostgreSQL CHECKs / partial index; down() refuses while
# rows exist). No backfill, no permission, no seeder, no role change; no
# JS/CSS/asset change.
#
# Preserved: D1, D1a, D1c, D1e, D7, D10, D21, D28, OPS-OQ-1 / 1a / 1b, OD-1 /
# OD-1a, rule 191, rule 205, rule 206; D21c, D21g, D22 stay PENDING.

