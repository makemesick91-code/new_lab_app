### Active sprint manifest — DOCTOR-ACCESS-TRUSTED-DEVICE-ESTATE-RESILIENCE-1
### Validated by: php artisan sprint:manifest-check

id: DOCTOR-ACCESS-TRUSTED-DEVICE-ESTATE-RESILIENCE-1
type: SECURITY_FIX
module: DoctorAccess
title: "Measure the estate resilience prerequisite that has never had an implementation. `spare_device_available_per_branch` has gated global doctor enforcement since Phase 3.5 as a string in a list plus a hand-signed boolean, and the scanner that reads it asserts only that somebody signed — so nothing in the system could tell the signer whether what they were signing was true. This sprint adds the read-only engine that measures the measurable half: per-branch eligible hardware, spare headroom against the runbook's stations+1 formula, credential coverage, an authorization matrix recomputed from the CURRENT estate, and a failure-domain view of losing one tablet. An input the system does not hold produces UNVERIFIED, never PASS. The measured verdict is FAIL: no branch holds a second eligible tablet and one branch homing two doctors holds none at all. Nothing was attested, no hardware was provisioned, no flag armed, no cohort widened, no lease touched."
base_branch: feature/sprint-26-phase-26-8-stabilization-closure-go-watch-no-go-report

# SECURITY_FIX rather than MODULE_SPRINT, chosen up rather than down.
#
# In shape this is a module sprint: one read-only service, one console command,
# one config key, one test file. It changes no permission, policy, middleware,
# route or enforcement decision, and every existing gate is byte-identical.
#
# But the artifact is a GATE that a later activation decision will read, and the
# sibling sprint's reasoning applies unchanged: a verification that gets it wrong
# either hides a fleet-wide lockout or teaches operators to ignore the thing that
# would have caught one. That earns audit level 3 and the full required gate.

runtime_change: true            # DoctorEstateResilienceService (read-only),
                                # DoctorEstateResilienceVerdict, the
                                # doctor:estate-resilience command, and one new
                                # config key that ships EMPTY. No controller,
                                # route, policy, middleware, model or migration.
                                # A bulk credential repository was written and
                                # then DELETED as redundant — the device estate
                                # read already eager-loads credentials.

schema_change: false            # NO migration. The engine reads
                                # mst_doctor_devices, mst_doctor_branch_locks,
                                # mst_doctor_device_authorizations and
                                # trx_doctor_device_webauthn_credentials, and a
                                # named test asserts row counts across all of
                                # them are unchanged by two consecutive builds.

frontend_change: false          # no JS, no CSS, no Vite entry, no Blade view.
                                # The command registers no route.

security_impact: true           # the estate gate feeding a Phase-5 prerequisite
                                # is new. The enforcement itself is untouched:
                                # global_permitted is still a source-controlled
                                # false, the cohort is still [9,15,18],
                                # doctor.single_active_session is still off, and
                                # the report carries authorizes_activation as a
                                # literal false pinned by test.

branch_isolation_impact: false  # per-branch device counts are OPERATIONAL
                                # RESILIENCE and explicitly not an access
                                # boundary. No branch scope is read for
                                # authorization, written or widened; a named test
                                # asserts a doctor is not required to be
                                # authorized on hardware at their own branch.

ledger_impact: false            # no inventory ledger, billing, payment, invoice
                                # or receivable path is reachable from here.

deploy_required: true           # the command only exists on the deployment that
                                # carries it, and the measured estate this sprint
                                # reports must be re-derived on production from
                                # the deployed engine rather than from a local
                                # transcription.

browser_required: false         # the operator surface is
                                # `php artisan doctor:estate-resilience` on the
                                # VPS.

