# FIX-CI-GATE-WORKDIR-TEMPFILE-LEAK-1 — Sprint Manifest
#
# WHAT THIS SPRINT IS. The corrective for R-22, the blocker raised by
# FINAL-PRE-FULL-SUITE-READINESS-CHECK-1. Two release-gate call sites allocated
# their workdir with a raw mkdir instead of the canonical owner, so 42 passing
# tests stranded 18 directory trees on every run.
#
# THE REAL DEFECT IS THE AUTHORITY, NOT THE TWO CALL SITES. The readiness audit
# proved that a KNOWN-prefix census reported 447 / 447 / delta 0 while an
# unknown prefix leaked +18 elsewhere. A census can only report on names it was
# told about in advance, so it can never report the one thing that matters: an
# allocation nobody registered. Adding `ctl3b` and `fix6-fullsuite` to a list
# would have closed the symptom and left the defect.
#
# So the authority moved:
#
#   AUTHORITATIVE   the canonical allocation API and its registry owner
#   DIAGNOSTIC      known-prefix counts, historical accounting
#
# A new prefix must never need central registration to earn cleanup.
# tempArtifactDir('brand-new-thing-') is protected the moment it is written —
# proven by mutation M4, while M3 proves an unknown prefix that BYPASSES the API
# is still caught.
#
# A DEFECT IN THIS SPRINT'S OWN GUARD, FOUND BY MUTATION. M6 first reported
# PASS: a ternary handing back tempArtifactDir() on the passing path and a raw
# path on the failing one earned a free pass from a `str_contains` skip.
# Containing an owner is not having one, and the exempted path was the failing
# one — exactly the path a leak guard exists for. Fixed and pinned permanently.
#
# HISTORICAL ORPHANS PRESERVED. 111 standing trees (104 ctl3b, 7 fix6-fullsuite)
# measured, not assumed, and left in place.
# HISTORICAL_R22_ORPHANS_DELETED_BY_SPRINT=0. The 18 trees this sprint's own
# reproduction created were removed by exact path, never by a glob sweep.
#
# FULL SUITE. Not authorised. The previous authorisation was consumed by run
# 32700184849 and it FAILED. FULL_SUITE_EXECUTION_COUNT=0. This sprint carries
# its own GO tag; it does NOT close the stabilization programme, and the next
# step is to repeat the readiness check, not to run a Full Suite.

