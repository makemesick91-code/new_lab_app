# SECURITY-F8C-ENV-COPY-BACKUP-CLASSIFICATION-1 — environment copies named with
# "backup" anywhere are classified as backups. scripts/harden-secret-permissions.sh
# recognised only prefix forms (.env.bak*, .env.backup*, ...), so a copy named
# after the occasion first (.env.wave1-backup-20260913-100607) was classified as a
# runtime file and reset to 0640 on every deploy, giving the runtime group read
# access to a stale copy of every secret. Fix: one pattern in the classifier;
# gate the INFRA-SEC-ENV-1 suite, which matched no critical-gate token before.
# No migration, no route, no permission, no application code change.
# Carried forward: LEGACY-RME-PROGRAM-CLOSURE-1 stays CLOSED and inherited.
