# SECURITY-F3-CSV-CELL-GUARD-1 — seven web CSV exporters wrote raw cell values. A
# value beginning with = + - @ tab or CR (a patient or product name, a batch
# number, a note) becomes a live formula in the spreadsheet a user opens. Five
# other exporters each carried a private guard. Fix: one shared helper,
# App\Support\Export\CsvCell (decision D20: numbers and plain numeric strings stay
# unchanged), applied to every row of the seven exporters; an end-to-end hostile-
# value test per exporter; a scan that fails when a file starts writing CSV without
# the guard. Consolidating the private copies is SAFE-CLEANUP M-8, not this PR.
# Carried forward: LEGACY-RME-PROGRAM-CLOSURE-1 stays CLOSED and inherited.
