# AUDIT-RME-CLINIC-VISIT-BRANCH-AUTHORITY-1
#
# Security audit of ClinicVisitService actor/branch authority, with the fix the
# audit proved necessary. Closes rule 198 §31.
#
# Reproduced on the unmodified base (a98af8fc):
#   - LATENT: ClinicVisitService read Auth::user() in 8 places + BranchContext in
#     one dead method. With no session the visit list, queue, counts and branch
#     selector answered EVERY RME branch (branchIdsFor(null)); the ambient session
#     decided scope; "Selesai Pemeriksaan" skipped the clinical check for a null
#     user; create() failed only at the database.
#   - EXPLOITABLE over HTTP: rme.visits.patient-options authorized viewAny only,
#     so a Kasir pinned to branch A read branch B patient visit history (200);
#     the RME dashboard summed payments/receivables over every RME branch for a
#     context-bound operator and honored ?branch_id= for any branch.
#
# Runtime changes:
#   - ClinicVisitActorGuard: one clinic-visit actor authority (persisted, active,
#     not deleted; ClinicVisitPolicy abilities asked of the persisted row).
#   - Every actor-dependent ClinicVisitService method takes a non-nullable
#     explicit User actor; transitionStatus keeps a nullable actor only for the
#     cashier-owned `completed` transition (RmePaymentService).
#   - patient-options requires `create` + PatientSelectorSearchService::isSelectable.
#   - RME dashboard + visit-list medical-record widgets use
#     ClinicVisitService::scopedBranchIdsFor($request->user()).
#   - Dead find() (BranchContext, 0 callers) removed.
#
# No migration. No permission, role, route or feature-flag change. No owner
# decision taken (cross-branch Kontrol picker recorded as open owner decision
# OD-1). Rule 199. Invoice/payment explicit actor, correction service, SPN4 pilot,
# maker 29 / checker 1, D10, invoice-version binding and manual pricing D21
# untouched.
#
# Type SECURITY_FIX: authorization fix in ClinicVisit (+ RmeDashboard caller and
# MedicalRecord count signature), audit level 3. security_impact true.

