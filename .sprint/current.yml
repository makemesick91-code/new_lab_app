# SECURITY-F1-CLOSE-PUBLIC-REGISTRATION-1 — Breeze scaffolding left GET/POST
# /register open: anyone on the internet could create an account and was logged in
# at once. The account held no role, so protection rested on every authenticated
# route authorizing its own action. Decision D1: DISABLE. Fix: remove the two
# routes, the controller and the view; a test sweeps every parameterless
# authenticated GET route as a role-less user and allows only the self-scoped
# pages (profile, notifications, confirm-password). Staff accounts continue
# through Settings -> Users (`manage users`).
# Carried forward: LEGACY-RME-PROGRAM-CLOSURE-1 stays CLOSED and inherited.
