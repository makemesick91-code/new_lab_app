# REVISION-NEW-VISIT-PATIENT-SEARCH-COMBOBOX-1 — Sprint Manifest
#
# Prompt classification: FEATURE_REVISION · NEW_VISIT · PATIENT_SELECTION ·
# SEARCHABLE_COMBOBOX · PRIVACY_SENSITIVE · BRANCH_SCOPE_SENSITIVE. `type` below
# is MODULE_SPRINT because that is the closest registered profile in
# config/sprint_profiles.php — FEATURE_REVISION is not a defined type and
# inventing one would fail the manifest check rather than describe the work.
#
# WHAT THIS SPRINT IS. "Kunjungan Baru" chooses a registered patient through ONE
# searchable combobox instead of a filter box plus a native select. The operator
# types a name or a Nomor RM, the server answers with the patients they are
# authorized to register, and an explicit choice sets patient_id.
#
# WHY IT IS NOT COSMETIC. The control it replaces rendered EVERY patient the
# query returned into the create page as <option> elements — and the option label
# included each patient's phone number. Worse, the query behind it was
# `Patient::with('branch')->orderBy('name')` with a doctor-only scope, so for
# Admin Klinik, Kasir, Perawat, Owner and Supervisor RME it was every patient in
# every branch, active or not. Collapsing to one control is the visible half; the
# invisible half is that the estate is no longer serialised into the page and the
# search now runs inside the canonical working-branch scope.
#
# WHY IT IS BRANCH-SCOPE-SENSITIVE. Branch authority is delegated to
# RmeWorkingBranchScope — the same authority ClinicVisitPolicy already uses — so
# a context-bound role (Admin Klinik / Perawat / Kasir) searches only its active
# working branch and fails closed with no context. This is strictly a NARROWING
# of what the page previously exposed. The endpoint accepts no branch_id at all,
# so a crafted query cannot widen or re-point the scope, and the daily branch
# lock still owns mid-day moves.
#
# WHY IT IS PRIVACY-SENSITIVE. The response carries exactly four identity fields
# (id, name, medical_record_number, branch_label) and is pinned by an exact
# key-set assertion, so phone / WhatsApp / KTP / address / DOB / email cannot
# reappear by accident.
#
# WHAT IS DELIBERATELY NOT CHANGED. No migration, no schema, no permission, no
# policy, no route rename. No registration, queue, room, consent, RME/odontogram,
# visit-completion, invoice or payment behaviour. Inactive patients stay
# selectable exactly as before — "inactive" is not "unauthorized", and excluding
# them would be an operational policy change nobody asked for. The legacy
# x-patient-search-select component stays in place for the dental Lab Order form,
# which is a different page and out of this sprint's scope.

