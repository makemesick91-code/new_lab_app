### Active sprint manifest — FIX-READINESS-ESTATE-SNAPSHOT-INTEGRITY
### Validated by: php artisan sprint:manifest-check

id: FIX-READINESS-ESTATE-SNAPSHOT-INTEGRITY
type: RUNTIME_FIX
module: DoctorAccess
title: "One readiness report reads the device estate once. DoctorFleetReadinessService cleared its estate memo inside activeAuthorizationPairs(), which runs between two of the three gates that consume it, so a single build() loaded the hardware twice and could compute its authorization matrix against one moment and its coverage table against another. The reset moves to the top of build(), keeping the per-build freshness it was reaching for without tearing one report across two snapshots. Also corrects the proof-count example that named the wrong device, the duplicate-pair comment that denied an index that exists, and the one branch-registry line that still asserted a deprecated code. No gate weakened, no flag touched, no cohort moved, no Wave started."
base_branch: feature/sprint-26-phase-26-8-stabilization-closure-go-watch-no-go-report

# RUNTIME_FIX, not FOUNDATION_SPRINT. The parent readiness sprint carried
# FOUNDATION_SPRINT because it wrote a clinician's permanent home branch at fleet
# scale and named the verdict an activation sprint reads. This moves one
# assignment inside one private method of one read-only service. Claiming the
# parent's type to inherit its audit depth would be manufacturing scope; the
# honest depth here is a runtime correctness fix with a regression suite and a
# mutation pass, which is exactly what RUNTIME_FIX asks for.
#
# Not SECURITY_FIX either: no policy, permission, middleware or authorization
# path is touched, and the qualifying-proof gate is preserved verbatim — only
# the prose around it was wrong.

runtime_change: true            # one statement moved in
                                # DoctorFleetReadinessService::build(). No new
                                # class, no signature change, no controller, no
                                # route, no policy, no command. The report's
                                # output is unchanged on a stable estate; what
                                # changes is that it can no longer be computed
                                # from two.

schema_change: false            # NO migration. This sprint reads the same tables
                                # the engine already read and writes none of
                                # them. A test asserts two builds leave
                                # sys_audit_logs, mst_doctor_devices and
                                # mst_doctor_device_authorizations untouched.

frontend_change: false          # no JS, no CSS, no Vite entry, no Blade view.
                                # The readiness engine still registers no route
                                # at all, which the sibling non-mutation suite
                                # continues to pin.

security_impact: false          # no permission, policy, middleware or gate is
                                # added, removed or relaxed. The qualifying-proof
                                # rule (a proof counts only on hardware the
                                # doctor can still use) is preserved exactly; the
                                # mutation pass proves a test fails the moment it
                                # is weakened. The enforcement cohort and every
                                # doctor feature flag are untouched.

branch_isolation_impact: false  # no branch scope is read, written or widened.
                                # The engine reports on home-branch locks; it has
                                # never assigned one and still cannot.

ledger_impact: false            # no inventory ledger, billing, payment, invoice
                                # or receivable path is reachable from this
                                # service.

deploy_required: true           # the fix only exists on the deployment that
                                # carries it, and the readiness figure has to be
                                # re-read from production afterwards and
                                # reconciled against direct SQL — a report
                                # agreeing with itself is not evidence.

browser_required: false         # there is no screen. The operator surface is
                                # `php artisan doctor:fleet-readiness` on the VPS.

