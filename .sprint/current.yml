# SECURITY-FIX-DEPLOY-BACKUP-FILE-PERMISSIONS-1
#
# Database dumps are private FROM THE INSTANT OF CREATION. Every dump writer
# (deploy, rollback, scheduled ENT-12 backup, manual helper) now goes through
# scripts/lib/private-db-dump.sh: umask 077 scoped to the dump subshell, an
# exclusive noclobber create of <dest>.partial, partial removed on failure or
# empty output, published at 0640 by atomic rename; backup directories 2750,
# default ACL refused. The deploy/rollback storage normalization prunes the
# backup tree from its 2775/0664 widening. Replaces `pg_dump > file; chmod`,
# which left the inode 0644 for the whole dump (the scheduled path never chmod'd
# at all). No migration, no permission, no route, no application logic change.

