# FEATURE-RME-BRANCH-TARIFF-AUTHORITY-1
#
# Owner decisions D1, D7, D10 and D21 (task-supplied decision evidence) are
# recorded in docs/decisions/rme-billing-correction-owner-decisions.md and
# partly enforced:
#
#   D21 — the branch tariff master is the RME price authority. Every invoice
#         line is priced server-side and records its provenance; a branch in
#         STRICT_ENFORCED mode (explicit config only) refuses off-tariff
#         prices, discounts, free text, missing/zero tariffs and Rp0. Every
#         branch ships TRANSITIONAL because no official tariff list exists for
#         the only billing branch (SPN4). Price exceptions are built, OFF, and
#         their two permissions are granted to no role.
#   D10 — a pending or approved-unapplied correction blocks payment on every
#         path, under the invoice row lock, whole-batch, audited.
#   D21(4) — a correction must keep every resulting line at its branch tariff.
#   D1  — enforcement pinned as the owner contract; role grants NOT applied.
#
# FEATURE_RME_INVOICE_CORRECTION stays OFF. One additive migration (nullable
# price provenance columns on trx_rme_invoice_items). Rule 192.
#
# Type FOUNDATION_SPRINT, not SECURITY_FIX: this is a cross-module financial
# foundation (Tariff + RmeInvoice + AccessControl, one migration), not a scoped
# fix. Both profiles are audit level 3 with the full foundation audit, so the
# classification costs no rigor; security_impact stays true.

