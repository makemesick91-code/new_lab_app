deploy_required: true           # the invariant must be proven on the production host
browser_required: false         # no UI surface

test_profiles:
  - deploy
  - architecture

# Finding that triggered this sprint (production, srv1730088):
#   the environment file at the application root was mode 0644 (world-readable)
#   owned root:root, on a host shared with a co-tenant application and a
#   postgres service account.
#
# Root cause: NO deploy step had ever asserted a mode on it. The file was created
# once by hand under the default umask 022 and inherited 0644 permanently; the
# deploy script only ever hardened storage/ and bootstrap/cache.
#
# Target mode 0640 root:<runtime group> was derived from the real runtime, not
# assumed: scripts/deploy-vps.sh rebuilds the config cache AS THE PHP-FPM RUNTIME
# USER, and phpdotenv's safeLoad() swallows a permission error — so 0600 would
# silently produce a config cache with an empty application key and empty
# database credentials. The runtime group genuinely requires read.
#
# Explicitly NOT claimed: the co-tenant application runs under the SAME unix
# account (www-data), so same-UID read is not closed by a file mode. See §
# "Residual risk" in docs/sprints/infra-sec-env-1-production-secret-file-permission-hardening.md
