# AUTHORITATIVE-CONSOLIDATED-FULL-SUITE-AND-CLOSURE-1 — Sprint Manifest
#
# WHAT THIS SPRINT IS. The final closure gate of the DaengtisiaMS stabilization
# programme. FINAL-STABILIZATION-RESIDUAL-AUDIT-1 certified
# READY_FOR_AUTHORITATIVE_CONSOLIDATED_FULL_SUITE=true with
# FULL_SUITE_EXECUTION_COUNT=0. This sprint freezes that authority as an
# immutable candidate, runs EXACTLY ONE explicitly authorised consolidated Full
# Suite against it, and — only on a genuine PASS — merges, deploys and tags the
# same tree.
#
# WHAT IT IS NOT. It is not an implementation sprint and it is not a licence to
# debug the Full Suite. A failed run is NO-GO plus a named corrective sprint. It
# is never rerun automatically: a second complete-suite execution needs new
# explicit user authorisation.
#
# WHY THE MANIFEST IS PART OF THE CHANGE SET (deliberate, load-bearing).
# `.sprint/current.yml` matches no CI classifier pattern, so it resolves the
# change set to `unknown_high_risk` and therefore `run_critical_tests=true`. The
# Full Suite STEP is guarded by `if: run_critical_tests != 'false'`. A
# docs-only change set would resolve to `docs_only`, the step would SKIP, and
# the dispatch would produce a green "Full Suite" job that executed no tests —
# a false green consuming the one-shot authorisation. The manifest is what makes
# the authoritative run actually run.
#
# WHY THE TEMPORARY FULL-SUITE POLICY STAYS ACTIVE IN THIS CANDIDATE.
# Retiring it here would be false at freeze time (policy s10 retires only once
# closure is FINISHED) and — mechanically — would flip `full_suite_authorized`
# to true for the post-merge `push` to base, so merging this very PR would fire
# a SECOND, unauthorised Full Suite. The policy therefore stays ACTIVE; its
# retirement is a distinct post-closure governance act requiring the user's
# explicit decision. This is recorded as rule CLOSE-R05.
#
# RUNTIME BLAST RADIUS. Zero. No app/, config/, routes/, database/, resources/
# or scripts/ file is touched. The change set is: this manifest, one sprint doc,
# one durable rule mirror, one governance contract test, and the CLAUDE.md
# closure record.

