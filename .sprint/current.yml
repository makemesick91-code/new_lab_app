# SECURITY-F8-PRIVATE-STORAGE-PATHS-1 — private storage paths declared and never
# widened. DMS_PRIVATE_PATHS (deploy/runtime-identity.conf) predated three
# private disks and two dump directories, so every deploy normalized them to
# 2775/0664 and left them readable by other local accounts (filesystem only;
# HTTP was never involved). The deploy also sourced the identity file from the
# live host copy before the fast-forward, so a release adding a path only took
# effect one deploy later. Fix: list every private disk and dump/manifest
# directory; prune declared paths from the deploy/rollback widening; merge the
# target release's list after the fast-forward (union, scripts/lib/private-paths.sh);
# the isolation verifier checks the merged set. No migration, no route, no
# permission, no application code change.
# Carried forward: LEGACY-RME-PROGRAM-CLOSURE-1 stays CLOSED and inherited.
