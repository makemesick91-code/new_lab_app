# The parent sprint is MERGED AND DEPLOYED, and deliberately carries NO GO TAG:
# a device-binding claim needs a ceremony on the real Samsung tablet, and no
# simulated authenticator can stand in for the BE/BS hardware flags.
#
# THIS SUB-SPRINT DOES NOT INHERIT THAT BLOCKER, AND DOES NOT LIFT IT.
#
# What is being proved here is containment, not hardware: that a session
# authenticated by proof X stops when proof X is withdrawn, on a device that also
# holds proof Y. Both proofs are real in the suite — a genuine EC P-256 software
# authenticator and a genuine Android keystore signature over a server nonce —
# and neither claim depends on what a physical tablet reports about backup
# eligibility. So this may be tagged on its own evidence.
#
# `doctor-pwa-webauthn-1-go` REMAINS FORBIDDEN until the tablet ceremony runs.
inherits_webauthn: DOCTOR-PWA-WEBAUTHN-1 (merged f0da6f90, deployed, NO GO TAG — tablet ceremony still pending)

# The Phase 4A doctor-device pilot is ARMED in production and its sprint is
# frozen mid-flight (PR #392 open, unmerged, no GO tag). drg Karmila (users.id
# 18) works from PHASE4A_PILOT_TABLET_02 — device 3, authorization 2, ACTIVE,
# cryptographically_verified, Android public key present.
#
# THAT TABLET IS THE DUAL-PROOF DEVICE THIS SPRINT IS ABOUT, and nothing here
# touches it: no device is revoked, no authorization is revoked, no credential is
# registered, no flag is armed, no enforcement scope changes.
#
# One deploy-day effect is real and is stated rather than smoothed over: a
# doctor-device session bound before this build carries no recorded proof and is
# denied on its next protected request. Inside the armed scope that is exactly
# one account, and re-authentication is the path her tablet already uses. The
# alternative — reading an absent proof as the permissive one — would grandfather
# precisely the sessions this sprint exists to contain.
inherits_armed_pilot: PHASE4A-DOCTOR-ANDROID-PILOT-ACTIVATION-1 (frozen, armed, unmerged)

