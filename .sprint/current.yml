# REVISION-PATIENT-KTP-OCR-FIELD-BASED-ROI-1
#
# Hybrid field-based KTP OCR. The browser finds the card, straightens it,
# reads each patient field in its own box from a versioned normalized template
# (ektp-v1) with a field-specific character set, and still runs the previous
# whole-card read. The server parses both and reconciles field by field: agreement
# confirms, disagreement is shown to the operator with both values and neither
# pre-selected, never settled by confidence. Operators can move/resize boxes,
# set card corners and re-read a field; a re-read never overwrites an accepted
# or typed value. A request without field reads gets the previous payload byte
# for byte. Pilot gate, flag, branch isolation, private storage, NIK masking,
# CSRF, rate limit, confirmation and duplicate check unchanged.
# Synthetic benchmark only — real-KTP accuracy is PENDING (pilot decision D7).
# No migration, no permission, no route, no patient column, no pilot/env change.

