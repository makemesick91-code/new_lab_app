# REVISION-LEGACY-ODONTOGRAM-NATIVE-OPTIONAL-1 — Sprint Manifest
#
# Prompt classification: BUSINESS_RULE_REVISION · LEGACY_ODONTOGRAM ·
# NATIVE_CUTOFF · CLINICAL_HISTORY · PRIVACY_SENSITIVE ·
# IMMUTABILITY_SENSITIVE · NO_NATIVE_SIDE_EFFECTS. `type` below is RUNTIME_FIX
# because that is the registered profile in config/sprint_profiles.php for a
# change to shipped runtime behaviour; BUSINESS_RULE_REVISION is not a defined
# type and inventing one would fail the manifest check rather than describe the
# work.
#
# THE REVISION. The archive refused any patient with no native odontogram
# (`PATIENT_HAS_NO_NATIVE_ODONTOGRAM`, LegacyOdontogramDateRuleService:127).
# That inverted the real situation: a legacy odontogram is a paper chart the
# clinic already holds, and the patients whose charts most need archiving are
# precisely the ones this system has never examined. Owner decision:
#
#     LEGACY_ODONTOGRAM_REQUIRES_NATIVE = false
#
# THE DISTINCTION THIS SPRINT PRESERVES:
#
#     NATIVE OPTIONAL  !=  NATIVE CUTOFF REMOVED
#
# When a meaningful native odontogram exists it still bounds the archive, at the
# EARLIEST one, STRICTLY earlier, with equal still refused. Only the "there must
# be one at all" gate is gone — the constant, the config switch and the refusal
# branch were deleted rather than defaulted off, so the retired rule cannot come
# back through a settings edit.
#
# THE SECOND DISTINCTION, WHICH THIS SPRINT MAKES LOAD-BEARING:
#
#     NO NATIVE FOUND  !=  THE NATIVE LOOKUP FAILED
#
# Before the revision both outcomes refused, so conflating them was untidy but
# harmless. Now absence ALLOWS, so folding a database fault into `null` would
# turn a broken query into permission to file a chart with no chronological
# bound. The resolver has no try/catch on that path, deliberately, and a test
# holds it there.
#
# security_impact is true because an eligibility rule on a clinical-evidence
# screen is being widened, and because the fail-closed/fail-open boundary above
# changes meaning. branch_isolation_impact is false: the archive's branch is
# still derived from the patient's Nomor RM and a submitted branch_id is still
# ignored — asserted, not assumed.
#
# NO MIGRATION. This is a service-level rule change; a schema change here would
# have meant the design went wrong.

id: REVISION-LEGACY-ODONTOGRAM-NATIVE-OPTIONAL-1
type: RUNTIME_FIX
module: LegacyOdontogram
title: 'A legacy odontogram is historical evidence and no longer requires a native odontogram to exist first; when one does exist it still bounds the archive'
base_branch: feature/sprint-26-phase-26-8-stabilization-closure-go-watch-no-go-report
runtime_change: true            # date rule service, resolver + repository contracts
schema_change: false            # no migration, no column, no table, no index
frontend_change: true           # the create Blade view's cutoff panel; no JS, no asset build
security_impact: true           # eligibility widened; fail-open/fail-closed boundary re-stated
branch_isolation_impact: false  # archive branch derivation from Nomor RM is unchanged
ledger_impact: false
deploy_required: true           # operators cannot archive never-examined patients until this ships
browser_required: true          # the upload screen told the operator the archive was blocked
test_profiles:
  - focused
  - permission_regression
go_tag: revision-legacy-odontogram-native-optional-1-go
inherits_closure: LEGACY-RME-PROGRAM-CLOSURE-1
inherits_hold: FIX-CLINIC-OPS-BRANCH-CONTEXT-WA-1/FIX-02
