### Active sprint manifest — DOCTOR-ACCESS-FLEET-ROLLOUT-READINESS-1
### Validated by: php artisan sprint:manifest-check

id: DOCTOR-ACCESS-FLEET-ROLLOUT-READINESS-1
type: FOUNDATION_SPRINT
module: DoctorAccess
title: "Fleet readiness measured as the thing it actually is, and a governed way to reach it: a gate that separates a PROVISIONED trusted path from one a clinician has actually walked, adds the home branch and the whole-estate authorization the provisioning engine never asked about, and fails closed on absence of evidence rather than reading silence as a pass; plus a thin CLI adapter that drives an explicit owner-approved home-branch matrix through the canonical approval service, dry-run by default and bound to the exact row delta. Ends at READINESS. It performs no global activation and creates no activation authority."
base_branch: feature/sprint-26-phase-26-8-stabilization-closure-go-watch-no-go-report

# FOUNDATION_SPRINT, the same type all three siblings carried, and for the same
# reason: audit depth, not size. This writes a clinician's permanent branch at
# fleet scale and renames the verdict a future activation sprint will read, so
# audit level 3 and the full foundation audit both apply. SECURITY_FIX would set
# allow_refactor: false and forbid the two-module breadth this legitimately has
# (DoctorAccess for the new engine and adapter, DoctorDevice for the narrowed
# verdict). MODULE_SPRINT would buy audit level 2, which is a downgrade.
# `security_impact` does not require the SECURITY_FIX type — the validator only
# warns in the reverse direction.

runtime_change: true            # two services, two support value objects, one
                                # repository behind a new interface, and two
                                # console commands. No controller, no route, no
                                # policy, no migration: the readiness engine
                                # COMPOSES the provisioning engine and the
                                # assignment adapter CALLS the canonical approval
                                # service rather than copying either.

schema_change: false            # NO migration. Every fact this sprint reads
                                # already exists — mst_doctor_branch_locks for the
                                # home branch, the two success actions in
                                # sys_audit_logs (both `action` and `performed_by`
                                # indexed) for a login that happened, and
                                # mst_doctor_device_authorizations for the matrix.
                                # Readiness reports on state; it never creates it.

frontend_change: false          # no JS, no CSS, no Vite entry, no Blade view.
                                # Console surface only, and a test asserts the
                                # fleet report registers no route at all — a
                                # readiness gate reachable over HTTP is a gate
                                # somebody can ask for a widened answer from.

security_impact: true           # the assignment adapter writes a permanent branch
                                # under maker/checker separation, and the renamed
                                # verdict is the signal an activation decision
                                # reads. Both are security boundaries even though
                                # neither adds a permission.

branch_isolation_impact: true   # DELIBERATELY true. A home branch lock narrows a
                                # doctor's operational lists to that branch, so
                                # assigning fourteen of them changes what fourteen
                                # clinicians can see. The adapter performs INITIAL
                                # ASSIGNMENT only; a doctor already locked
                                # elsewhere is classified TRANSFER_REQUIRED and
                                # stopped, never silently moved.

ledger_impact: false            # no inventory ledger, billing, payment, invoice
                                # or receivable behaviour is reachable from either
                                # command.

deploy_required: true           # both commands only exist on the deployment that
                                # carries them, and the fleet readiness figure this
                                # sprint reports must be read from production
                                # rather than from a fixture.

browser_required: false         # there is no screen. The operator surface is a
                                # console command on the VPS, and the real-device
                                # readiness ceremony that follows is performed by
                                # clinicians at tablets, not by a browser test.

go_tag: doctor-access-fleet-rollout-readiness-1-go

