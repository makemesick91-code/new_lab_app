# FIX-SUNU-GO-LIVE-BLOCKERS-1
#
# Closes the blockers found by DAENGTISIAMS-SUNU-GO-LIVE-READINESS-1 while
# gating the Cabang Sunu (SPN4) go-live.
#
# Two runtime correctness fixes and two operations fixes, all of them earned by
# a defect observed on production rather than inferred from reading:
#
#   B5  a visit with NO medical record could be invoiced — the finalization
#       guard only fired when a record existed. SPN4 visit 52 sat in exactly
#       that state, billable, for twelve days.
#   B6  revoking a break-glass grant left its session lease open, and under
#       single_active_session an open lease locks the doctor out of EVERY path.
#       The 2026-09-18 drill left one open for ~18 hours.
#   B2  both documented restore procedures would have failed — pg_restore
#       against plain-text dumps, and a rehearsal the app role cannot run.
#   B3  no scheduled database backup existed at all, and schedule:run is never
#       invoked, so a Laravel-scheduled one would silently no-op.
#
# It arms no flag, widens no scope, retires nothing and starts no stage.

id: FIX-SUNU-GO-LIVE-BLOCKERS-1
type: RUNTIME_FIX
module: RmeInvoice,DoctorAccess
title: "Billing needs a finalized record; break-glass revoke must free its lease; backups must be scheduled and restorable"
base_branch: feature/sprint-26-phase-26-8-stabilization-closure-go-watch-no-go-report

# Impact flags — declared against the CURRENT diff, verified against the BASE
# ref rather than the working tree.
#
# security_impact is TRUE: B6 changes what happens when emergency access is
# revoked, and B5 changes who may create a financial record. Neither widens
# access — B5 refuses strictly more than before, and B6 ends a session that
# revocation had already decided should end.
#
# ledger_impact is FALSE in the inventory sense (no stock movement is touched),
# but B5 does gate INVOICE creation, which is called out here rather than left
# for a reviewer to discover.
#
# schema_change FALSE: no table, column or migration. frontend_change FALSE: no
# JS, CSS or Vite input.
runtime_change: true
schema_change: false
frontend_change: false
security_impact: true
branch_isolation_impact: false
ledger_impact: false

# Deploy is required: the go-live depends on the fixed billing gate being the
# one that runs, and the owner sequenced the Sunu payment UAT AFTER this deploy
# so the staff test exercises the fixed build rather than the old one.
deploy_required: true
browser_required: false

test_profiles: []

go_tag: fix-sunu-go-live-blockers-1-go
go_tag_created: false

