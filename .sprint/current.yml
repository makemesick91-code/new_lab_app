# ── The defect that triggered this sprint ───────────────────────────────────
# scripts/deploy-vps.sh was executed straight out of the working tree while,
# roughly halfway through its own body, it ran:
#
#     git checkout "$BRANCH"
#     git pull --ff-only origin "$BRANCH"
#
# bash does not slurp a script. It reads it incrementally and keeps a byte
# offset into the open file, so rewriting those bytes underneath a running
# interpreter is undefined behaviour: the shell can resume mid-token at a stale
# offset and execute a line no author ever wrote. The same applied to every
# helper the deploy invoked AFTER the pull —
# scripts/harden-secret-permissions.sh and scripts/verify-runtime-isolation.sh
# were re-read from the tree the deploy had just rewritten, which is the same
# defect one indirection removed.
#
# Two recent releases had to be rescued with a manual pre-pull. That workaround
# succeeded but must not become permanent deployment architecture.
#
# ── The invariant this sprint locks ─────────────────────────────────────────
#
#     RUNNING_DEPLOY_PROGRAM != MUTABLE_REPOSITORY_FILE
#
# Once a deployment starts executing its deployment program, that program is
# immutable for the duration of the run.
#
# ── Preserved, not weakened ─────────────────────────────────────────────────
# INFRA-SEC-ENV-1  (secret file permissions)   remains CLOSED / IMMUTABLE / GO.
# INFRA-SEC-RUNTIME-1 (dedicated runtime identity, co-tenant isolation)
#                                              remains CLOSED / IMMUTABLE / GO.
# Backup-before-migrate stays absolute; migrations stay additive migrate --force
# with no destructive database command; the ENT-8 cache order and the ENT-11
# deploy/rollback contract are unchanged. The rollback path is hardened the same
# way and still takes its snapshot from the CURRENT code, so rolling the
# application back never rolls the security tooling back.
