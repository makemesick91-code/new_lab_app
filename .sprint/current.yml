title: "A sanitized operator runbook for the owner-authorized one-time removal of the pre-go-live fictional patient estate: 50 patients and every patient-owned dependency, executed by a human against production under a fail-closed transaction, with the pre-existing unreferenced storage orphans explicitly excluded"
base_branch: feature/sprint-26-phase-26-8-stabilization-closure-go-watch-no-go-report

runtime_change: false           # documentation only. No application source, no command,
                                # no service, no observer, no job. The destructive SQL is
                                # printed in a runbook for a human to paste; it is
                                # deliberately NOT wired into a deploy hook, migration,
                                # seeder, CI step or application startup path.
schema_change: false            # no migration, no column, no index
frontend_change: false          # no JS, no CSS, no Blade
security_impact: false          # no permission, role, policy, gate or auth path changes.
                                # The runbook forbids touching the Front Office branch and
                                # device lock flags and the doctor device registry.
branch_isolation_impact: false  # the wipe removes every branch's patient data by explicit
                                # owner scope correction; no branch scoping rule changes
ledger_impact: false            # no inventory ledger behaviour. Patient-owned lab billing
                                # rows are removed as data, by proven exclusive ownership,
                                # not by changing any billing rule.

deploy_required: false          # nothing to deploy. The runbook is executed by an
                                # operator over SSH against the production database.
browser_required: false         # post-wipe empty-state verification is described in the
                                # runbook for the operator, not performed by this change.

notes: |
  Authored because the Claude Code auto-mode classifier blocks destructive production
  database operations from an agent session. The owner instructed that no bypass be
  attempted and that an operator-ready runbook be produced instead. That instruction was
  followed: no alternate shell, tunnel or database client was used.

  The frozen manifest in the runbook was measured read-only against production on
  2026-09-23 (WITA) and MUST be re-measured immediately before execution. The runbook
  fails closed if the patient count is not exactly 50.
