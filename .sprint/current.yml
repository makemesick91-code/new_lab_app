# REVISION-PATIENT-KTP-LIVE-FIELD-OVERLAY-OCR-1
#
# Live field overlay on the KTP camera preview. Once the camera is open (which
# already needs the KTP holder's D7 "yes"), a bounded analysis — a module worker
# where the browser has one, else the main thread — finds the card with the
# shipped detector and draws the card outline and the versioned template's field
# boxes over the video (SVG layer, never part of the photo), with a RED / YELLOW /
# GREEN indicator and plain instructions. OCR still runs once, after capture. The
# capture checks the card ON THE CAPTURED PIXELS (live corners are only compared),
# crops to the card, reads a lossless copy and hands the confirmed corners to the
# existing field read as boundary.reason = 'live'; an unconfirmed capture passes
# no corners. No migration, no permission, no route, no patient column, no
# pilot/env change; the pilot scope, period (ends 2026-10-16) and device waiver
# are unchanged. Real-device and real-KTP results PENDING physical execution.

