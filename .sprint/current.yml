# PHASE-1-PATIENT-KTP-CAMERA-OCR-SUPERVISED-PILOT
#
# Confines KTP camera OCR (REVISION-REGISTRATION-KTP-CAMERA-OCR-1) to a
# supervised pilot. The global flag `patient.ktp_camera_ocr` alone now enables
# NOBODY: eligibility additionally needs the server-side pilot scope
# (config/patient_ktp_ocr_pilot.php) — explicit operator cohort, exactly one
# approved RME branch resolved server-side (RmeWorkingBranchScope), an
# inclusive clinical-calendar period, and (fail-safe ON) an approved tablet
# bound through the front-office trusted-device lock. Decided only by
# KtpCameraOcrPilotGate; the parse endpoint answers 404 and the camera UI is
# hidden for every denial while manual registration is unchanged. Adds the
# read-only `patient:ktp-ocr-pilot-status` command and a supervised pilot
# protocol. Deploys INERT (flag off, cohort empty). The physical real-KTP /
# tablet pilot is NOT part of this release and is not claimed.
# No migration, no permission, no role change.

