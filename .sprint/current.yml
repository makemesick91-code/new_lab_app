title: "Phase-0 delta recheck of DOCTOR-ACCESS-GLOBAL-ACTIVATION-1: re-read production from scratch after four GO'd prerequisites and prove the programme is ready for an explicit owner APPLY decision. Read-only against production — zero mutations, no lease released, no flag armed, no cohort widened, no attestation signed. The estate did not degrade (15 doctors, 4 eligible devices [3,5,6,7], 60/60 authorizations, Level 1 PASS and attested, device 7 clean). Two adversarial corrections were earned and are now durable rules: Half A is fleet-wide in population but its effects split — branch narrowing is immediate for every doctor while lease enforcement begins at each doctor's next login, so arming narrows everyone and evicts nobody; and the lease population is wider than the branch-lock population because subjectTo() carries no governance-account exemption. Half B is implemented (MODE_UNSCOPED works) but blocked on a committed value, a phase move, and five attestations of which four can never be contradicted by any measurement. The one unreleased lease is a stale orphan whose cleanup is planned for inside the activation window, not before it."
