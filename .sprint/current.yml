# REVISION-RME-VISIT-DETAIL-INVOICE-REGISTRATION-UX-1
#
# Three owner-authorised revisions in one governed release (rule 185):
#
#   A. Visit detail renders the clinical cards Odontogram -> Rekam Medis ->
#      Resep, in SOURCE order (focus and reading order follow the screen).
#   B. The RME payment invoice follows the clinic's printed landscape INVOICE
#      form, rendered by ONE shared partial for the browser print and the
#      dompdf PDF. Every amount comes from RmeInvoiceDocument (stored canonical
#      fields, exact integer cents, self-reconciling). Refund terms and the
#      bank account are owner-approved and source-controlled
#      (config/rme_invoice.php, no env()).
#   C. "Jenis Kunjungan" is no longer an operator choice: the server derives
#      Kontrol only from an explicitly selected prior visit, otherwise Baru,
#      and ignores any client visit_type. An invalid selected prior visit is
#      rejected, never downgraded. Control-chain billing is unchanged.
#
# No migration, permission, route or schema change. Blade + one presenter +
# one request derivation + one config + one cropped brand asset. The new Blade
# uses Tailwind utilities, so the deploy's asset build is required.

