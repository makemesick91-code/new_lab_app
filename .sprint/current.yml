# SECURITY-F8B-CONFIG-CACHE-PRIVATE-1 — the compiled configuration cache is a
# declared private path. `php artisan config:cache` writes the resolved
# configuration, database password and application key included, to
# bootstrap/cache/config.php. The environment file is 0640 (INFRA-SEC-ENV-1), but
# the deploy normalized bootstrap/cache to 2775/0664, so every local account could
# read both secrets from the cache. Fix: declare bootstrap/cache in
# DMS_PRIVATE_PATHS (admitted by exact name in scripts/lib/private-paths.sh), so
# deploy and rollback prune it from the widening and the isolation gate verifies
# it. No migration, no route, no permission, no application code change.
# Carried forward: LEGACY-RME-PROGRAM-CLOSURE-1 stays CLOSED and inherited.
