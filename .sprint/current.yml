# WHAT CHANGED IN THE WORLD.
#
# Nothing outside this repository, and nothing signed. No key was generated, no
# vault was opened, no PKCS12 was read, no password was typed, no tablet was
# touched, no APK was distributed. An UNSIGNED release APK was compiled from
# this tree for the first time in the project's history.
#
# THE FINDING.
#
# `assembleRelease` had never succeeded. app/build.gradle.kts named
# `proguard-rules.pro`; the file was never committed, so the build died at
# :app:minifyReleaseWithR8. Three sprints built an artifact verifier, a signer
# resolver, a certificate pin and a 42-check readiness gate that reported GO
# around an artifact that could not be produced on any of those days.
#
# Governance missed it because `required_release_block_markers` proves the
# release block CONTAINS the string `proguardFiles` and nothing proved the file
# it NAMES exists. That is rule 147's orphaned predicate, second instance.
#
# WHAT THIS SPRINT DOES.
#
# 1. Adds proguard-rules.pro, minimal by verification: the wire protocol is
#    built from string literals, so R8 cannot alter a byte the device signs.
# 2. Adds release_proguard_files_present, which walks balanced parentheses
#    because a naive regex stops at getDefaultProguardFile's close paren.
# 3. Renames the manifest's ambiguous `git_commit` to release_source_sha and
#    adds release_source_tree, declaring the two-commit provenance model: the
#    tree that BUILT the artifact is not the evidence commit that DESCRIBES it.
# 4. Turns "never run an interactive REPL on production" into a gate that runs
#    before the deploy runner opens a connection — and removes the three
#    tracked scripts that were doing exactly that, two of them in order to ask
#    whether they were running on production.
#
# STILL FALSE, AND ASSERTED FALSE.
#
# APK signed, distributed or installed; tablet touched; ADB used; device
# enrolled; pilot enforcement activated; global enforcement activated.
# DEVICE_ENFORCEMENT_ACTIVE=false.
#
# The signing ceremony is a human custodian action and is deliberately NOT part
# of this candidate. RELEASE SOURCE is frozen and CI-green BEFORE signing; the
# evidence commit comes after and is a SECOND commit.
