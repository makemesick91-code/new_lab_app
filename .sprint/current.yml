notes: |
  THE FINDING.

  `device_management.pilot_model` was `self_owned_device_owner`, and six of the
  thirty-three recorded `pilot.acceptance_checks` are Device Owner / lock-task
  properties. Android grants Device Owner only on a device carrying no accounts,
  i.e. immediately after a factory reset. The owner refused a factory reset for
  this pilot and the tablet is already in service, so those six checks were
  unsatisfiable and the recorded pilot was unrunnable. An existing test pinned the
  unrunnable value in place. Rule 147's orphaned-predicate class, third instance.

  THE HALF THAT MATTERED MORE.

  Lock task was also what physically kept a doctor away from a browser, so
  deferring it moves the app-only boundary entirely onto the server. It holds
  there — a browser session is denied from the ABSENCE of a server-verified device
  binding, re-checked on every protected request — but only while enforcement is
  armed FOR THAT DOCTOR. The only switch was one global boolean that denies browser
  login to every Doctor-role account. So the two reachable states were a fleet-wide
  clinical lockout, or an "app-only pilot" in which the doctor can simply open
  Chrome. The deferral and the pilot-scoping mechanism are one change, not two.

  WHAT CHANGED IN THE WORLD.

  Nothing outside this repository. No tablet was touched, no ADB was run, no APK
  was distributed, installed, rebuilt or re-signed, no device was enrolled, no
  authorization was approved, no enforcement was armed, no vault was opened and no
  signing key was read.

  STILL FALSE, AND ASSERTED FALSE.

  apk_distributed, apk_installed, tablet_touched, adb_used, device_enrolled,
  pilot_activated, pilot_browser_denial_active, global_enforcement_active — all
  eight asserted by `activation_boundary_all_false`. The preparation lifecycle
  stops at `ready_for_pilot`, and an unrecognised state is a FAIL rather than a
  pass.

  Fleet-wide denial is deliberately NOT reachable from a host: `global_permitted`
  lives in the governance record, which never reads the environment, so widening
  enforcement to every doctor costs a reviewed source-control change.
