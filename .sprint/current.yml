### Active sprint manifest — DOCTOR-ACCESS-PR-B-BRANCH-LOCK-COVER
### Validated by: php artisan sprint:manifest-check

id: DOCTOR-ACCESS-PR-B-BRANCH-LOCK-COVER
type: FOUNDATION_SPRINT
module: DoctorAccess
title: "One server-authoritative branch per doctor, derived on every request rather than stored as a verdict: a home lock nobody may guess and every doctor starts without, a temporary cover that never rewrites it, half-open cover periods whose non-overlap invariant is a service holding three row locks because no index can express a range predicate, maker-checker enforced inside the approval transaction so the Super Admin bypass cannot reach past it, and session invalidation as the one mechanism behind cover activation, cover expiry and an approved transfer alike. The second of three children of DOCTOR-ACCESS-SINGLE-SESSION-BRANCH-LOCK-1; the parent GO is NOT created here."
base_branch: feature/sprint-26-phase-26-8-stabilization-closure-go-watch-no-go-report

# FOUNDATION_SPRINT, the same type PR-A carried, and for the same reason. This is
# cross-module foundation work: it hooks the RME list scope, the visit-creation
# write path, the online-context selector and the report filter, and it changes
# what an authenticated session means for every doctor. Audit level 3, the full
# foundation audit and the full-required test profile all apply. A SECURITY_FIX
# label would forbid exactly the cross-module breadth this work IS, and
# MODULE_SPRINT would buy audit level 2 — a downgrade. Neither is available and
# neither was taken.

runtime_change: true            # a resolver, two approval services, three models,
                                # three repositories, a controller, five form
                                # requests, two policies, and edits to the lease
                                # middleware, the claim listener, the lease
                                # service and model, the RME branch scope, visit
                                # creation, the online-context selector and the
                                # report filter. All inert while the flag is off.
schema_change: true             # FOUR additive migrations: mst_doctor_branch_locks,
                                # trx_doctor_branch_lock_requests,
                                # trx_doctor_branch_covers, and two nullable FK
                                # columns plus an index on
                                # trx_doctor_session_leases. No alter of an
                                # existing column, no drop, NO BACKFILL — and the
                                # fourth re-asserts PR-A's partial unique index
                                # with its predicate in both up() and down(),
                                # because adding an FK column makes SQLite rebuild
                                # the table and Laravel re-creates its indexes
                                # from introspection without the WHERE clause.
frontend_change: false          # no JS, no CSS, no Vite entry, no asset build.
                                # Blade views ARE added — the approver queue, two
                                # filing forms and two components — but they are
                                # server-rendered templates using existing x-ui
                                # components, which this manifest key does not
                                # cover: it gates the frontend build, and nothing
                                # here needs npm run build.
security_impact: true           # it decides what a doctor may read and write, it
                                # can end somebody else's session, it adds THREE
                                # permissions and a critical flag, and its
                                # maker-checker invariant is the thing standing
                                # between one account and both sides of an
                                # approval.
                                #
                                # THREE, corrected from four. The surface READS
                                # four — the controller and both policies check
                                # view_/manage_/approve_doctor_branch_locks plus
                                # release_doctor_session_leases — but the fourth
                                # is PR-A's and appears in this diff only as a
                                # context line. PR-A's manifest already claims
                                # it, so counting it here made the two sibling
                                # manifests total five where the estate gained
                                # four. Keeping the attribution straight is the
                                # whole point of splitting a sprint three ways.
branch_isolation_impact: true   # THE POINT of this pull request. It narrows the
                                # RME list scope and the visit write path to a
                                # server-derived branch, as an INTERSECTION with
                                # the existing authorised scope, and it
                                # deliberately leaves per-record reads and the
                                # legacy archive cross-branch.
ledger_impact: false            # no inventory ledger / billing / payment behaviour

deploy_required: true           # the four migrations and the twelve routes only
                                # exist on the deployment that carries them
browser_required: true          # an approver has to READ, on a real screen, what
                                # approving will do to a doctor who is online; the
                                # degraded-lock row has to be legible to whoever
                                # must act on it; and an evicted doctor has to see
                                # a sentence they can act on rather than a blank
                                # login form. Arming the flag is a supervised
                                # window on real hardware — never a deploy step.

go_tag: doctor-access-pr-b-branch-lock-cover-go

test_profiles:
  - focused
  - cross_module_regression
  - security

