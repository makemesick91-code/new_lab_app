# HARDENING-RME-INVOICE-CORRECTION-PILOT-IDENTITY-PAYMENT-ACTOR-1
#
# Security hardening of the live SPN4 pre-payment invoice correction pilot and
# of the RME payment service, under owner decision D1e (2026-10-21), recorded in
# docs/decisions/rme-billing-correction-owner-decisions.md:
#   D1e — only user 29 may SUBMIT; only user 1 may APPROVE (= apply, D1a) or
#         REJECT; every other account — other Front Office, other Super Admin,
#         every role — is refused, whatever its permissions say.
#
# Runtime changes:
#   - RmeInvoiceCorrectionPilotIdentity + config/rme_invoice_correction.php
#     `pilot.identities` (source-controlled, no env read, fail-closed: missing /
#     malformed / overlapping lists admit nobody; an empty role list stops that
#     role only; SUBMIT needs a designated checker). Asserted by the SERVICE under
#     the invoice row lock for submit / approve / reject / recovery apply, after
#     permission, branch scope, branch allowlist and self-decision. CANCEL of
#     one's own correction is deliberately NOT identity-gated (release path).
#   - The actor must be a persisted, non-deleted, ACTIVE account (re-read).
#   - Policy courtesy, controller 403 on the request form for non-designated
#     accounts, detail-page controls from actionsFor(), cashier panel can_request.
#   - Readiness probe reports PILOT_IDENTITIES and FAILs a pair outside them.
#   - RmePaymentService::assertInvoicePayable() judges the EXPLICIT cashier
#     (persisted, active), never Auth::user() — which failed OPEN with no session
#     because RmeWorkingBranchScope::branchIdsFor(null) answers every RME branch.
#
# No migration. No RoleSeeder change. No route change. Rule 197.
# Production: correction flag switched OFF before the code change (exposure:
# 8 Front Office accounts held request+approve in SPN4); it returns ON only
# after the deployed identity guard is verified on production.
#
# Type SECURITY_FIX: authorization hardening across RmeInvoice (correction +
# payment), audit level 3. security_impact true.

