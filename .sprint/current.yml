# WHAT THIS SPRINT FIXES
#   A. legacy-rme:wave-admin register could not express a planned window at all,
#      so a batch opened over SSH could never be time-bounded.
#   B. The migration-operations form never offered the two date fields, though
#      the FormRequest already validated them and the service already stored them.
#   C. separation_of_duties reported GO from two config booleans, without ever
#      checking that two distinct accounts could actually perform the duties.
#
# WHAT ROOT CAUSE C TURNED OUT TO BE
#   The briefed "Supervisor RME cannot approve" finding DOES NOT REPRODUCE on
#   production. User 11 holds approve_legacy_rme_migration_wave via the role and
#   can() returns YES. The observation was a measurement artifact, reproducible
#   two ways: a direct-only permission query sees 0 rows, and a policy probe
#   returns false against the terminal cancelled batch (and there are currently
#   no non-terminal batches at all). No RBAC repair was required or performed.
#
