# SECURITY-DOCTOR-WEBAUTHN-DEVICE-BOUND-FAIL-CLOSED-1 — two fail-open defects in
# the WebAuthn device-bound requirement, both reproduced on 3ae7a502 first:
#   1. config/webauthn.php read `(bool) env('WEBAUTHN_REQUIRE_DEVICE_BOUND', true)`,
#      so a blank value (or Laravel's empty/(empty)/null/(null)) turned the
#      requirement OFF; `(bool) config(...)` read a runtime null the same way.
#   2. Both login services gated on the STORED verdict only; the library reports
#      a signed BE change with an event and does not refuse (WebAuthn L3 §7.2).
# Fix: one parser + one reader in WebAuthnDeviceBinding, signed-flag check on
# both assertion paths, readiness reports provenance and --strict fails on a
# blank/unparseable value. No migration, no route, no permission, no flag, no
# enforcement-scope change. Production is unaffected in effect: the variable is
# absent there (default REQUIRED) and all 7 usable credentials are device-bound.
# Carried forward: LEGACY-RME-PROGRAM-CLOSURE-1 stays CLOSED and inherited.
