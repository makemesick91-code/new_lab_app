# THIS IS A TOOLING FIX AND A GOVERNANCE RECORD, NOT A PHASE ADVANCE.
#
# 1. The readiness gate was green for root and red for `daengtisiams`, the
#    identity that actually operates production. INFRA-SEC-RUNTIME-1 leaves the
#    deployed tree root-owned on purpose, so git refused it as foreign-owned and
#    two checks failed — one of them with a message that blamed the repository
#    ("gradlew is not tracked by git") for a refusal that never looked at it.
#
#    The refusal is answered, never disabled: an invocation-scoped
#    `-c safe.directory=<this repository>` and nothing else. No wildcard, no
#    persistent host entry, no ownership change, and every other git failure
#    still fails closed. Checks now carry a reason so an unreadable index and a
#    real finding stop looking identical.
#
# 2. The owner authorized a Phase 4A PILOT — drg Karmila, Cabang Sunu, rollback
#    owner Custodian 1 / Raushan Fikri Ridha / IT. GLOBAL enforcement stays
#    prohibited until Phase 5, and `may_be_enabled_in_phase` was split into a
#    pilot bound and a global bound so one number cannot be read two ways.
#
# AUTHORIZATION IS NOT ACTIVATION. After this revision:
# DEVICE_ENFORCEMENT_ACTIVE=false, DOCTOR_BROWSER_LOGIN_DENIED=false,
# enforcement.current_stage=off, the flag defaults false, no pilot target row
# exists, and no doctor — pilot or otherwise — is enforced.
#
# Signing custody stays PARTIAL: Custodian 1 established; Custodian 2, offsite
# backup, Custodian 3 and sealed-cold backup deferred by explicit owner
# decision. No production signing key was created and no certificate pinned.
