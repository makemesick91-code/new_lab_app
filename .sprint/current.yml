# MONITORING-LOG-SOURCE-RESILIENCE-1 — Sprint Manifest
#
# Removes Monitoring's dependency on a hardcoded `storage/logs/laravel.log`. That path is
# correct today only by coincidence — production resolves `stack -> [single] -> laravel.log`.
# The moment the configured channel becomes `daily`, or the stack gains a member, the
# application writes its errors elsewhere and the monitor keeps reading a file that has
# stopped moving, reporting OK for a system that is actively failing. The monitored sources
# are now derived from the effective Laravel logging configuration, rotation is covered
# across the whole lookback window, and anything unresolvable, missing or unreadable fails
# closed instead of being silently dropped from the total.

