# ── Residual that triggered this sprint ─────────────────────────────────────
# INFRA-SEC-ENV-1 removed world-read from the production secret file (0644 ->
# 0640 root:www-data) and explicitly did NOT claim same-UID isolation. This
# sprint closes that residual.
#
# Production finding (srv1730088):
#   DaengtisiaMS PHP-FPM pool : www  (uid 33 www-data)  <- distribution default
#   aish-pos PHP-FPM pool     : aish-pos (uid 33 www-data)
#   DaengtisiaMS queue worker : www-data
#   DaengtisiaMS snapshot unit: www-data
# Same uid => a file mode cannot stop the co-tenant reading this application's
# secret or its private clinical storage. World isolation PASS, application-to-
# application isolation NOT PROVIDED.
#
# Second, independent defect found in the same area:
#   scripts/deploy-vps.sh resolved its runtime user with
#     grep -r '^user =' /etc/php/*/fpm/pool.d/ | head -1
#   plus a process-table guess and a hardcoded www-data default. That only ever
#   looked correct because every pool on the host ran as www-data; the moment
#   DaengtisiaMS gained a dedicated pool the walk order decided the answer, so
#   the deploy could have chowned this application's runtime to the CO-TENANT's
#   identity. Replaced by deploy/runtime-identity.conf, fail closed, no fallback.
#
# INFRA-SEC-ENV-1 remains CLOSED / IMMUTABLE / GO. Its invariants are preserved
# and re-asserted here, including across a rollback: the rollback path now
# follows the dedicated runtime group and can never restore a world-readable
# secret or hand secret read back to the shared account.
