# The Phase 4A doctor-device pilot is ARMED in production and its sprint is
# frozen mid-flight (PR #392 open, unmerged, no GO tag). This sprint is built on
# the PWA foundation GO commit, which is exactly what production runs.
#
# THE RELATIONSHIP BETWEEN THE TWO IS THE POINT, AND IT IS NOT A CONFLICT.
#
# The armed pilot denies drg Karmila's BROWSER because a browser had no way to
# write a device binding. This sprint gives a browser that way — cryptographic,
# server-verified, and only on an approved device with an active authorization.
# It therefore does not weaken the armed enforcement; it is the mechanism by
# which the same armed enforcement can admit a verified browser.
#
# It still admits nobody on deploy: the new flag is OFF, and even switched on it
# can only admit an account that already holds a registered credential on an
# ACTIVE device with an ACTIVE authorization. Production holds zero such
# credentials.
inherits_armed_pilot: PHASE4A-DOCTOR-ANDROID-PILOT-ACTIVATION-1 (frozen, armed, unmerged)

# No go_tag. A GO tag for THIS sprint additionally requires a ceremony on the
# real pilot tablet — registration, approval, assertion and a scoped login —
# because a WebAuthn device restriction cannot be proved by a simulated
# authenticator. Automated tests use a real software authenticator and real
# cryptography, which is necessary and not sufficient.
