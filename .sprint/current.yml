# BUGFIX-NEW-VISIT-PATIENT-SEARCH-RUNTIME-1 — Sprint Manifest
#
# Prompt classification: BUGFIX · PRODUCTION_REGRESSION · NEW_VISIT ·
# PATIENT_SEARCH · RUNTIME_INTEGRATION · BRANCH_SECURITY_SENSITIVE ·
# PRIVACY_SENSITIVE. `type` below is RUNTIME_FIX because that is the registered
# profile in config/sprint_profiles.php that matches a production runtime
# regression; PRODUCTION_REGRESSION is not a defined type and inventing one
# would fail the manifest check rather than describe the work.
#
# WHAT BROKE. Every patient search on "Kunjungan Baru" returned HTTP 500 in
# production. The operator saw only "Gagal mencari pasien. Silakan coba lagi.",
# which is the frontend's generic transport-failure state — so a total outage of
# the patient-selection step looked, to the person using it, exactly like a
# system that simply would not cooperate.
#
# THE ROOT CAUSE, EXACTLY. The search carried its LIKE escape character as a
# backslash:
#
#     LOWER(name) LIKE LOWER(?) ESCAPE '\'
#
# That is valid SQL, and both PostgreSQL and SQLite accept it. But PDO has to
# rewrite `?` into `$n` before pdo_pgsql can send a statement, and up to and
# including PHP 8.3 its parser treats a backslash inside a single-quoted literal
# as escaping the closing quote. The literal then never terminates where SQL
# says it does, it swallows the placeholders that follow, and PDO sees fewer `?`
# than the bindings Laravel passes:
#
#     SQLSTATE[HY093]: Invalid parameter number: parameter was not defined
#
# WHY EVERY TEST WAS GREEN. Two independent blind spots had to line up, and they
# did:
#
#   1. DRIVER. pdo_sqlite accepts positional `?` natively, so PDO never runs the
#      rewriting parser and the malformed literal is never tokenised. The suite
#      runs SQLite by default. The fault is invisible there — not "untested",
#      genuinely absent.
#
#   2. SELECTION. The combobox suite already covered branch scope, IDOR,
#      privacy, bounds and wildcards — and matched NO token in either critical
#      gate filter. The gate runs PostgreSQL 16 on PHP 8.3, which is the ONE
#      combination that fails, and it was never pointed at this code. The
#      coverage existed; nothing required it.
#
#   (A third, quieter trap sits underneath: the production VPS default CLI is
#   PHP 8.5.8, but the application is served by the php8.3-fpm `daengtisiams`
#   pool. Reproducing from the VPS command line would also have passed.)
#
# THE FIX. The LIKE escape character is now a private class constant that is not
# a backslash, so no string literal in the statement can end on one. Semantics
# are unchanged on both drivers: the explicit ESCAPE clause stays, and the
# escaping helper reads the same constant so the two cannot drift.
#
# THE SECOND FIX, WHICH MATTERS AS MUCH. Both patient-search suites are now
# declared in config/ci_runner.php `critical_gate_mandatory_suites` and selected
# by a token in BOTH critical gate variants. A control that exists but is never
# selected is not a control — the same reasoning the storage-privacy entry above
# it records.
#
# AND A GUARD THAT DOES NOT DEPEND ON EITHER. The new suite reproduces PDO's own
# tokenising rule in PHP and asserts the statement's placeholder count matches
# its binding count. That fails on SQLite and on PHP 8.5 too, so this defect
# class can never again hide behind whichever database the suite is pointed at.
#
# WHAT IS DELIBERATELY NOT CHANGED. No migration, no schema, no permission, no
# policy, no route, no route rename. No authorization was relaxed to make search
# work: branch scope still comes from RmeWorkingBranchScope, the endpoint still
# accepts no branch_id, the daily branch context still owns mid-day moves, and
# patient_id is still re-authorized at submit time. The response still carries
# exactly four identity fields. The frontend is untouched — it was correct, and
# rendering the error state for a real HTTP 500 is what it is supposed to do.
#
# RECORDED, NOT FIXED HERE (out of scope by the sprint's own rule):
#   - ClinicVisitController::patientVisitOptions lacks a branch check.
#   - The dental Lab Order form still exposes phone through the retired
#     x-patient-search-select component.
#   - CrossBranchPatientLookupService and LegacyRmePatientResolutionAuditService
#     escape LIKE with a backslash but emit NO ESCAPE clause, so they cannot hit
#     this fault; on SQLite their escaping is a no-op, which is a latent
#     semantic difference, not a runtime error.

