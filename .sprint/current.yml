# THIS IS A CAPABILITY REVISION, NOT A PHASE ADVANCE.
#
# The complete doctor trusted-device lock now exists: automatic PENDING requests
# from a cryptographically proven device, the approval inbox, the app-only login
# gate and per-request session/device binding. All of it is behind
# `doctor.trusted_device_enforcement`, which defaults to FALSE and stays false in
# production.
#
# So after this revision: DEVICE_ENFORCEMENT_ACTIVE=false and
# DOCTOR_BROWSER_LOGIN_DENIED=false. Doctors keep logging in exactly as they do
# today, and an empty authorization table locks nobody out.
#
# The full feature stays NO-GO. Real-device validation has NOT been performed,
# no production signing key has been provisioned, Phase 4 has NOT started, and
# the full-feature GO tag `feature-doctor-trusted-android-device-lock-1-go` must
# NOT be created.
#
# Google Play, Managed Google Play and Play App Signing remain unused (ADR 0010).
# Phase 1 room isolation, RME/odontogram print denial, Phase 2 device lifecycle
# and Phase 3 cryptographic identity are all preserved.
#
# ONE PRIOR CONTRACT IS DELIBERATELY NARROWED, WITH ITS OWN REVIEW: Phase 2/3
# asserted that NO authentication surface may reference the device registry, and
# said in its own comment that "Phase 4 is where that changes, deliberately and
# with its own review". An app-only gate cannot exist under that rule. The rule
# is therefore narrowed — not dropped — to "the auth path may consult exactly ONE
# gate, by name", and the enforcement-OFF behaviour is pinned by its own suite.
