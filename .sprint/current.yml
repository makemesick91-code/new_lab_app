# FIX-LAB-ANALYTICS-MEDIAN-LATENESS-DAY-BOUNDARY-1 — Sprint Manifest
#
# WHAT THIS SPRINT IS. The corrective sprint for a pre-existing time-of-day test
# determinism defect in the Lab operational analytics suite:
#
#   tests/Feature/LabWorkflow/LabOperationalAnalyticsMetricTest.php
#   'due_date' => now()->subDays(2)->toDateString()   // day granularity
#   opLog($late, DELIVERED, now());                   // instant granularity
#   expect($sla['median_lateness_days'])->toBeGreaterThan(1.0);
#
# The runtime measures lateness as an ELAPSED duration from the END of the due
# day. The fixture pinned the deadline to a calendar date but the delivery to the
# live wall clock, so the same three records were 1.00 days late just after
# midnight and 2.00 days late just before it. Against a `> 1.0` assertion the
# result was decided by what time the runner happened to start.
#
# WINDOW REPRODUCED, NOT ESTIMATED. Pinned by binary search under a controlled
# clock — never by waiting for real midnight: the assertion fails throughout
# [00:00:00, 00:07:11] and passes from 00:07:12 in the application timezone.
# 00:07:11 -> 1.0 (FAIL), 00:07:12 -> 1.01 (PASS). That is 7m12s of every day,
# ~0.5% of runs, and it contains the reported CI failure instant 00:02:59Z.
#
# TIME AUTHORITY ESTABLISHED FROM CODE, NOT FROM CI's CLOCK. Lab operational
# analytics has no domain clock: resolvePeriod() uses today() and slaCompliance()
# uses Carbon::parse(...)->endOfDay(), both of which resolve in the application
# timezone, which config/app.php hardcodes to UTC. ClinicalClock (Asia/Makassar)
# is the CLINICAL-date authority and was deliberately NOT borrowed — nothing in
# this module's dates is clinical. A boundary case at 16:00Z (Asia/Makassar
# midnight) pins that decision behaviourally.
#
# THE FALSE FIX WAS REJECTED. Changing `> 1.0` to `>= 1.0` would have gone green
# without touching the defect. Proven false, not merely asserted: with the
# runtime mutated to return a mean instead of a median, the weakened assertion
# passes 12/12 while the new boundary suite fails 10/14. The repaired assertion
# is exact (2.0) because the fixture establishes the value arithmetically.
#
# RUNTIME WAS NOT CHANGED, AND THAT IS THE FINDING. The metric is deterministic
# given its inputs; only the inputs were not. Zero app/ changes.
#
# SIBLING OF THE SAME CLASS, FIXED. The QC first-pass test placed its first
# attempt 10 minutes before a live `now()` inside a calendar-month window, so
# during the first 10 minutes of every 1st the failed attempt fell out of period
# and the test silently became a 2/2 first-pass assertion. Same causal defect,
# one-line blast radius, fixed here. Reproduced at 2026-06-01 00:05:00.
#
# SIBLINGS AUDITED AND CLEARED. throughput, external turnaround and technician
# KPI move both endpoints together or are not period-filtered on the moving
# column, so they are duration-stable. Classified, not assumed.
#
# TEMPFILE SIBLING LEAKS (ffcache-, ctl3a-, lrme-poppler-, leg/bad) are NOT in
# scope; they remain the FIX-TEST-TEMPFILE-SIBLING-LEAKS-1 backlog.
#
# FULL SUITE. Not authorised for this sprint. The previous authorisation was
# consumed by run 32700184849 and it FAILED. FULL_SUITE_EXECUTION_COUNT=0.
# Targeted reproduction only. This sprint may carry its own GO tag; it does NOT
# close the stabilization programme.

