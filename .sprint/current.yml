# FIX-LEGACY-ODONTOGRAM-CROSS-BRANCH-READ-SCOPE-1
#
# UPLOAD AUTHORITY != GLOBAL READ AUTHORITY.
#
# LegacyOdontogramWorkspaceScope::GOVERNANCE_PERMISSIONS contained
# `create_legacy_odontogram_imports`. Every branch intake operator (Admin Klinik,
# Front Office) holds it, so each resolved to the WHOLE RME branch set and could
# list, open and stream every branch's published odontogram archive — through the
# record viewer, its private bytes, the staging-import viewer, the patient history
# and the unified medical-record index, because all of them consume that one scope.
#
# FIX: one membership change. The set is now review/publish/void — exact parity
# with LegacyRmeWorkspaceScope — so every door narrows together and list and
# viewer cannot disagree. Intake is pinned too, which the binding service always
# documented; on the pilot no branch-scoped operator had ever filed a foreign
# chart, so no real upload changed.
#
# Not changed: review, publish, batch review/publish, VOID, mass upload, date
# rules, patient binding, single-active-document, wave admission, quota, SOD.
# Doctor scope unchanged (practice branch + treating relationship; soft-deleted
# visits excluded). No migration, no permission, no route, no clinical data.

