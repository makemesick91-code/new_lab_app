# FIX-TEST-TEMPFILE-SIBLING-LEAKS-1 — Sprint Manifest
#
# WHAT THIS SPRINT IS. The corrective sprint for the temporary-artifact leaks
# FIX-PDF-TEMPFILE-LEAK-1 measured and deliberately left in place. That sprint
# fixed the one call site every PDF assertion routes through and recorded the
# rest as a follow-up candidate. This closes them.
#
# THE SURFACE WAS LARGER THAN RECORDED. The handover listed four prefixes and
# ~188 orphans. Re-measured on this base authority, ten prefixes across eight
# test files held 392, and SIX of those call sites had no cleanup on any path at
# all — not a missed `finally`, no cleanup written:
#
#   ffcache            79   tempnam(...).'.php'   allocation orphaned
#   lrme-poppler-      20   tempnam(...).'.pdf'   allocation orphaned
#   leg                12   tempnam(...).'.csv'   BOTH artifacts orphaned
#   bad                 0   same shape as leg     (leaks; /tmp had been reaped)
#   ctl3a-home-        51   mkdir, never removed
#   ctl3a-bin-         36   mkdir, never removed
#   ctl3d-bin-         11   mkdir, never removed   <- not in the handover
#   ctl3c-             40   mkdir, never removed   <- not in the handover
#   rdrs1-            124   mkdir, never removed   <- not in the handover
#   ci-bare-host-      16   mkdir, never removed   <- not in the handover
#   infra-sec-env-1-    3   cleaned on the passing path only
#
# BASELINE LEAK REPRODUCED, NOT INFERRED. Five suites run at the base authority
# baecf7c produced 131 fresh orphans in a single pass while all 98 tests PASSED.
# That is the measurement the fix is judged against — not the standing /tmp
# census, which is contaminated by every earlier run on this machine.
#
# TWO LIFECYCLES, TWO OWNERS. Where an artifact is created, used and destroyed
# inside one call, a `finally` is the whole contract and `pdfWithTempFile`
# remains the pattern; ffcache and lrme-poppler needed only the single-artifact
# correction. Where it must OUTLIVE its creator — a stub PATH a child process
# still has to read, an UploadedFile whose request has not run — no `finally`
# can reach it, and the registry behind tempArtifactFile()/tempArtifactDir() is
# the owner. That registry deletes exactly what it recorded: never a glob, so a
# concurrent test process and the historical orphans are safe by construction.
#
# HISTORICAL ORPHANS PRESERVED. The 447-artifact baseline is identical before
# and after. HISTORICAL_ORPHANS_DELETED_BY_SPRINT=0. Correctness is proven by a
# zero task-created delta, not by making the census look clean.
#
# TWO DEFECTS IN THE GUARD ITSELF, FOUND BY MUTATION. The symlink test used a
# link to a FILE, where `unlink()` is safe regardless — it passed with the
# guard removed. The catastrophic shape is a link to a DIRECTORY, which
# `is_dir()` follows. And the confinement test failed by DELETING composer.json.
# Both repaired; a guard whose failure mode is damage is not a guard.
#
# FULL SUITE. Not authorised. The previous authorisation was consumed by run
# 32700184849 and it FAILED. FULL_SUITE_EXECUTION_COUNT=0. This sprint may carry
# its own GO tag; it does NOT close the stabilization programme.

