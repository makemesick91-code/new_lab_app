# FIX-LEGACY-WAVE4-WINDOW-EXTENSION-1
#
# A migration batch's approved window was immutable once registered.
#
# ROOT CAUSE — measured against the deployed tree, not inferred. WAVE-4's
# approval window ran 2026-08-28 -> 2026-09-30. On 2026-10-04,
# `legacy-rme:ops-readiness` reported:
#
#   WATCH  batch_window  The batch is past its planned end date.
#   -> Close the batch out, or record a fresh approval extending it.
#      Do not keep migrating against a lapsed window.
#
# The remediation it printed was impossible to carry out. `planned_end_date` had
# exactly one writer in the whole codebase — `createWave()`, which `create()`s
# against a UNIQUE `code`. There was no window setter on
# LegacyRmeWaveGovernanceService, no `extend` CLI action, and no HTTP route.
# Verified across all three surfaces, not assumed.
#
# So the only route the design offered was cancel-and-re-register under a new
# code, which discards the batch's branch enrollments and operator assignments —
# a destructive answer to an administrative question, and one the owner
# explicitly ruled out ("DO NOT CLOSE IT. WAVE-4 remains ACTIVE").
#
# This is the same shape as the already-documented gap for the wave-level quota.
# The capability is built once, canonically, rather than repaired by hand each
# time a window lapses.
#
# EXTEND MEANS EXTEND. A new end date earlier than the current one is refused:
# shortening retroactively de-approves work already accepted inside the window,
# and the lifecycle already has honest verbs for stopping early (`drain`,
# `complete`, `cancel`). A null end date is refused too — an approval that never
# expires is one nobody revisits, which is why the window exists at all.
#
# AUTHORIZATION IS THE APPROVER'S, NOT THE MANAGER'S. `extend` is gated on the
# `approve` ability alongside `approve` itself, not on `update`. Lengthening an
# approval window IS an approval act, and gating it on `update` would let
# whoever runs the rollout quietly grant their own batch more time. That is the
# separation the maker/checker split exists to protect, so the new action joins
# the stricter side of it.
#
# The START date is read back off the locked row and never taken from the
# caller. Status, quota (both levels), approval reference, approved branch set,
# branch enrollments and operator assignments are all asserted untouched.
#
# WRITES ONE COLUMN, UNDER A LOCK. DB::transaction + lockForUpdate, with the
# terminal-status check and the current end date BOTH re-read inside the lock —
# so two operators racing cannot extend from the same stale value. A dedicated
# WAVE_WINDOW_EXTENDED audit event carries actor, wave, status, start, and the
# end date BEFORE and AFTER, plus a bounded reason. Before-and-after is the half
# that makes the decision reviewable; "extended to the 31st" alone is not an
# auditable fact.
#
# NO migration. NO permission, role, route or schema change. No clinical
# behaviour, no publish/review/VOID path, no branch isolation, no ledger, no
# single-active-document rule, no patient/RM binding, no date rule, no quota or
# batch-size policy.

