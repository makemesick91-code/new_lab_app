notes: |
  STATE AT THIS CHECKPOINT: NON-DISRUPTIVE WORK COMPLETE, PILOT ARMED, NOT
  GO-TAGGED. The disruptive half of the F-matrix is deliberately unfinished.

  WHAT IS TRUE IN PRODUCTION NOW.

  drg Karmila (users.id 18) at Cabang Sunu (SPN4, branch 5) on
  PHASE4A_PILOT_TABLET_01 (device 1, active, cryptographically_verified) with an
  ACTIVE doctor-device authorization. Pilot enforcement is ARMED. Global
  enforcement is false and is not reachable from a host. She works through the
  app on a device-bound session; her browser is denied and every other doctor's
  is not.

  THE BOUNDARY, MEASURED.

  F7 and F8 together: covered=[18], denied=1, allowed=14, total=15, global=false,
  verdict GO. F4 was proven unsimulated — arming invalidated her pre-existing
  unbound web session on its next protected request, recorded twice as
  DOCTOR_SESSION_DEVICE_INVALIDATED with a reason. F1 was proven end to end:
  challenge 200, login 200, challenge consumed, one real ticket minted and
  redeemed exactly once, device-bound session, branch SPN4, room SPN-A.

  WHAT THE LIVE RUN EXPOSED, AND WHAT WAS FIXED.

  1. The first device on ANY deployment was unapprovable. Approval could only
     bind to a device that already existed, and the registry is empty on a clean
     deployment. `approveIntoNewDevice()` adds the branch the service docblock
     had described and nobody implemented: the row is created with NO key
     material and `approve()` remains the sole binder.

  2. A fully successful login ended on a 404 at `/device-login/null`. With
     enforcement off no ticket is minted and the response carried
     `"login_ticket": null`; Android's `optString` returns the literal string
     `"null"` for a JSON null and its `""` fallback only for an ABSENT key, so
     the shipped client read a four-character ticket and took the branch
     reserved for holding one. The server now omits the key. This defeated a
     fail-closed property, which is why it is a security fix and not a cosmetic
     one.

  3. Arming produced no audit row. It was a host file edit plus a cache rebuild,
     so no application code ran. Renaming a device LABEL produced a full
     before/after with a named actor; denying a clinician her browser produced
     nothing. `android:phase4a-pilot-enforcement` now owns the change, refuses
     every scope that would make it a fleet lockout or a silent no-op, verifies
     in a fresh process because the writing process holds stale config, rolls
     back when that verification is not GO, and writes
     PILOT_ENFORCEMENT_SCOPE_CHANGED.

  4. The REPL prohibition had no reach over a keyboard. The existing scanner
     covers eleven tracked scripts and works; both invocations during this
     sprint were typed into interactive SSH and were in no file. A guard now
     refuses the command at CommandStarting, whoever types it. Its first version
     passed every event-level test while blocking nothing, and only running the
     real binary showed it — the suite now runs the real binary.

  PROCESS DEVIATIONS, RECORDED NOT HIDDEN.

  `php artisan tinker --version` was executed against production twice by me,
  after the prohibition was acknowledged. Nil observed runtime impact:
  laravel.log mtime remained 2026-09-04 with zero entries dated 2026-09-07.
  Symfony answers `--version` before any command resolves, so it starts no REPL
  and the new guard does not block that form either — stated as a limit, not
  claimed as coverage.

  STILL OWED, AND DELIBERATELY NOT DONE.

  The rejection, disable, revoke and governed-recovery tests interrupt a working
  clinician and require an explicit safe clinical window. No GO tag, no final
  freeze, no final merge. `BUGFIX-ANDROID-LOGIN-NULL-PARSING-ERROR-MAPPING-1` is
  booked and not started: the shipped APK still mis-parses nullable JSON and
  still reports validation failures and wrong passwords as "cannot contact
  server".
