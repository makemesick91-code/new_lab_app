# THIS IS A CUSTODY DESIGNATION, NOT A KEY.
#
# The signing policy — three copies, encrypted, one offsite, one sealed cold —
# has been recorded since Phase 3.5. What did not exist was anyone named to
# hold them. EVIDENCE-PHASE4A-REAL-DEVICE-KEYINFO-PREFLIGHT-1 correctly
# recorded custody as PARTIAL, with Custodian 2, Custodian 3, the offsite copy
# and the sealed-cold copy all deferred by explicit owner decision. That record
# was true when written and is SUPERSEDED FORWARD, never rewritten.
#
# The owner has now designated three destinations:
#   Custodian 1 — primary signing authority. Primary IT workstation, Ubuntu,
#                 Cabang Pusat, Raushan Fikri Ridha / IT. Disk encryption,
#                 login password and screen lock active. The ONLY host on which
#                 the first production key may be generated.
#   Custodian 2 — encrypted backup destination. Admin Klinik workstation,
#                 Windows, Klinik Daengtisia. Disk encryption, login password
#                 and screen lock active. Access limited to IT + Admin Klinik.
#   Custodian 3 — encrypted backup, sealed-cold AND offsite destination. USB,
#                 Kantor Management Klinik, IT. Encrypted container only;
#                 unrelated existing data on the medium is NOT wiped; the
#                 passphrase never travels on the same medium; offline except
#                 during an approved operation.
#
# READY IS NOT CREATED, AND THAT IS THE WHOLE POINT.
#
# Still false after this record, and asserted as false by the scanner:
# production signing key provisioning, backup copy 1 created, backup copy 2
# created, sealed-cold backup created, offsite backup created, recovery
# verified, certificate pinning (production_certificate_sha256 stays null),
# production APK build or installation, production enrolment, pilot enforcement
# activation, global enforcement activation. `custody_state_machine_consistent`
# FAILS if any of those is claimed ahead of what it depends on, so the config
# cannot quietly drift into announcing backups that do not exist.
#
# DEVICE_ENFORCEMENT_ACTIVE=false, DOCTOR_BROWSER_LOGIN_DENIED=false,
# enforcement.current_stage=off. No doctor — pilot or otherwise — is enforced.
# drg Karmila at Cabang Sunu is unaffected.
#
# TWO EXCEPTIONS ARE RECORDED RATHER THAN SMOOTHED OVER. IT is responsible for
# Custodian 1 and Custodian 3 and holds access to Custodian 2, so one party can
# reach every copy — "three custodians" in the governance table meant three
# independent holders, and three media under one party is a weaker claim.
# Custodian 3 also carries both the sealed-cold and the offsite property, which
# the table had expected on separate holders. Both are owner-accepted residual
# risks with compensating controls, and a second independent human custodian is
# an open item before the `operational` state.
#
# NO KEY WAS GENERATED BY THIS SPRINT. No keytool, no openssl signing identity,
# no placeholder, no "temporary production key". No backup artifact was written
# to any medium. The tablet was not touched and ADB was not started.
#
# The next task is a SEPARATE authorised one —
# PRODUCTION-ANDROID-SIGNING-KEY-PROVISIONING-1 — and it may not skip the
# backup and recovery stages before production rollout.
#
# Phase 4 and the first Phase 4A attempt remain BLOCKED / NO-GO and are not
# rewritten. Neither
# `feature-doctor-trusted-android-device-lock-1-phase-4a-app-only-real-device-pilot-go`
# nor the full-feature `feature-doctor-trusted-android-device-lock-1-go` may be
# created from this record.
#
