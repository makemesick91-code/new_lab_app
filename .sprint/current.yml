# REVISION-RME-REPORTS-TODAY-DEFAULT-1 — Sprint Manifest
#
# Prompt classification: FEATURE_REVISION · RME_REPORTING · DEFAULT_SCOPE ·
# BRANCH_SECURITY_REGRESSION_SENSITIVE. `type` below is MODULE_SPRINT because
# that is the closest registered profile in config/sprint_profiles.php —
# FEATURE_REVISION is not a defined type and inventing one would fail the
# manifest check rather than describe the work.
#
# WHAT THIS SPRINT IS. Laporan Pasien RME and Laporan Pembayaran RME now default
# to the CLINICAL today. Historical rows appear only when the operator supplies
# an explicit date filter.
#
# WHY IT IS NOT COSMETIC. Both reports applied their date predicate only when a
# filter was present, so a bare report URL returned every visit and every payment
# the branch had ever recorded — and the CSV export and print view share those
# query builders, so one click on Export from a freshly opened report produced a
# full historical extract. Bounding the default is a data-minimisation change,
# not a layout change.
#
# WHY IT IS BRANCH-SECURITY-SENSITIVE. The change edits the two report query
# builders that also carry the FIX-04/FIX-09 branch predicate. Nothing about
# branch authority changed — RmeWorkingBranchScope is still the only authority
# and a request branch_id is still only ever narrowing — but a regression here
# would be a cross-branch data leak, so the branch matrix is re-proven rather
# than assumed. A date filter widens the PERIOD, never the branch scope.
#
# WHAT IS DELIBERATELY NOT CHANGED. No schema, route, permission or policy. No
# registration, queue, room, consent, RME/odontogram, visit-completion, invoice
# or payment write behaviour. The payment report's canonical date stays
# trx_clinic_visits.visit_date — it already resolved through clinicVisit, so the
# date SEMANTICS are untouched and only the DEFAULT changed.

id: REVISION-RME-REPORTS-TODAY-DEFAULT-1
type: MODULE_SPRINT
module: RmeInvoice
title: 'RME patient and payment reports default to the clinical today; history is opt-in'
base_branch: feature/sprint-26-phase-26-8-stabilization-closure-go-watch-no-go-report

# Impact flags — MUST match reality.
runtime_change: true            # both report query builders + the filter/summary payloads
schema_change: false            # no migration, no column, no table
frontend_change: false          # Blade only; no JS/CSS/Vite/package asset changed
security_impact: true           # removes an unbounded historical extract from the default path
branch_isolation_impact: true   # not CHANGED, but regression-sensitive: the edited queries carry the branch predicate
ledger_impact: false
deploy_required: true           # the bounded default only exists in production once deployed
browser_required: false         # HTTP-level assertions cover screen, CSV and print
test_profiles:
  - focused
  - permission_regression
go_tag: revision-rme-reports-today-default-1-go

# Carried forward from the manifests this sprint inherits. Not boilerplate:
# dropping either makes the LegacyRme closure contract fail.
inherits_closure: LEGACY-RME-PROGRAM-CLOSURE-1
inherits_hold: FIX-CLINIC-OPS-BRANCH-CONTEXT-WA-1/FIX-02
