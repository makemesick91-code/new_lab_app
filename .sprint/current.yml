# DAENGTISIAMS-SUNU-FINAL-RELEASE-CANDIDATE-1
#
# The final pre-go-live integration for Cabang Sunu (SPN4). Twelve items, D1-D12,
# built after the owner postponed the dated go-live in favour of doing the whole
# candidate properly and running ONE authoritative Full Suite at the end.
#
# Five of the twelve framings were corrected by measurement before any code was
# written — D3 and D4 were already implemented, D6's ghost command had no caller
# at all, and D12's sidebar coverage was already complete. Those items are
# recorded as complete-with-no-code-change rather than padded with work.
#
# It arms no flag, widens no enforcement scope, retires nothing, starts no stage,
# and mutates no production state. The Front Office migration is governed,
# dry-run by default, and has NOT been applied.
#
#   D1  logging a doctor out releases their session lease        (committed 8cf9471a)
#   D2  Admin Klinik + Kasir merge into Front Office
#   D3  registration date defaults to the clinical day           (committed 33d93b83)
#   D4  adversarial tests; the second gate already existed       (no new runtime)
#   D5  confirm the branch before the clinical day locks to it
#   D6  ghost command investigated: NO CALLER, NO CODE CHANGE
#   D7  WebAuthn readiness fails closed by default               (committed 33d93b83)
#   D8  WebAuthn login stamps the authorization it used          (committed 33d93b83)
#   D9  middleware governance test made non-vacuous              (committed 33d93b83)
#   D10 pilot cohort ceiling raised to carry one branch, not the fleet
#   D11 delegated device registration, trust decision unmoved
#   D12 sidebar coverage turned into a mutation-proven guarantee

