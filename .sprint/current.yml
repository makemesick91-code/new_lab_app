# RESTORE-DRILL-TIMESTAMP-FAITHFULNESS-1 — Sprint Manifest
#
# Closes the residual that ROLL-5-1A left in RestoreDrillEvidenceService::ageHours():
# a permissive strtotime() timestamp authority. The residual was audited and
# reproduced before it was fixed — the objective was never "replace strtotime()
# because it looks old".
#
# Three defects compounded into one false green. (1) `max(0.0, …)` clamped a
# negative age to zero, so ANY future instant reported as the freshest value
# representable. (2) strtotime() normalises invalid calendar dates in BOTH
# directions, rolls out-of-range fields over, ignores trailing junk, and executes
# relative modifiers — so "2025-01-01T00:00:00Z +2 years", a genuinely 20-month-old
# drill, resolved into the future and via (1) became maximally fresh. (3) when
# parsing failed the age fell back to filemtime(), so a malformed evidence file
# written today read as a drill run today.
#
# 13 literals that are not valid evidence produced GO. The age decides `stale`,
# which decides the restore_drill_evidence signal, which feeds ROLL-5 stage
# clearance — a decision defect, not a display defect. Reproduced end to end, and
# 28 of 56 new tests fail when the fix is reverted.
#
# Evidence timestamps now parse format-exactly against the one form the producer
# writes (date -u +%Y-%m-%dT%H:%M:%SZ) and must round-trip byte-for-byte. Three
# states are explicitly unageable — missing, unparseable, future — each yielding a
# null age plus its own issue that forces WATCH, because a null age is not "stale"
# and would otherwise fall through into GO. Every legitimate canonical literal keeps
# its exact age and verdict; production holds no restore-drill evidence at all, so
# nothing historical is invalidated.

