type: SECURITY_FIX
module: Deploy
title: "Production secret file permission hardening — remove world-read from the production environment file and enforce it on every deploy, fail-closed"
base_branch: feature/sprint-26-phase-26-8-stabilization-closure-go-watch-no-go-report

runtime_change: false           # no application code path changes; deploy automation only
schema_change: false            # no migration, no table, no column
