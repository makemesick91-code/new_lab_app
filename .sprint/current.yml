# ACTIVATION-RME-INVOICE-CORRECTION-PREPAYMENT-2
#
# Activation of the pre-payment RME invoice correction under owner decisions
# recorded 2026-10-21 (docs/decisions/rme-billing-correction-owner-decisions.md):
#   D1a — the CHECKER applies, automatically at approval (one transaction);
#   D1b — Front Office holds request AND approve (the merged role is the exact
#         union of Admin Klinik + Kasir; maker != checker stays per account);
#   D1c — pilot scope SPN4 only, server-side, source-controlled, fail-closed;
#   D1d — pilot accounts maker 29 (Admin Sunu), checker 1 (IT Support).
# D21c (discount policy) and D21g (Rp0) stay PENDING — classified
# SAFE_TO_DEFER_WITH_EXPLICIT_RESTRICTION, never approved.
#
# Runtime changes:
#   - RmeInvoiceCorrectionService::approve() approves AND applies atomically;
#     apply() is the recovery path for a pre-D1a APPROVED row and refuses the
#     maker (SELF_APPLICATION_FORBIDDEN), Super Admin included;
#   - RmeInvoiceCorrectionPilotScope + config/rme_invoice_correction.php
#     (['SPN4'], no env read): submit/approve/apply refused outside the pilot
#     (BRANCH_NOT_IN_PILOT, audited); reject/cancel are not gated;
#   - RoleSeeder: Kasir request, Admin Klinik approve, Front Office both;
#     no operational role holds apply;
#   - money display never rounds stored cents (RmeInvoiceDocument::rupiah,
#     OversightFormat::rupiahCents); correction qty bound == invoice qty bound;
#     a price-unchanged CHANGE line keeps its price provenance;
#   - read-only production authorization probe rme:invoice-correction-readiness.
#
# No migration. The flag stays OFF by default; activation (RoleSeeder on the
# host, env flag ON, config cache as daengtisiams) is the ceremony after deploy.
# Rule 195.
#
# Type FOUNDATION_SPRINT: financial capability activation across RmeInvoice +
# RBAC + cashier UI + oversight formatting; audit level 3. security_impact true.

