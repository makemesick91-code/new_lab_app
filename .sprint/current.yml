# THIS IS AN EVIDENCE RECORD, NOT A PHASE ADVANCE.
#
# The Phase 4A pilot rested on a claim nobody had measured: that the device
# identity key lives in secure hardware and cannot be exported. Phases 1-3.5
# assumed it. The Phase 3 instrumentation suite proves the enrolment PROTOCOL,
# and every one of its assertions would also pass against a software-backed key.
#
# The trap being closed is reading a DEVICE CAPABILITY FLAG as proof.
# `android.hardware.hardware_keystore` describes the platform, not the key: a
# keystore can issue a particular key in software while the flag reads exactly
# the same. The authoritative answer is `KeyInfo.getSecurityLevel()` on the key
# the app actually generated. Accepted: TRUSTED_ENVIRONMENT, STRONGBOX.
# Rejected: SOFTWARE, UNKNOWN_SECURE.
#
# Measured on PHASE4A_PILOT_TABLET_01 (SM-X236B, Android 16 / API 36, verified
# boot green, bootloader and vbmeta locked, physical device): existing suite
# 7/7 PASS, temporary KeyInfo probe 1/1 PASS reporting
# securityLevel=TRUSTED_ENVIRONMENT and privateKeyExportable=false. StrongBox is
# absent and that is NOT a failure — it is preferred, never mandated.
#
# THE TABLET WAS NOT TOUCHED BY THIS SPRINT. The measurements already existed;
# this makes them durable, machine-checked and hard to misread. The temporary
# probe was NOT committed, and the production alias
# `daengtisiams_device_identity_v1` was never generated.
#
# A PREFLIGHT PASS ACTIVATES NOTHING. Still false after this record:
# signing custody completion (PARTIAL — Custodian 2, offsite backup, Custodian 3
# and sealed-cold backup deferred by explicit owner decision), production
# signing key provisioning, certificate pinning (production_certificate_sha256
# stays null), production APK build or installation, production enrolment,
# pilot enforcement activation, global enforcement activation.
# DEVICE_ENFORCEMENT_ACTIVE=false, DOCTOR_BROWSER_LOGIN_DENIED=false,
# enforcement.current_stage=off, the flag defaults false, and no doctor —
# pilot or otherwise — is enforced.
#
# ANDROID_REAL_DEVICE_VALIDATION stays false. It is a different, wider gate
# (signed release installed, device enrolled, pilot run) and conflating it with
# the hardware preflight is the specific misreading this record refuses.
#
# Phase 4 and the first Phase 4A attempt remain BLOCKED / NO-GO and are not
# rewritten. Neither
# `feature-doctor-trusted-android-device-lock-1-phase-4a-app-only-real-device-pilot-go`
# nor the full-feature `feature-doctor-trusted-android-device-lock-1-go` may be
# created from this record.
#
# Google Play, Managed Google Play and Play App Signing remain unused (ADR 0010).
# Device Owner and kiosk remain Phase 4B. Phase 1 room isolation, RME/odontogram
# print denial, Phase 2 device lifecycle and Phase 3 cryptographic identity are
# all preserved.
