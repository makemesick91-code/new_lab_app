# IMPLEMENTATION-RME-BILLING-DISPUTE-ESCALATION-OPS-OQ-1
#
# Owner policy OPS-OQ-1 (approved for ALL branches) as code (rule 203):
#
#   A. Billing dispute (trx_rme_billing_disputes + append-only events). A REPORT
#      that an issued RME invoice is known or suspected to be wrong — not a
#      correction. Explicit state machine OPEN → UNDER_REVIEW → ESCALATED →
#      RESOLVED; one active dispute per invoice under the invoice row lock AND a
#      partial unique index; immutable report snapshot; RESOLVED terminal.
#
#   B. Payment hold on EVERY payment path (pay, visit + selected receivables,
#      control/carry-over, multi-invoice batches, retries, direct service calls):
#      decided under the invoice row lock, whole-batch refusal, audited after the
#      rollback and de-duplicated. Independent of D10; no switch can disable it.
#
#   C. Escalation to the branch authority — in-app notifications only, after
#      commit; failure never unwinds the dispute. Resolution only on a verifiable
#      outcome (applied correction newer than the report, or a second account's
#      confirmation of the unchanged original). No override, no fabricated Owner
#      approval.
#
#   D. Conservative authority: review_rme_billing_disputes to NO operational
#      role (Super Admin via '*'); view_rme_billing_disputes to Owner. Branch
#      reviewer is open owner question OPS-OQ-1a.
#
# One additive migration (two tables, partial unique index, PostgreSQL CHECKs);
# no backfill — no dispute is inferred from an existing invoice. Two new
# permissions (PermissionSeeder → RoleSeeder → permission:cache-reset). Blade
# views only (no JS/CSS/asset change, no npm build required).
#
# The SPN4 correction pilot (maker 29 / checker 1), D1/D1a/D1c/D1e, D7, D10,
# D21 (manual pricing), D28, OD-1/OD-1a are preserved; D21c, D21g, D22 stay
# PENDING. Refund, reversal, credit and Rp0 adjustment remain out of scope.
#
# Type FOUNDATION_SPRINT (audit level 3): new financial control + schema +
# permissions across RmeInvoice, AccessControl, providers, seeders, console.

