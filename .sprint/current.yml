# FIX-PDF-TEMPFILE-LEAK-1 — Sprint Manifest
#
# WHAT THIS SPRINT IS. The corrective sprint for a pre-existing test-infrastructure
# resource-lifecycle defect found after FIX-RECEIPT-PDF-TEXT-CONTIGUITY-1:
#
#   tests/Pest.php:1032
#   $path = tempnam(sys_get_temp_dir(), 'dms-pdf-').'.pdf';
#
# `tempnam()` does not merely reserve a name — it CREATES the file. Appending a
# suffix produced a SECOND path, and the helper's `finally` cleaned only that
# second path. Every PDF assertion in the suite therefore stranded one zero-byte
# orphan. Measured on the clean base authority 9576af9f: 55 accumulated
# `dms-pdf-*` orphans, 100% zero-byte, 0 carrying the `.pdf` suffix — proving the
# derived file was always cleaned and the allocation never was.
#
# ROOT CAUSE, NOT SYMPTOM. The fix removes the second artifact rather than adding
# a second unlink: the `tempnam()` allocation IS the document path. There is no
# path left to forget. Verified empirically that Poppler dispatches on the file
# header, not the filename — `pdftotext` and `pdfinfo` read the path identically
# with and without a `.pdf` suffix (poppler 26.01.0), so PDF_EXTENSION_REQUIRED
# is false. Dropping the suffix additionally keeps tempnam's 0600 mode and closes
# the window in which the never-atomically-reserved derived name could have been
# created by another process between derivation and write.
#
# WHAT WAS DELIBERATELY NOT DONE. No global /tmp glob cleanup — that would hide
# continued leakage and destroy pre-existing evidence. No `uniqid()` substitution
# — that would discard atomic allocation. No fixed filename — that would create
# collision risk between concurrent test processes. The 55 pre-existing orphans
# were measured, not deleted.
#
# SIBLING DEFECTS MEASURED, NOT REFACTORED. The same `tempnam(...).SUFFIX` shape
# exists at four other call sites (ffcache/.php, lrme-poppler/.pdf, leg|bad/.csv)
# and a separate no-cleanup leak at ctl3a-. Census: ffcache 77, ctl3a- 87,
# lrme-poppler 20, leg 4. They are recorded in the sprint doc as a follow-up
# candidate. They are NOT in scope: this sprint fixes the shared helper every PDF
# assertion routes through, and opportunistically refactoring unrelated temp
# helpers would widen a lifecycle fix into a test-suite rewrite.
#
# WHY A BEHAVIORAL GUARD AND NOT A GREP. The defect is filesystem lifecycle, so
# the guard interrogates the filesystem. A repo-wide textual ban on the shape
# would fail on those four unfixed siblings, and allowlisting them would bless a
# known leak — so the guard is scoped to the shared helper's actual behaviour.
# Its primary assertions are concurrency-immune (they name the exact handed-out
# path and the exact sibling the old derivation stranded) because a global temp
# directory count is not authoritative on a shared machine.
#
# FULL SUITE. Not authorised for this sprint. The previous authorisation was
# consumed by run 32700184849 and it FAILED. FULL_SUITE_EXECUTION_COUNT=0.
# Targeted reproduction only. This sprint may carry its own GO tag; it does NOT
# close the stabilization programme.

