# DMS-RME-REVISION-PROGRAM-6 (2026-11-06). Continuation of DMS-RME-REVISION-PROGRAM-1..5 under rule 221 §7. The owner
# approved, in the mission brief of 2026-11-06, an audit of handwriting (HW-01/02), the native odontogram (OD-01),
# prescriptions (RX-01), RME/odontogram/prescription print and PDF (PDF-01..03) and clinical evidence storage (SEC-01),
# with correction of VERIFIED defects only (CG-22: findings that need a product decision are recorded, not inferred).
# Verified and corrected (each reproduced RED on PostgreSQL 16 against the untouched base c78f15dc first):
#   P6-HW-01 a blank/invalid canvas created the canonical medical-record draft before validation (R5-3);
#   P6-HW-02 the handwriting object was written before its row with no compensation (R5-3);
#   P6-HW-03 a second-granular object key built from the RAW page let a refused or concurrent save replace committed
#            bytes and let two pages share one object;
#   P6-HW-04 saves of one book were not serialised (duplicate page-1 rows; page-N unique race -> HTTP 500);
#   P6-RX-01 a prescription update wrote the R/ canvas before decoding the signature; no failure removed a canvas;
#   P6-RX-02 a double-submitted prescription create raced UNIQUE(clinic_visit_id) into an HTTP 500;
#   P6-RX-03 the canvas route never bound its prescription, so stored canvases never loaded on screen;
#   P6-PDF-01/02 print embedded an empty <img>, threw an HTTP 500 on an unreadable object, embedded non-PNG bytes.
# Plus documentation drift (odontogram comments still describing the superseded consent gate) and coverage gaps
# closed for the odontogram authority matrix. No schema, migration, permission, route, JS/CSS or production package
# change. Foundation-First Sprint Lock stays ACTIVE (allowed category: clinical correctness / security fix). Full Suite
# deferred (CG-18), not passed.
# Carried forward: LEGACY-RME-PROGRAM-CLOSURE-1 stays CLOSED and inherited.
