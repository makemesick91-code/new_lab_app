# HARDENING-RME-BILLING-DISPUTE-BRANCH-REVIEWER-CONTROL-PAYMENT-1
#
# Program DAENGTISIAMS-RME-BILLING-CORRECTION, Sprint 1A — an extension of
# Sprint 1/7 (rule 203), not a new main sprint. Owner decisions OPS-OQ-1a and
# OPS-OQ-1b as code (rule 204):
#
#   A. OPS-OQ-1a — an EXPLICITLY designated branch responsible person may review
#      and resolve that branch's billing disputes. One row per (account, branch)
#      in mst_rme_billing_dispute_reviewers, created / revoked by an account
#      holding manage_rme_billing_dispute_reviewers (granted to NO operational
#      role; Super Admin via '*'). Never a role grant, so it cannot reach the
#      Front Office accounts through the Admin Klinik + Kasir union. The Owner
#      stays read-only and cannot be designated. A designee is re-checked as an
#      active account working in that branch, under the invoice + dispute locks
#      (designation read FOR SHARE; revocation locks it FOR UPDATE), and gains no
#      financial power.
#
#   B. OPS-OQ-1b — a Kontrol invoice may be paid ON ITS OWN while every
#      outstanding same-branch origin invoice is disputed:
#      RmePaymentService::payControlInvoiceOnly(), reached only by an explicit,
#      confirmed form. One payment on the Kontrol invoice; the origin's
#      receivable, status, version and dispute are untouched; the ordinary
#      combined payment is still refused whole. Same lock order as the ordinary
#      control path (Kontrol invoice, then origins) — no new lock edge.
#
# One additive migration (one table, partial unique index, PostgreSQL CHECKs); no
# backfill and no designation created by the deployment. One new permission
# (PermissionSeeder → permission:cache-reset; RoleSeeder unchanged). Blade views
# only (no JS/CSS/asset change, no npm build required).
#
# Preserved: rule 203 (all-branch hold, whole-batch refusal for every other path),
# the SPN4 correction pilot (maker 29 / checker 1), D1/D1a/D1c/D1e, D7, D10, D21,
# D28, OD-1/OD-1a, version binding (rule 191); D21c, D21g, D22 stay PENDING.
#
# Type FOUNDATION_SPRINT (audit level 3): new financial payment path + schema +
# permission + authorization model across RmeInvoice, AccessControl, routes,
# providers and seeders.

