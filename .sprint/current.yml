### WHAT THIS SPRINT FIXES
#
#   The GLOBAL TEMPORARY FULL-SUITE POLICY (#317/#318) existed in prose only.
#   Nothing in CI enforced it, so TWO automatic paths still reached the Full
#   Suite while the policy was ACTIVE:
#
#     A. the weekly `schedule` (cron '0 2 * * 0') — the briefed gap;
#     B. `push` to the base branch — i.e. EVERY fix squash-merge. Policy s6.1
#        handled this only by an after-the-fact `gh run cancel` precedent.
#
#   Policy s6.2 named narrowing these triggers as an available option requiring
#   separate explicit user authorisation. This sprint IS that authorisation, so
#   the change is pre-sanctioned by the policy rather than unilateral.
#
### WHAT IT DOES NOT DO
#
#   Does NOT retire the policy, run the Full Suite, open the consolidated
#   closure, create any deferred fix GO tag, change the expected failure
#   baseline (0), or hide any CI failure.
#
### FULL SUITE POSTURE
#
#   FULL_SUITE_STATUS          = SKIPPED_BY_GLOBAL_TEMPORARY_POLICY
#   FULL_SUITE_EXECUTION_COUNT = 0
#   GLOBAL_TEMPORARY_FULL_SUITE_POLICY_ACTIVE = YES
#
#   A sprint-specific governance GO tag is authorised for this sprint only, by
#   explicit user decision: its scope IS the mechanism that defers the suite.
