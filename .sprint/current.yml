# FEATURE-PATIENT-DUPLICATE-RESOLUTION-MERGE-1
#
# Duplikasi Pasien: one person who was registered as several patient rows is
# resolved to ONE canonical patient with ONE active Nomor RM, and every clinical,
# financial and legacy record is kept — ownership moves, nothing is deleted.
#
# Manual patient selection + bounded candidate detection (never auto-merge);
# field-by-field identity reconciliation with structured provenance (canonical
# patient choice is separate from the final identity values); maker-checker
# approval that runs the merge in ONE atomic transaction with row locks,
# live-schema registry check and a proven conservation check; old Nomor RM kept
# as a searchable alias; merged source is a read-only pointer that receives no
# new activity; Merge Reversal Review (safe only when provable, otherwise
# supervised reconciliation); light registration duplicate prevention.
# Additive migrations (3 tables + nullable merge columns on mst_patients);
# three new permissions; KTP/NIK masked everywhere, full pre-merge identity only
# encrypted at rest.

