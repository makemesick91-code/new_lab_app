# MONITORING-LOG-COVERAGE-ANCHOR-INJECTION-1 — Sprint Manifest
#
# Closes the coverage-anchor residual that MONITORING-LOG-TIMESTAMP-ROLLOVER-1 recorded
# but did not test: that `oldest_scanned_event_at` "may be anchorable by an injected valid
# ancient benign log line". It is, and the consequence is a false green.
#
# A log source larger than the scan budget is read tail-only, so its prefix is skipped.
# Coverage was then granted when the oldest event timestamp inside the SCANNED TAIL
# already sat before the lookback cutoff — reasoning that the skipped prefix must be older
# still. That silently assumed a strictly chronological file, and it made log CONTENT the
# authority over bytes the monitor never opened. Reproduced end to end: a real in-window
# `pilot.ERROR` in the unread prefix, one line beginning `[2019-01-01 00:00:00]` in the
# tail, and the section reported OK — "No fresh error events within lookback window."
# Two files identical but for that single line differed WATCH vs OK.
#
# Coverage is now a fact about the read: a source counts as covered only when the read
# began at byte 0. MonitoringLogScanCoverage takes byte offsets and no timestamp at all,
# so the comparison cannot be reintroduced by accident. `oldest_scanned_event_at` survives
# as an observation and decides nothing. The scan budget becomes the operator's lever, and
# is clamped so buying coverage can never become an unbounded read.

