# FEATURE-LEGACY-IMPORT-HUB-1A-RME-ACTIVATION — Sprint Manifest
#
# WHAT THIS SPRINT IS. FEATURE-LEGACY-IMPORT-HUB-1 left Legacy Patient and
# Legacy Odontogram end-to-end usable and Legacy RME with its CAPABILITY ON but
# NO branch admission and NO active migration wave — so every Legacy RME upload
# would still be refused server-side. This sprint closes that activation gap and
# makes the distinction impossible to mistake again.
#
# WHAT IS GENUINELY NEW IN CODE. Exactly one thing: the Import Hub stops
# publishing a permanently-true disclaimer for Legacy RME and instead REPORTS the
# evaluated operational state, composed read-only from the authorities that
# already decide it (LegacyRmeFeatureGuard, LegacyRmeBranchAdmissionService,
# LegacyRmeWaveBindingService, LegacyRmeOperationsGateService). Before this
# sprint the hub said "Aktif" for a surface that refuses every upload — the exact
# lie its own docblock says the page exists to prevent.
#
# WHAT IS DELIBERATELY NOT CHANGED. No gate is weakened, widened or reordered.
# No decision moves into the hub: the new state object composes the existing
# authorities and re-implements none of them, so it can only report what those
# services already decide. Admission remains config/deploy-time authority, the
# wave row remains the operational mirror, ROLL-4 can still only narrow, the
# branch is still derived from the Nomor RM and never read from a request, the
# per-branch/clinical-day ceiling stays 100, published archives stay immutable
# and corrections stay VOID + replacement.
#
# THE ACTIVATION ITSELF IS PRODUCTION OPERATIONS, NOT CODE. Admitting the
# eligible branches and registering/approving/activating the wave happens on the
# production host through the canonical commands, exactly as the runbook
# prescribes. This sprint ships the honesty fix, the contract tests that lock the
# composition, and the governance that records the four distinct states.

