# DMS-RME-REVISION-PROGRAM-2 (2026-11-05). Continuation of DMS-RME-REVISION-PROGRAM-1 under rule 221 §7. The owner
# approved, in the mission brief of 2026-11-05, exactly the six route-key follow-ups Program 1 recorded in rule 222
# §1.6 (CG-22: recorded, not inferred):
#   R-03..R-07  `{rmeInvoice}` (15 routes), `{medicalRecord}` (7), `{rmePrescription}` (4), `{consent}` (3) and
#               `{odontogram}` (3) bind a bigint `id()` and took any segment. On PostgreSQL a non-key segment answered
#               HTTP 500 with an ERROR line -- also for a user holding no permission, because implicit binding runs
#               before the permission middleware. Now constrained globally by App\Support\Routing\DatabaseRouteKey.
#   R-08        the five `oversight/rme/visits/{visit}` routes used `whereNumber` with an `int $visit` controller
#               argument: a number beyond PHP's integer range answered 500, and a leading-zero alias opened a real
#               visit. `visit` is a generic name, so it is constrained per route with DatabaseRouteKey::PATTERN.
# The Foundation-First Sprint Lock stays ACTIVE; this is an allowed category (security fix). No schema, permission,
# policy or frontend change. Full Suite deferred (CG-18), not passed.
# Carried forward: LEGACY-RME-PROGRAM-CLOSURE-1 stays CLOSED and inherited.
