      - name: Upload NSF-10 release evidence
        uses: actions/upload-artifact@v4
        with:
          name: nsf-10-release-evidence
          path: storage/ci-evidence
          retention-days: 30

  full_suite_gate:
    name: NSF-R011 Full Suite Gate
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_full_suite == true) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/feature/sprint-26-phase-26-8-stabilization-closure-go-watch-no-go-report')
    needs: [critical_test_gate, classify]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:dGVzdGluZ2tleXRlc3RpbmdrZXl0ZXN0aW5na2V5MTI=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, bcmath, gd, exif
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare CI evidence directory
        run: mkdir -p storage/ci-evidence storage/framework/{cache,sessions,views} bootstrap/cache

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run full Pest suite
        # CICD-CTRL-1: skipped only for a proven docs-only change (e.g. a
        # docs-only push to base). schedule/workflow_dispatch always resolve to
        # the strongest profile, so the weekly/manual full suite always runs.
        if: ${{ needs.classify.outputs.run_critical_tests != 'false' }}
        run: php artisan test 2>&1 | tee storage/ci-evidence/nsf-r011-full-suite.log

      - name: Note skipped full suite (docs-only change)
        if: ${{ needs.classify.outputs.run_critical_tests == 'false' }}
        run: |
          {
            echo "NSF-R011 full Pest suite SKIPPED for a docs-only change."
            echo "gate_profile=${{ needs.classify.outputs.gate_profile }}"
            echo "The weekly scheduled run and any manual dispatch still run the full suite."
          } | tee storage/ci-evidence/nsf-r011-full-suite.log

      - name: Write NSF-R011 full suite evidence summary
        run: |
          {
            echo "NSF-R011 Full Suite Evidence Gate"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "workflow_run_id=${{ github.run_id }}"
            echo "workflow_run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "commit=${{ github.sha }}"
            echo "gate=full_suite_gate"
            echo "result=passed"
          } > storage/ci-evidence/nsf-r011-full-suite.txt

      - name: Upload NSF-R011 full suite evidence
        uses: actions/upload-artifact@v4
        with:
          name: nsf-r011-full-suite-gate
          path: storage/ci-evidence/nsf-r011-full-suite.*
          retention-days: 30
