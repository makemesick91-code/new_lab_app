      - name: Check NSF-10 release evidence (ci profile)
        run: php artisan release:evidence-check --profile=ci --json | tee storage/ci-evidence/nsf-10-evidence-check.json

      - name: Release safety check (ci profile)
        run: php artisan foundation:release-safety-check --profile=ci --json | tee storage/ci-evidence/nsf-10-release-safety-check.json

      - name: Write NSF-10 evidence gate summary
