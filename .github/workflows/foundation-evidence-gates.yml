name: Foundation Evidence Gates

on:
  pull_request:
    branches:
      - feature/sprint-26-phase-26-8-stabilization-closure-go-watch-no-go-report
  push:
    branches:
      - feature/sprint-26-phase-26-8-stabilization-closure-go-watch-no-go-report
  workflow_dispatch:
    inputs:
      run_full_suite:
        description: Run full Pest suite (NSF-R011 full gate)
        type: boolean
        default: false
      # CICD-CTRL-3 — explicit runner routing override. Leaving this empty uses
      # the repository variable CI_RUNNER_MODE, which itself defaults to
      # github-hosted. Falling back to GitHub-hosted is always an explicit
      # operator action and always runs an equivalent gate, never a weaker one.
      runner_mode:
        description: 'Heavy CI runner mode'
        type: choice
        required: false
        default: repository-default
        options:
          - repository-default
          - github-hosted
          - self-hosted
  schedule:
    - cron: '0 2 * * 0'

concurrency:
  group: foundation-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CICD-CTRL-1 — Safe CI Runtime Control classifier.
  # Classifies the change set conservatively (default-strong) and exposes which
  # gates should run. It NEVER gates the always-on security/governance/
  # release-safety/evidence jobs; it only decides whether the expensive Pest
  # regression steps and additive module tests run. Any uncertainty resolves to
  # the strongest profile (unknown_high_risk) so everything runs.
  classify:
    name: CICD-CTRL Gate Classifier
    runs-on: ubuntu-latest
    outputs:
      gate_profile: ${{ steps.resolve.outputs.gate_profile }}
      run_critical_tests: ${{ steps.resolve.outputs.run_critical_tests }}
      run_ui_tests: ${{ steps.resolve.outputs.run_ui_tests }}
      run_permission_tests: ${{ steps.resolve.outputs.run_permission_tests }}
      run_inventory_tests: ${{ steps.resolve.outputs.run_inventory_tests }}
      run_rme_tests: ${{ steps.resolve.outputs.run_rme_tests }}
      run_lab_tests: ${{ steps.resolve.outputs.run_lab_tests }}
      run_full_suite: ${{ steps.resolve.outputs.run_full_suite }}
      # CICD-CTRL-3 — which runner the heavy gates target for this run.
      runner_mode: ${{ steps.runner.outputs.runner_mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CICD-CTRL-3 — resolve heavy-CI runner routing.
      # Precedence: explicit workflow_dispatch input > repository variable >
      # github-hosted. The default is fail-safe: if the variable is unset, the
      # runner is decommissioned, or the value is unrecognised, heavy CI stays
      # on GitHub-hosted infrastructure with no code change. This job itself
      # always runs on GitHub-hosted so a dead self-hosted runner can never stop
      # the routing decision from being made.
      - name: Resolve heavy CI runner mode (CICD-CTRL-3)
        id: runner
        env:
          DISPATCH_MODE: ${{ inputs.runner_mode }}
          REPO_MODE: ${{ vars.CI_RUNNER_MODE }}
        run: |
          MODE="${DISPATCH_MODE:-}"
          # 'repository-default' means "no explicit override" — defer to the
          # repository variable, then to the fail-safe github-hosted default.
          [ "$MODE" = "repository-default" ] && MODE=""
          [ -z "$MODE" ] && MODE="${REPO_MODE:-}"
          [ -z "$MODE" ] && MODE="github-hosted"
          case "$MODE" in
            self-hosted|github-hosted) ;;
            *)
              echo "Unrecognised runner mode '$MODE' — falling back to github-hosted."
              MODE="github-hosted"
              ;;
          esac
          echo "runner_mode=$MODE" >> "$GITHUB_OUTPUT"
          {
            echo "CICD-CTRL-3 heavy CI runner mode: $MODE"
            echo "Exactly one NSF-R011 Critical Test Gate variant runs; the other is skipped."
            echo "A self-hosted outage QUEUES the gate — it never lets it silently pass."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Resolve safe CI gates (CICD-CTRL-1)
        id: resolve
        run: |
          chmod +x scripts/ci/resolve-gates.sh
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" || true
            BASE="origin/${{ github.base_ref }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi
          echo "Resolving gates: event=${{ github.event_name }} base=$BASE head=$HEAD_SHA"
          bash scripts/ci/resolve-gates.sh --base "$BASE" --head "$HEAD_SHA" --github-output 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Gate decision (summary)
        run: |
          echo "gate_profile=${{ steps.resolve.outputs.gate_profile }}"
          echo "run_critical_tests=${{ steps.resolve.outputs.run_critical_tests }}"
          echo "run_full_suite=${{ steps.resolve.outputs.run_full_suite }}"
          echo "Always-on gates (quality, release-safety, release-evidence) run regardless."

  quality_gate:
    name: NSF-R012 Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, pdo_sqlite, bcmath, gd, exif
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        shell: bash
        run: npm run build 2>&1 | tee storage/ci-evidence/nsf-r012-build.log

      - name: Pint style gate
        shell: bash
        run: ./vendor/bin/pint --test 2>&1 | tee storage/ci-evidence/nsf-r012-pint.log

      - name: Git diff check
        run: git diff --check

      - name: Write NSF-R012 evidence summary
        run: |
          mkdir -p storage/ci-evidence
          {
            echo "NSF-R012 Build + Pint Evidence Gate"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "workflow_run_id=${{ github.run_id }}"
            echo "workflow_run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "commit=${{ github.sha }}"
            echo "result=passed"
          } > storage/ci-evidence/nsf-r012-build-pint.txt

      - name: Upload NSF-R012 evidence
        uses: actions/upload-artifact@v4
        with:
          name: nsf-r012-quality-gate
          path: storage/ci-evidence/nsf-r012-*
          retention-days: 30

  # CICD-CTRL-3 — GitHub-hosted variant of the critical regression gate.
  # This and `critical_test_gate_self_hosted` share the SAME check name
  # ("NSF-R011 Critical Test Gate") and mutually exclusive `if` conditions, so
  # the required check name is preserved and appears exactly once per run.
  # This variant is the default and the explicit fallback target.
  critical_test_gate:
    name: NSF-R011 Critical Test Gate
    runs-on: ubuntu-latest
    needs: [quality_gate, classify]
    # Runs whenever the self-hosted variant does not. A pull request from a fork
    # is ALWAYS routed here, never to the dedicated runner — so untrusted code
    # is redirected to neutral infrastructure rather than silently skipped.
    if: >-
      needs.classify.outputs.runner_mode != 'self-hosted' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name != github.repository)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:dGVzdGluZ2tleXRlc3RpbmdrZXl0ZXN0aW5na2V5MTI=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, bcmath, gd, exif
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare CI evidence directory
        run: mkdir -p storage/ci-evidence storage/framework/{cache,sessions,views} bootstrap/cache

      # CICD-CTRL-3 — hard production-database isolation guard. Runs BEFORE any
      # migration. Fails closed unless the active database is local and carries
      # a CI/test name.
      - name: Assert non-production database (CICD-CTRL-3)
        run: php artisan ci:assert-non-production-database

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run critical regression tests
        # CICD-CTRL-1: runs for every profile EXCEPT a proven docs-only change.
        # Any uncertainty leaves run_critical_tests unset/true, so this runs.
        #
        # CICD-CTRL-3 strict exit propagation: `| tee` returns tee's status, so
        # a failing suite — or a PHP fatal that runs zero tests — used to render
        # as a green step. `shell: bash` runs with `-eo pipefail`; the status is
        # captured explicitly so evidence is still written before it propagates.
        if: ${{ needs.classify.outputs.run_critical_tests != 'false' }}
        shell: bash
        run: |
          set +e
          php artisan test --filter='FoundationGovernance|Nsf7|NsfGovernance|DmoGovernance|Dmo3|Dq31|Dq3SourceDocumentBatch|Dq2BatchGovernance|Dq1|RmeDoctorCashierCompletionGate|RmeRoomAssignmentGate|MedicalRecordFinalization|CashierBilling|RmePayment|PatientOutstandingReceivableCarryOver|PatientCentricRmWorkspace|LegacyRme|PatientEarliestNativeRmeDateResolver' \
            2>&1 | tee storage/ci-evidence/nsf-r011-critical-tests.log
          TEST_STATUS="${PIPESTATUS[0]}"
          set -e
          {
            echo "runner=github-hosted"
            echo "critical_test_exit_status=${TEST_STATUS}"
            grep -aE '^\s*(Tests:|Fatal error)' storage/ci-evidence/nsf-r011-critical-tests.log | tail -2
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if grep -qa 'Allowed memory size' storage/ci-evidence/nsf-r011-critical-tests.log; then
            echo "::error::CI runtime ran out of memory — zero tests may have executed."
          fi
          exit "$TEST_STATUS"

      - name: Note skipped critical regression tests (docs-only change)
        if: ${{ needs.classify.outputs.run_critical_tests == 'false' }}
        run: |
          {
            echo "NSF-R011 critical regression tests SKIPPED for a docs-only change."
            echo "gate_profile=${{ needs.classify.outputs.gate_profile }}"
            echo "Reason: CICD-CTRL-1 classifier resolved a docs_only change set (Markdown only)."
            echo "Governance, security, release-safety, and release-evidence gates still ran."
          } | tee storage/ci-evidence/nsf-r011-critical-tests.log

      - name: Run governance audit commands
        # Always runs — governance is never gated by the classifier.
        run: bash scripts/ci/foundation-evidence-gates.sh --critical-only

      - name: Write NSF-R011 critical evidence summary
        run: |
          {
            echo "NSF-R011 Critical Regression Evidence Gate"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "workflow_run_id=${{ github.run_id }}"
            echo "workflow_run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "commit=${{ github.sha }}"
            echo "gate=critical_test_gate"
            echo "result=passed"
          } > storage/ci-evidence/nsf-r011-critical-tests.txt

      - name: Upload NSF-R011 critical evidence
        uses: actions/upload-artifact@v4
        with:
          name: nsf-r011-critical-test-gate
          path: |
            storage/ci-evidence/nsf-r011-*
            storage/ci-evidence/foundation-summary.txt
            storage/ci-evidence/dq-audits.txt
          retention-days: 30

  # CICD-CTRL-3 — self-hosted variant of the critical regression gate.
  #
  # Shares the check name "NSF-R011 Critical Test Gate" with the GitHub-hosted
  # variant above and is mutually exclusive with it, so the required check name
  # is preserved. Differences are deliberate and limited to infrastructure:
  #
  #  - Targets the full label set [self-hosted, linux, x64, daengtisia-ci]. A
  #    bare `self-hosted` runs-on is forbidden: it would let any other runner on
  #    the account pick up this job.
  #  - No Docker service container. The runner has NO Docker and its service
  #    user is NOT in the docker group (that group is root-equivalent). It uses
  #    the runner's local, loopback-only PostgreSQL CI database instead.
  #  - No setup-php / setup-node action. The runtime is pre-provisioned so CI
  #    jobs never need sudo, and the health check asserts the exact version.
  #  - No actions/cache. The runner's own Composer/npm caches are persistent;
  #    round-tripping them through GitHub would defeat the point. `composer
  #    install` against composer.lock remains the authoritative install.
  #
  # Untrusted-PR protection: this job never runs for a pull request from a fork,
  # so fork code can never execute on the dedicated runner or reach its secrets.
  critical_test_gate_self_hosted:
    name: NSF-R011 Critical Test Gate
    runs-on: [self-hosted, linux, x64, daengtisia-ci]
    needs: [quality_gate, classify]
    if: >-
      needs.classify.outputs.runner_mode == 'self-hosted' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:dGVzdGluZ2tleXRlc3RpbmdrZXl0ZXN0aW5na2V5MTI=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      # Port 5433 is the pinned postgres:16 CI database (systemd unit
      # ci-pg16.service, rootless Podman, host-networked, loopback-only).
      #
      # The runner host's own PostgreSQL 18 on 5432 is deliberately NOT used:
      # the authoritative gate runs postgres:16, and the version difference
      # produced 7 self-hosted-only failures (aborted-transaction cascades out
      # of Dq1AuditService). On postgres:16 the self-hosted failure SET is
      # identical to the GitHub-hosted one. The host PostgreSQL is left
      # untouched for the co-tenant project on this machine.
      DB_PORT: 5433
      DB_DATABASE: daengtisia_ci
      DB_USERNAME: daengtisia_ci_user
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      # Authoritative PHP runtime, supplied by the pinned image rather than by
      # the host (Ubuntu 26.04 ships only PHP 8.5).
      CI_PHP_IMAGE: localhost/daengtisia-ci-php:8.3
      REQUIRED_PHP: '8.3'
    steps:
      # A persistent runner keeps its workspace between jobs; `clean: true`
      # guarantees the checkout starts from a pristine tree.
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Runner health check (CICD-CTRL-3)
        run: |
          chmod +x scripts/ci/self-hosted-runner-health.sh scripts/ci/self-hosted-php.sh
          bash scripts/ci/self-hosted-runner-health.sh 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      # Equivalence proof: the authoritative gate pins PHP 8.3, and the host
      # here ships 8.5, so the runtime MUST come from the pinned image. This
      # step fails the job rather than let a divergent PHP run the suite.
      - name: Assert authoritative PHP runtime (CICD-CTRL-3)
        run: |
          ACTUAL="$(bash scripts/ci/self-hosted-php.sh php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')"
          FULL="$(bash scripts/ci/self-hosted-php.sh php -r 'echo PHP_VERSION;')"
          echo "authoritative_php_required=${REQUIRED_PHP}"
          echo "self_hosted_php_actual=${ACTUAL} (${FULL})"
          if [ "$ACTUAL" != "$REQUIRED_PHP" ]; then
            echo "::error::Self-hosted runtime is PHP ${ACTUAL}; the authoritative gate requires ${REQUIRED_PHP}."
            exit 1
          fi
          {
            echo "CICD-CTRL-3 runtime equivalence"
            echo "required=${REQUIRED_PHP} actual=${ACTUAL} (${FULL})"
            echo "engine=rootless podman, image=${CI_PHP_IMAGE}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # CICD-CTRL-3 self-hosted smoke evidence. Prints the acceptance proof
      # points into the job log and step summary so a run can be audited after
      # the fact. Prints no secret and no database credential.
      - name: Self-hosted runner smoke evidence (CICD-CTRL-3)
        run: |
          {
            echo "CICD-CTRL-3 self-hosted smoke"
            echo "hostname=$(hostname)"
            echo "runner_user=$(id -un) uid=$(id -u)"
            echo "is_root=$([ "$(id -u)" -eq 0 ] && echo yes || echo no)"
            echo "groups=$(id -nG)"
            echo "container_engine=$(podman --version) rootless=$(podman info --format '{{.Host.Security.Rootless}}')"
            echo "ci_php=$(bash scripts/ci/self-hosted-php.sh php -r 'echo PHP_VERSION;')"
            echo "ci_composer=$(bash scripts/ci/self-hosted-php.sh composer --version --no-interaction 2>/dev/null | head -1)"
            echo "ci_pdfinfo=$(bash scripts/ci/self-hosted-php.sh sh -c 'pdfinfo -v 2>&1 | head -1')"
            echo "host_node=$(node --version) host_npm=$(npm --version)"
            echo "postgres_local=$(psql --version)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # Must be false: the docker group is root-equivalent.
          if id -nG | tr ' ' '\n' | grep -qx docker; then
            echo "::error::runner user is in the docker group"; exit 1
          fi

      - name: Install Composer dependencies
        run: bash scripts/ci/self-hosted-php.sh composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare CI evidence directory
        run: mkdir -p storage/ci-evidence storage/framework/{cache,sessions,views} bootstrap/cache

      # Hard production-database isolation guard. On a persistent runner this
      # matters more than on an ephemeral one: state survives between jobs, so a
      # misconfigured environment must never reach a real database. It runs in
      # the same runtime that will run the migrations.
      - name: Assert non-production database (CICD-CTRL-3)
        run: bash scripts/ci/self-hosted-php.sh php artisan ci:assert-non-production-database

      - name: Run migrations
        run: bash scripts/ci/self-hosted-php.sh php artisan migrate --force

      - name: Run critical regression tests
        # Identical filter to the GitHub-hosted variant — the gate is equivalent,
        # only the infrastructure differs.
        if: ${{ needs.classify.outputs.run_critical_tests != 'false' }}
        # Identical strict exit propagation to the GitHub-hosted variant.
        shell: bash
        run: |
          set +e
          bash scripts/ci/self-hosted-php.sh php artisan test --filter='FoundationGovernance|Nsf7|NsfGovernance|DmoGovernance|Dmo3|Dq31|Dq3SourceDocumentBatch|Dq2BatchGovernance|Dq1|RmeDoctorCashierCompletionGate|RmeRoomAssignmentGate|MedicalRecordFinalization|CashierBilling|RmePayment|PatientOutstandingReceivableCarryOver|PatientCentricRmWorkspace|LegacyRme|PatientEarliestNativeRmeDateResolver' \
            2>&1 | tee storage/ci-evidence/nsf-r011-critical-tests.log
          TEST_STATUS="${PIPESTATUS[0]}"
          set -e
          {
            echo "runner=self-hosted/daengtisia-ci"
            echo "critical_test_exit_status=${TEST_STATUS}"
            grep -aE '^\s*(Tests:|Fatal error)' storage/ci-evidence/nsf-r011-critical-tests.log | tail -2
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if grep -qa 'Allowed memory size' storage/ci-evidence/nsf-r011-critical-tests.log; then
            echo "::error::CI runtime ran out of memory — zero tests may have executed."
          fi
          exit "$TEST_STATUS"

      - name: Note skipped critical regression tests (docs-only change)
        if: ${{ needs.classify.outputs.run_critical_tests == 'false' }}
        run: |
          {
            echo "NSF-R011 critical regression tests SKIPPED for a docs-only change."
            echo "gate_profile=${{ needs.classify.outputs.gate_profile }}"
            echo "Reason: CICD-CTRL-1 classifier resolved a docs_only change set (Markdown only)."
            echo "Governance, security, release-safety, and release-evidence gates still ran."
          } | tee storage/ci-evidence/nsf-r011-critical-tests.log

      - name: Run governance audit commands
        # Always runs — governance is never gated by the classifier.
        run: bash scripts/ci/self-hosted-php.sh bash scripts/ci/foundation-evidence-gates.sh --critical-only

      - name: Write NSF-R011 critical evidence summary
        run: |
          {
            echo "NSF-R011 Critical Regression Evidence Gate"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "workflow_run_id=${{ github.run_id }}"
            echo "workflow_run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "commit=${{ github.sha }}"
            echo "gate=critical_test_gate"
            echo "runner=self-hosted/daengtisia-ci"
            echo "runtime=rootless-podman ${CI_PHP_IMAGE}"
            echo "php=${REQUIRED_PHP}"
            echo "result=passed"
          } > storage/ci-evidence/nsf-r011-critical-tests.txt

      - name: Upload NSF-R011 critical evidence
        uses: actions/upload-artifact@v4
        with:
          name: nsf-r011-critical-test-gate
          path: |
            storage/ci-evidence/nsf-r011-*
            storage/ci-evidence/foundation-summary.txt
            storage/ci-evidence/dq-audits.txt
          retention-days: 30

      # Persistent-runner hygiene. Scoped to the job workspace only — never an
      # arbitrary directory — and it removes generated CI artifacts, not the
      # runner's package caches.
      - name: Clean workspace artifacts
        if: always()
        run: |
          rm -rf storage/ci-evidence
          rm -f .env
          git -C "$GITHUB_WORKSPACE" clean -fdx -e vendor -e node_modules >/dev/null 2>&1 || true

  # CICD-CTRL-1 — Selective Module Gate (tier 3).
  # Runs in PARALLEL with the critical gate and ADDS module-specific coverage
  # (Inventory / Lab / UI / Permission) for the modules the classifier detected
  # in the change set. These suites are not part of the critical filter, so this
  # is additive safety; it never reduces the critical gate. Skipped only for a
  # docs-only change or when no relevant module was touched.
  selective_module_gate:
    name: CICD-CTRL Selective Module Gate
    runs-on: ubuntu-latest
    needs: [quality_gate, classify]
    if: >-
      needs.classify.outputs.run_critical_tests != 'false' &&
      (needs.classify.outputs.run_inventory_tests == 'true' ||
       needs.classify.outputs.run_lab_tests == 'true' ||
       needs.classify.outputs.run_ui_tests == 'true' ||
       needs.classify.outputs.run_permission_tests == 'true')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:dGVzdGluZ2tleXRlc3RpbmdrZXl0ZXN0aW5na2V5MTI=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, bcmath, gd, exif
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare CI evidence directory
        run: mkdir -p storage/ci-evidence storage/framework/{cache,sessions,views} bootstrap/cache

      # CICD-CTRL-3 — hard production-database isolation guard, before migrations.
      - name: Assert non-production database (CICD-CTRL-3)
        run: php artisan ci:assert-non-production-database

      - name: Run migrations
        run: php artisan migrate --force

      - name: Inventory module tests
        if: ${{ needs.classify.outputs.run_inventory_tests == 'true' }}
        shell: bash
        run: php artisan test --filter='Inventory' 2>&1 | tee storage/ci-evidence/cicd-ctrl-inventory-tests.log

      - name: Lab module tests
        if: ${{ needs.classify.outputs.run_lab_tests == 'true' }}
        shell: bash
        run: php artisan test --filter='Lab' 2>&1 | tee storage/ci-evidence/cicd-ctrl-lab-tests.log

      - name: UI / UIX module tests
        if: ${{ needs.classify.outputs.run_ui_tests == 'true' }}
        shell: bash
        run: php artisan test --filter='Ui' 2>&1 | tee storage/ci-evidence/cicd-ctrl-ui-tests.log

      - name: Permission / access-control tests
        if: ${{ needs.classify.outputs.run_permission_tests == 'true' }}
        shell: bash
        run: php artisan test --filter='Permission|AccessControl' 2>&1 | tee storage/ci-evidence/cicd-ctrl-permission-tests.log

      - name: Write selective module gate summary
        run: |
          {
            echo "CICD-CTRL Selective Module Gate"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit=${{ github.sha }}"
            echo "gate_profile=${{ needs.classify.outputs.gate_profile }}"
            echo "inventory=${{ needs.classify.outputs.run_inventory_tests }}"
            echo "lab=${{ needs.classify.outputs.run_lab_tests }}"
            echo "ui=${{ needs.classify.outputs.run_ui_tests }}"
            echo "permission=${{ needs.classify.outputs.run_permission_tests }}"
            echo "result=passed"
          } > storage/ci-evidence/cicd-ctrl-selective-module-gate.txt

      - name: Upload selective module gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: cicd-ctrl-selective-module-gate
          path: storage/ci-evidence/cicd-ctrl-*
          retention-days: 30

  release_safety_gate:
    name: NSF-9 Release Safety & Automated Smoke Gate
    runs-on: ubuntu-latest
    # CICD-CTRL-3: depend on BOTH critical-gate variants. Exactly one runs and
    # the other is skipped, and a skipped `needs` would otherwise skip this
    # always-on gate too — silently dropping NSF-9 whenever heavy CI is routed
    # to the self-hosted runner. Require that ONE variant actually succeeded, so
    # a failing critical gate still blocks this, but a skipped sibling does not.
    needs: [critical_test_gate, critical_test_gate_self_hosted]
    if: >-
      !cancelled() &&
      (needs.critical_test_gate.result == 'success' ||
       needs.critical_test_gate_self_hosted.result == 'success')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:dGVzdGluZ2tleXRlc3RpbmdrZXl0ZXN0aW5na2V5MTI=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, bcmath, gd, exif
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare CI evidence directory
        run: mkdir -p storage/ci-evidence storage/framework/{cache,sessions,views} bootstrap/cache

      # CICD-CTRL-3 — hard production-database isolation guard, before migrations.
      - name: Assert non-production database (CICD-CTRL-3)
        run: php artisan ci:assert-non-production-database

      - name: Run migrations
        run: php artisan migrate --force

      - name: Foundation roadmap check
        run: php artisan architecture:foundation-roadmap-check 2>&1 | tee storage/ci-evidence/nsf-9-roadmap-check.txt

      - name: Feature flags governance
        run: php artisan foundation:feature-flags --json 2>&1 | tee storage/ci-evidence/nsf-9-feature-flags.json

      - name: Cache governance check
        run: |
          php artisan foundation:cache-governance-check
          php artisan foundation:cache-governance-check --json > storage/ci-evidence/cache-governance-check.json

      - name: Queue/idempotency/outbox governance check (QUEUE-1)
        run: |
          php artisan foundation:queue-governance-check
          php artisan foundation:queue-governance-check --json > storage/ci-evidence/queue-governance-check.json
          php artisan foundation:queue-retry-failed-job-check --json > storage/ci-evidence/queue-retry-failed-job-check.json
          php artisan foundation:idempotency-outbox-check --json > storage/ci-evidence/idempotency-outbox-check.json
          php artisan foundation:developer-console-check --json > storage/ci-evidence/developer-console-check.json
          php artisan foundation:health-check --json > storage/ci-evidence/health-check-check.json
          php artisan foundation:security-compliance-check --json > storage/ci-evidence/security-compliance-check.json
          php artisan foundation:idempotency-audit --json > storage/ci-evidence/idempotency-audit.json
          php artisan foundation:outbox-audit --json > storage/ci-evidence/outbox-audit.json

      - name: CI/CD enterprise gate check (ENT-10)
        run: |
          php artisan foundation:cicd-enterprise-gate-check
          php artisan foundation:cicd-enterprise-gate-check --json > storage/ci-evidence/cicd-enterprise-gate-check.json

      - name: Deployment & rollback automation check (ENT-11)
        run: |
          php artisan foundation:deployment-rollback-check
          php artisan foundation:deployment-rollback-check --json > storage/ci-evidence/deployment-rollback-check.json

      - name: Backup & disaster recovery automation check (ENT-12)
        run: |
          php artisan foundation:backup-dr-check
          php artisan foundation:backup-dr-check --json > storage/ci-evidence/backup-dr-check.json

      - name: Load test 5 cabang baseline check (ENT-13)
        run: |
          php artisan foundation:load-test-baseline-check
          php artisan foundation:load-test-baseline-check --json > storage/ci-evidence/load-test-baseline-check.json

      - name: Load test scale projection check (ENT-14)
        run: |
          php artisan foundation:load-test-scale-projection-check
          php artisan foundation:load-test-scale-projection-check --json > storage/ci-evidence/load-test-scale-projection-check.json

      - name: Enterprise documentation & runbook check (ENT-15)
        run: |
          php artisan foundation:enterprise-documentation-check
          php artisan foundation:enterprise-documentation-check --json > storage/ci-evidence/enterprise-documentation-check.json

      - name: Enterprise foundation closure GO/NO-GO check (ENT-16)
        run: |
          php artisan foundation:enterprise-closure-check
          php artisan foundation:enterprise-closure-check --json > storage/ci-evidence/enterprise-closure-check.json

      - name: DB performance governance check (DBPERF-1)
        run: |
          php artisan foundation:db-performance-check
          php artisan foundation:db-performance-check --json > storage/ci-evidence/db-performance-check.json

      - name: PgBouncer readiness & PostgreSQL runtime tuning check (DBPERF-2)
        run: |
          php artisan foundation:postgres-runtime-check
          php artisan foundation:postgres-runtime-check --json > storage/ci-evidence/postgres-runtime-check.json

      - name: Reporting summary governance check (RPT-1)
        run: |
          php artisan foundation:reporting-summary-check
          php artisan foundation:reporting-summary-check --json > storage/ci-evidence/reporting-summary-check.json
          php artisan foundation:reporting-summary-refresh --dry-run --json > storage/ci-evidence/reporting-summary-refresh-dry-run.json

      - name: Release safety check
        run: php artisan foundation:release-safety-check --json 2>&1 | tee storage/ci-evidence/nsf-9-release-safety.json

      - name: Automated smoke (command-readiness only, no base URL in CI)
        run: php artisan release:automated-smoke --json 2>&1 | tee storage/ci-evidence/nsf-9-automated-smoke.json

      - name: Write NSF-9 evidence summary
        run: |
          {
            echo "NSF-9 Release Safety & Automated Smoke Gate"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "workflow_run_id=${{ github.run_id }}"
            echo "workflow_run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "commit=${{ github.sha }}"
            echo "gate=release_safety_gate"
            echo "result=passed"
          } > storage/ci-evidence/nsf-9-release-safety-gate.txt

      - name: Upload NSF-9 release safety evidence
        uses: actions/upload-artifact@v4
        with:
          name: nsf-9-release-safety-gate
          path: storage/ci-evidence/nsf-9-*
          retention-days: 30

  nsf10_release_evidence_gate:
    name: NSF-10 Release Evidence Gate
    runs-on: ubuntu-latest
    # Only needs NSF-9, which now tolerates a skipped critical-gate sibling.
    needs: release_safety_gate
    if: ${{ !cancelled() && needs.release_safety_gate.result == 'success' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testing"
